<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: "Inter", sans-serif; margin: 0; padding: 24px; background: #fafaf8; color: #0f172a; }
    h1 { font-size: 18px; font-weight: 700; margin: 0 0 4px; }
    .subtitle { font-size: 13px; color: #64748b; margin: 0 0 20px; }
    #chart { width: 100%; }
    .source { font-size: 11px; color: #94a3b8; margin-top: 12px; }
    #tip {
      position: fixed; pointer-events: none; background: #1e293b; color: #f1f5f9;
      padding: 6px 10px; border-radius: 6px; font-size: 12px; font-family: "JetBrains Mono", monospace;
      opacity: 0; transition: opacity 0.1s; white-space: nowrap; z-index: 100;
    }
  </style>
</head>
<body>
  <h1>Tuberculosis Incidence: 2000 vs. 2022</h1>
  <p class="subtitle">New TB cases per 100,000 people. Ethiopia cut its rate by 70%; Indonesia and Bangladesh made almost no progress.</p>
  <div id="chart"></div>
  <p class="source">Source: World Bank — SH.TBS.INCD (WHO Global TB Programme)</p>
  <div id="tip"></div>
  <script>
    const data = [
      {"n":"India","a":322,"b":196},
      {"n":"China","a":107,"b":52},
      {"n":"Indonesia","a":370,"b":375},
      {"n":"Bangladesh","a":221,"b":221},
      {"n":"Congo, Dem. Rep.","a":612,"b":392},
      {"n":"Brazil","a":49,"b":49},
      {"n":"Kenya","a":451,"b":238},
      {"n":"Ethiopia","a":489,"b":146},
      {"n":"Cambodia","a":853,"b":277}
    ];

    const W = 680, H = 560;
    const pad = { left: 120, right: 130, top: 50, bottom: 30 };

    const allVals = data.flatMap(d => [d.a, d.b]);
    const minV = 0, maxV = 900;
    const scale = v => pad.top + (maxV - v) / (maxV - minV) * (H - pad.top - pad.bottom);
    const xL = pad.left, xR = W - pad.right;

    function colorFor(d) {
      const pctChange = (d.b - d.a) / d.a * 100;
      if (pctChange > -5) return "#EA5E33";
      if (pctChange > -30) return "#F29A44";
      if (pctChange > -50) return "#C49A45";
      if (pctChange > -65) return "#5B9E78";
      return "#3D7A5A";
    }

    function resolveCollisions(items, minGap) {
      const sorted = items.slice().sort((a, b) => a.y - b.y);
      for (let pass = 0; pass < 40; pass++) {
        let moved = false;
        for (let i = 1; i < sorted.length; i++) {
          const gap = sorted[i].y - sorted[i - 1].y;
          if (gap < minGap) {
            const shift = (minGap - gap) / 2;
            sorted[i - 1].y -= shift;
            sorted[i].y += shift;
            moved = true;
          }
        }
        if (!moved) break;
      }
      return sorted;
    }

    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    svg.setAttribute("width", "100%");
    svg.style.maxWidth = "720px";
    svg.style.display = "block";

    function mkEl(tag, attrs) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
      return el;
    }

    // Column headers
    const hdr = mkEl("text", { x: xL, y: pad.top - 20, "text-anchor": "middle", "font-size": "10", "font-family": "JetBrains Mono", fill: "#7A786F" });
    hdr.textContent = "2000";
    svg.appendChild(hdr);
    const hdr2 = mkEl("text", { x: xR, y: pad.top - 20, "text-anchor": "middle", "font-size": "10", "font-family": "JetBrains Mono", fill: "#7A786F" });
    hdr2.textContent = "2022";
    svg.appendChild(hdr2);

    // Axis lines
    svg.appendChild(mkEl("line", { x1: xL, y1: pad.top - 10, x2: xL, y2: H - pad.bottom, stroke: "#C2C0B5", "stroke-width": "1" }));
    svg.appendChild(mkEl("line", { x1: xR, y1: pad.top - 10, x2: xR, y2: H - pad.bottom, stroke: "#C2C0B5", "stroke-width": "1" }));

    // Grid lines
    [0, 200, 400, 600, 800].forEach(v => {
      const y = scale(v);
      svg.appendChild(mkEl("line", { x1: xL - 4, y1: y, x2: xR + 4, y2: y, stroke: "#e5e3dc", "stroke-width": "0.5" }));
    });

    // Prepare labels
    const leftLabels = data.map(d => ({ name: d.n, y: scale(d.a), v: d.a }));
    const rightLabels = data.map(d => ({ name: d.n, y: scale(d.b), v: d.b }));
    const leftResolved = resolveCollisions(leftLabels, 14);
    const rightResolved = resolveCollisions(rightLabels, 14);

    // Draw rows
    const groups = [];
    data.forEach(d => {
      const color = colorFor(d);
      const g = mkEl("g", {});
      g.style.cursor = "pointer";

      const yA = scale(d.a), yB = scale(d.b);

      // Connecting line
      const line = mkEl("line", { x1: xL, y1: yA, x2: xR, y2: yB, stroke: color, "stroke-width": "1.5" });
      g.appendChild(line);

      // Dots
      g.appendChild(mkEl("circle", { cx: xL, cy: yA, r: "3.5", fill: color }));
      g.appendChild(mkEl("circle", { cx: xR, cy: yB, r: "3.5", fill: color }));

      // Labels
      const lR = leftResolved.find(r => r.name === d.n);
      const rR = rightResolved.find(r => r.name === d.n);
      const lLblY = lR ? lR.y : yA;
      const rLblY = rR ? rR.y : yB;

      if (Math.abs(lLblY - yA) > 2) {
        g.appendChild(mkEl("line", { x1: xL - 4, y1: yA, x2: xL - 4, y2: lLblY, stroke: color, "stroke-width": "0.5", opacity: "0.4" }));
      }
      if (Math.abs(rLblY - yB) > 2) {
        g.appendChild(mkEl("line", { x1: xR + 4, y1: yB, x2: xR + 4, y2: rLblY, stroke: color, "stroke-width": "0.5", opacity: "0.4" }));
      }

      const lLbl = mkEl("text", { x: xL - 7, y: lLblY + 3.5, "text-anchor": "end", "font-size": "9.5", "font-family": "JetBrains Mono", fill: color });
      lLbl.textContent = `${d.n}  ${d.a}`;
      g.appendChild(lLbl);

      const rLbl = mkEl("text", { x: xR + 7, y: rLblY + 3.5, "text-anchor": "start", "font-size": "9.5", "font-family": "JetBrains Mono", fill: color });
      const pct = Math.round((d.b - d.a) / d.a * 100);
      rLbl.textContent = `${d.b}  ${pct > 0 ? "+" : ""}${pct}%`;
      g.appendChild(rLbl);

      // Wide invisible hit area
      const hit = mkEl("line", { x1: xL, y1: yA, x2: xR, y2: yB, stroke: "transparent", "stroke-width": "12" });
      g.appendChild(hit);

      groups.push({ g, line, lLbl, rLbl, d, color });
      svg.appendChild(g);
    });

    // Legend
    const legendItems = [
      { label: ">65% decline", color: "#3D7A5A" },
      { label: "33–65% decline", color: "#5B9E78" },
      { label: "10–33% decline", color: "#C49A45" },
      { label: "<10% decline", color: "#F29A44" },
      { label: "No progress", color: "#EA5E33" }
    ];
    legendItems.forEach((li, i) => {
      const lx = xL + i * 116;
      const ly = H - 8;
      svg.appendChild(mkEl("rect", { x: lx, y: ly - 8, width: 8, height: 8, fill: li.color, rx: "1" }));
      const t = mkEl("text", { x: lx + 11, y: ly - 1, "font-size": "8.5", "font-family": "Inter", fill: "#64748b" });
      t.textContent = li.label;
      svg.appendChild(t);
    });

    // Interactivity
    const tip = document.getElementById("tip");
    groups.forEach(({ g, line, lLbl, rLbl, d, color }) => {
      g.addEventListener("mouseenter", () => {
        groups.forEach(other => {
          const same = other.d.n === d.n;
          other.line.setAttribute("opacity", same ? "1" : "0.1");
          other.lLbl.setAttribute("opacity", same ? "1" : "0.15");
          other.rLbl.setAttribute("opacity", same ? "1" : "0.15");
          other.line.setAttribute("stroke-width", same ? "2.5" : "1.5");
        });
        const pct = Math.round((d.b - d.a) / d.a * 100);
        tip.textContent = `${d.n}: ${d.a} (2000) → ${d.b} (2022)  ${pct > 0 ? "+" : ""}${pct}%`;
        tip.style.opacity = "1";
      });
      g.addEventListener("mousemove", e => {
        tip.style.left = (e.clientX + 12) + "px";
        tip.style.top = (e.clientY - 20) + "px";
      });
      g.addEventListener("mouseleave", () => {
        groups.forEach(other => {
          other.line.setAttribute("opacity", "1");
          other.lLbl.setAttribute("opacity", "1");
          other.rLbl.setAttribute("opacity", "1");
          other.line.setAttribute("stroke-width", "1.5");
        });
        tip.style.opacity = "0";
      });
    });

    document.getElementById("chart").appendChild(svg);
  </script>
</body>
</html>
