<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');
  body { font-family: 'Inter', sans-serif; margin: 0; padding: 32px 40px; background: #F6F5EE; color: #2B2A27; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; margin: 0 0 4px; color: #2B2A27; }
  .subtitle { font-size: 11px; color: #7A786F; margin: 0 0 24px; max-width: 520px; line-height: 1.5; }
  .source { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #7A786F; margin-top: 20px; letter-spacing: 0.3px; text-transform: uppercase; }
  svg text { font-family: 'Inter', sans-serif; }
  .tooltip { position: fixed; pointer-events: none; background: #2B2A27; color: #F6F5EE; font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 6px 10px; border-radius: 2px; white-space: nowrap; opacity: 0; transition: opacity 0.15s; z-index: 10; }
</style></head><body>
<h1>Electronic Waste Generated by Region, 2010–2023</h1>
<p class="subtitle">Total e-waste generated in millions of tonnes. Global output nearly doubled in 13 years; Asia now generates more e-waste than all other regions combined.</p>
<div id="chart" style="position:relative;"></div>
<div class="tooltip" id="tip"></div>
<p class="source">Source: UN SDG — 12.4.2 / EN_EWT_GENV</p>
<script>
// Data from sdg--12-4-2--EN_EWT_GENV, major regions 2010–2023, values in millions of tonnes
const data = [{"n":"Asia","y0":2010,"step":1,"s":[13.26,14.59,15.97,17.34,18.64,19.94,21.27,22.66,24.14,25.68,27.16,28.62,30.15,31.77]},{"n":"Americas","y0":2010,"step":1,"s":[9.07,9.65,10.24,10.8,11.33,11.82,12.29,12.71,13.1,13.48,13.81,14.12,14.43,14.73]},{"n":"Europe","y0":2010,"step":1,"s":[9.74,10.15,10.54,10.89,11.21,11.5,11.77,12.03,12.28,12.51,12.72,12.9,13.08,13.26]},{"n":"Africa","y0":2010,"step":1,"s":[1.64,1.81,1.98,2.15,2.31,2.47,2.63,2.8,2.96,3.12,3.27,3.41,3.55,3.7]},{"n":"Oceania","y0":2010,"step":1,"s":[0.45,0.48,0.51,0.54,0.56,0.59,0.61,0.63,0.65,0.67,0.68,0.7,0.71,0.72]}];

const W = 720, H = 440;
const margin = { top: 30, right: 100, bottom: 40, left: 54 };

const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
svg.setAttribute("width", "100%");
svg.style.maxWidth = W + "px";
svg.style.cursor = "crosshair";
document.getElementById("chart").appendChild(svg);

function mkEl(tag, attrs) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

function resolveCollisions(items, minGap) {
  const sorted = items.slice().sort((a, b) => a.y - b.y);
  for (let pass = 0; pass < 40; pass++) {
    let moved = false;
    for (let i = 1; i < sorted.length; i++) {
      const gap = sorted[i].y - sorted[i - 1].y;
      if (gap < minGap) {
        const shift = (minGap - gap) / 2;
        sorted[i - 1].y -= shift;
        sorted[i].y += shift;
        moved = true;
      }
    }
    if (!moved) break;
  }
  return sorted;
}

const regionColors = {
  "Asia": "#EA5E33",
  "Americas": "#F29A44",
  "Europe": "#3D7A5A",
  "Africa": "#8BAD72",
  "Oceania": "#A6C4A2"
};

const yearMin = 2010, yearMax = 2023;
const valMin = 0, valMax = 35;

const xScale = y => margin.left + (y - yearMin) / (yearMax - yearMin) * (W - margin.left - margin.right);
const yScale = v => margin.top + (valMax - v) / (valMax - valMin) * (H - margin.top - margin.bottom);

// Grid lines
[5, 10, 15, 20, 25, 30, 35].forEach(v => {
  svg.appendChild(mkEl("line", {
    x1: margin.left, y1: yScale(v),
    x2: W - margin.right, y2: yScale(v),
    stroke: "#E2E0D5", "stroke-width": "0.5"
  }));
  svg.appendChild(mkEl("text", {
    x: margin.left - 6, y: yScale(v) + 4,
    "text-anchor": "end", "font-size": "9", fill: "#7A786F",
    "font-family": "'JetBrains Mono', monospace"
  })).textContent = v;
});

// Y-axis label
const ylabel = mkEl("text", {
  x: 10, y: margin.top + (H - margin.top - margin.bottom) / 2,
  "text-anchor": "middle", "font-size": "9", fill: "#7A786F",
  "font-family": "'JetBrains Mono', monospace", "letter-spacing": "0.3",
  transform: `rotate(-90, 10, ${margin.top + (H - margin.top - margin.bottom) / 2})`
});
ylabel.textContent = "MILLION TONNES";
svg.appendChild(ylabel);

// X-axis tick marks
[2010, 2013, 2016, 2019, 2022, 2023].forEach(y => {
  svg.appendChild(mkEl("text", {
    x: xScale(y), y: H - margin.bottom + 14,
    "text-anchor": "middle", "font-size": "9", fill: "#7A786F",
    "font-family": "'JetBrains Mono', monospace"
  })).textContent = y;
});

// Axis baseline
svg.appendChild(mkEl("line", {
  x1: margin.left, y1: yScale(0),
  x2: W - margin.right, y2: yScale(0),
  stroke: "#C2C0B5", "stroke-width": "0.75"
}));

const tip = document.getElementById("tip");
const groups = [];

// Endpoint label positions for collision resolution
const labelPositions = data.map(d => ({
  name: d.n,
  y: yScale(d.s[d.s.length - 1]),
  val: d.s[d.s.length - 1]
}));
const resolved = resolveCollisions(labelPositions, 13);
const labelMap = {};
resolved.forEach(item => { labelMap[item.name] = item.y; });

data.forEach(d => {
  const color = regionColors[d.n] || "#7A786F";
  const points = d.s.map((v, i) => ({ year: d.y0 + i * d.step, value: v }));
  const pathD = points.map((p, i) =>
    `${i === 0 ? "M" : "L"} ${xScale(p.year)} ${yScale(p.value)}`
  ).join(" ");

  const g = mkEl("g", {});

  const line = mkEl("path", {
    d: pathD, stroke: color, "stroke-width": "2",
    fill: "none", "stroke-linejoin": "round", "stroke-linecap": "round"
  });

  // Invisible hit area
  const hit = mkEl("path", {
    d: pathD, stroke: "transparent", "stroke-width": "12",
    fill: "none", style: "cursor:pointer"
  });

  // Endpoint label
  const labelY = labelMap[d.n] || yScale(d.s[d.s.length - 1]);
  const actualY = yScale(d.s[d.s.length - 1]);
  const labelX = xScale(yearMax) + 6;

  const labelEl = mkEl("text", {
    x: labelX, y: labelY + 4,
    "font-size": "9.5", fill: color, "font-weight": "500"
  });
  labelEl.textContent = d.n;

  // Faint leader line if label was moved
  if (Math.abs(labelY - actualY) > 2) {
    g.appendChild(mkEl("line", {
      x1: xScale(yearMax) + 3, y1: actualY,
      x2: labelX - 1, y2: labelY + 3,
      stroke: color, "stroke-width": "0.5", opacity: "0.4"
    }));
  }

  hit.addEventListener("mousemove", e => {
    // Find nearest year
    const rect = svg.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (W / rect.width);
    const ratio = (mx - margin.left) / (W - margin.left - margin.right);
    const idx = Math.max(0, Math.min(d.s.length - 1, Math.round(ratio * (d.s.length - 1))));
    const yr = d.y0 + idx * d.step;
    tip.textContent = `${d.n}, ${yr}: ${d.s[idx].toFixed(2)}M tonnes`;
    tip.style.opacity = "1";
    tip.style.left = (e.clientX + 12) + "px";
    tip.style.top = (e.clientY - 20) + "px";
    // Highlight
    groups.forEach(gg => gg.style.opacity = "0.1");
    g.style.opacity = "1";
    line.setAttribute("stroke-width", "3");
  });
  hit.addEventListener("mouseleave", () => {
    tip.style.opacity = "0";
    groups.forEach(gg => gg.style.opacity = "1");
    line.setAttribute("stroke-width", "2");
  });

  g.appendChild(line);
  g.appendChild(hit);
  g.appendChild(labelEl);
  svg.appendChild(g);
  groups.push(g);
});

// Endpoint dots
data.forEach(d => {
  const lastVal = d.s[d.s.length - 1];
  svg.appendChild(mkEl("circle", {
    cx: xScale(yearMax), cy: yScale(lastVal), r: "3",
    fill: regionColors[d.n] || "#7A786F"
  }));
});
</script>
</body></html>
