});
resolveCollisions(labelItems, 13).forEach(item => {
  item.lbl.setAttribute('y', item.y+3.5);
  if (Math.abs(item.y-item.origY) > 3) {
    const last = item.grp.d.pts.slice(-1)[0];
    const leader = mkEl('line', { x1: xScale(last.y), y1: item.origY, x2: xScale(last.y), y2: item.y, stroke: '#C2C0B5', 'stroke-width': '0.6' });
    item.grp.g.appendChild(leader);
  }
});

groups.forEach(({ g, line, d }) => {
  const hit = g.querySelectorAll('path')[1];
  hit.addEventListener('mouseenter', () => {
    groups.forEach(o => { if (o.g!==g) { o.line.setAttribute('opacity','0.08'); o.g.querySelectorAll('text').forEach(t=>t.setAttribute('opacity','0.15')); } });
    line.setAttribute('stroke-width','2.5');
  });
  hit.addEventListener('mousemove', e => {
    const rect = svg.getBoundingClientRect();
    const mx = (e.clientX-rect.left)*(W/rect.width);
    const year = Math.round(yearMin + (mx-margin.left)/(W-margin.left-margin.right)*(yearMax-yearMin));
    const pt = d.pts.reduce((a,b)=>Math.abs(b.y-year)<Math.abs(a.y-year)?b:a);
    showTip(`${d.n} ${pt.y}: ${pt.v.toFixed(2)}%`, e);
  });
  hit.addEventListener('mouseleave', () => {
    groups.forEach(o => { o.line.setAttribute('opacity','1'); o.g.querySelectorAll('text').forEach(t=>t.setAttribute('opacity','1')); });
    line.setAttribute('stroke-width','1.5');
    hideTip();
  });
});
</script>
</body></html>
