  .tooltip { position: fixed; pointer-events: none; background: #2B2A27; color: #F6F5EE; font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 6px 10px; border-radius: 2px; white-space: nowrap; opacity: 0; transition: opacity 0.15s; z-index: 10; }

const tip = document.getElementById('tip');
function showTip(text, e) {
  tip.textContent = text;
  tip.style.opacity = '1';
  tip.style.left = (e.clientX + 14) + 'px';
  tip.style.top = (e.clientY - 28) + 'px';
}
function hideTip() { tip.style.opacity = '0'; }

const CELL_H = 50, PAD = 5;

data.forEach(d => {
  const cell = document.createElement('div');
  cell.className = 'cell';

  const nameDiv = document.createElement('div');
  nameDiv.className = 'cell-name';
  nameDiv.textContent = d.n;
  cell.appendChild(nameDiv);

  const canvas = document.createElement('canvas');
  const dpr = window.devicePixelRatio || 1;
  canvas.style.width = '100%';
  canvas.style.height = CELL_H + 'px';
  canvas.style.display = 'block';
  cell.appendChild(canvas);

  // Size canvas after inserting into DOM so offsetWidth is known
  const valsDiv = document.createElement('div');
  valsDiv.className = 'cell-vals';
  const e1 = document.createElement('span');
  e1.className = 'cell-val';
  e1.textContent = d.e.toFixed(0) + '%';
  const e2 = document.createElement('span');
  e2.className = 'cell-val last';
  e2.textContent = d.l.toFixed(0) + '%';
  valsDiv.appendChild(e1);
  valsDiv.appendChild(e2);
  cell.appendChild(valsDiv);

  document.getElementById('grid').appendChild(cell);

  // Set canvas pixel size after appended
  const W = canvas.offsetWidth || 110;
  canvas.width = W * dpr;
  canvas.height = CELL_H * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const series = d.s;
  const valid = series.filter(v => v > 0);
  const minV = Math.min(...valid) * 0.95;
  const maxV = Math.max(...valid) * 1.02;
  const range = maxV - minV || 1;
  const normY = v => CELL_H - PAD - ((v - minV) / range) * (CELL_H - PAD * 2);
  const normX = i => (i / (series.length - 1)) * W;

  function draw(crossIdx) {
    ctx.clearRect(0, 0, W, CELL_H);
    ctx.strokeStyle = '#EA5E33';
    ctx.lineWidth = 1.2;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    let started = false;
    series.forEach((v, i) => {
      if (v === 0) return;
      const x = normX(i), y = normY(v);
      if (!started) { ctx.moveTo(x, y); started = true; }
      else ctx.lineTo(x, y);
    });
    ctx.stroke();

    if (crossIdx !== undefined) {
      const cx = normX(crossIdx);
      ctx.strokeStyle = '#C2C0B5';
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.moveTo(cx, 0);
      ctx.lineTo(cx, CELL_H);
      ctx.stroke();
      // dot
      const v = series[crossIdx];
      if (v > 0) {
        ctx.fillStyle = '#EA5E33';
        ctx.beginPath();
        ctx.arc(cx, normY(v), 2.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  draw();

  canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (W / rect.width);
    const idx = Math.max(0, Math.min(series.length - 1, Math.round((mx / W) * (series.length - 1))));
    const year = d.y0 + idx;
    const val = series[idx];
    draw(idx);
    showTip(`${d.n} ${year}: ${val > 0 ? val.toFixed(1) + '%' : 'n/a'}`, e);
  });
  canvas.addEventListener('mouseleave', () => { hideTip(); draw(); });
});
