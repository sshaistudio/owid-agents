<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');
  body { font-family: 'Inter', sans-serif; margin: 0; padding: 32px 40px; background: #F6F5EE; color: #2B2A27; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; margin: 0 0 4px; color: #2B2A27; }
  .subtitle { font-size: 11px; color: #7A786F; margin: 0 0 24px; max-width: 520px; line-height: 1.5; }
  .source { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #7A786F; margin-top: 20px; letter-spacing: 0.3px; text-transform: uppercase; }
  svg text { font-family: 'Inter', sans-serif; }
  .tooltip { position: fixed; pointer-events: none; background: #2B2A27; color: #F6F5EE; font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 6px 10px; border-radius: 2px; white-space: nowrap; opacity: 0; transition: opacity 0.15s; z-index: 10; }
</style></head><body>
<h1>Arable Land (% of Land Area): 2000 vs 2022</h1>
<p class="subtitle">South and East Asia hold the world's most intensively farmed land but are slowly losing it to urbanization. East Africa and South America are expanding cultivation into new areas.</p>
<div id="chart" style="position:relative;"></div>
<div class="tooltip" id="tip"></div>
<p class="source">Source: World Bank — wb--AG-LND-ARBL-ZS</p>
<script>
const data = [
  {"n":"Bangladesh","a":64.1,"b":60.8,"y":2000},
  {"n":"Denmark","a":57.0,"b":59.0,"y":2000},
  {"n":"India","a":54.1,"b":51.8,"y":2000},
  {"n":"Hungary","a":51.4,"b":45.6,"y":2000},
  {"n":"Burundi","a":37.4,"b":50.4,"y":2000},
  {"n":"Germany","a":33.8,"b":33.4,"y":2000},
  {"n":"France","a":34.1,"b":31.5,"y":2000},
  {"n":"Czechia","a":42.0,"b":32.1,"y":2000},
  {"n":"Italy","a":28.7,"b":24.0,"y":2000},
  {"n":"Indonesia","a":11.2,"b":9.4,"y":2000},
  {"n":"China","a":13.2,"b":11.6,"y":2000},
  {"n":"Kenya","a":8.8,"b":11.4,"y":2000},
  {"n":"Argentina","a":10.1,"b":15.7,"y":2000},
  {"n":"Brazil","a":5.7,"b":6.7,"y":2000},
  {"n":"Egypt, Arab Rep.","a":2.3,"b":3.1,"y":2000}
];

const W = 700, H = 620;
const pad = { left: 130, right: 130, top: 50, bottom: 30 };
const minV = 0, maxV = 70;
const xLeft = pad.left, xRight = W - pad.right;

const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
svg.setAttribute("width", "100%");
svg.style.maxWidth = W + "px";
document.getElementById("chart").appendChild(svg);

function mkEl(tag, attrs, text) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  if (text !== undefined) el.textContent = text;
  return el;
}

function resolveCollisions(items, minGap) {
  const sorted = items.slice().sort((a, b) => a.y - b.y);
  for (let pass = 0; pass < 40; pass++) {
    let moved = false;
    for (let i = 1; i < sorted.length; i++) {
      const gap = sorted[i].y - sorted[i - 1].y;
      if (gap < minGap) {
        const shift = (minGap - gap) / 2;
        sorted[i - 1].y -= shift;
        sorted[i].y += shift;
        moved = true;
      }
    }
    if (!moved) break;
  }
  return sorted;
}

const colorForChange = d => {
  const change = d.b - d.a;
  if (change > 5) return "#3D7A5A";
  if (change > 1) return "#8BAD72";
  if (change > -1) return "#A6C4A2";
  if (change > -5) return "#C4715A";
  return "#B34B3B";
};

const scale = v => pad.top + (maxV - v) / (maxV - minV) * (H - pad.top - pad.bottom);

svg.appendChild(mkEl("text", { x: xLeft, y: pad.top - 18, "text-anchor": "middle", fill: "#7A786F", "font-size": "10", "font-family": "JetBrains Mono, monospace", "font-weight": "500" }, "2000"));
svg.appendChild(mkEl("text", { x: xRight, y: pad.top - 18, "text-anchor": "middle", fill: "#7A786F", "font-size": "10", "font-family": "JetBrains Mono, monospace", "font-weight": "500" }, "2022"));
svg.appendChild(mkEl("line", { x1: xLeft, y1: pad.top - 8, x2: xLeft, y2: H - pad.bottom, stroke: "#C2C0B5", "stroke-width": "0.5" }));
svg.appendChild(mkEl("line", { x1: xRight, y1: pad.top - 8, x2: xRight, y2: H - pad.bottom, stroke: "#C2C0B5", "stroke-width": "0.5" }));

const leftLabels = data.map(d => ({ d, y: scale(d.a) }));
const rightLabels = data.map(d => ({ d, y: scale(d.b) }));
resolveCollisions(leftLabels, 13);
resolveCollisions(rightLabels, 13);

const tip = document.getElementById("tip");
const gEls = [];

data.forEach((d, i) => {
  const color = colorForChange(d);
  const ya = scale(d.a), yb = scale(d.b);
  const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
  g.style.cursor = "pointer";
  g.appendChild(mkEl("line", { x1: xLeft, y1: ya, x2: xRight, y2: yb, stroke: color, "stroke-width": "1.5" }));
  g.appendChild(mkEl("circle", { cx: xLeft, cy: ya, r: "3", fill: color }));
  g.appendChild(mkEl("circle", { cx: xRight, cy: yb, r: "3", fill: color }));
  const hit = mkEl("line", { x1: xLeft, y1: ya, x2: xRight, y2: yb, stroke: "transparent", "stroke-width": "12" });
  g.appendChild(hit);

  hit.addEventListener("mouseenter", e => {
    gEls.forEach(gg => gg.style.opacity = "0.15");
    g.style.opacity = "1";
    const change = (d.b - d.a).toFixed(1);
    const sign = d.b >= d.a ? "+" : "";
    tip.textContent = `${d.n}: ${d.a}% → ${d.b}% (${sign}${change} pts)`;
    tip.style.opacity = "1";
    tip.style.left = (e.clientX + 14) + "px";
    tip.style.top = (e.clientY - 28) + "px";
  });
  hit.addEventListener("mouseleave", () => {
    gEls.forEach(gg => gg.style.opacity = "1");
    tip.style.opacity = "0";
  });
  hit.addEventListener("mousemove", e => {
    tip.style.left = (e.clientX + 14) + "px";
    tip.style.top = (e.clientY - 28) + "px";
  });

  svg.appendChild(g);
  gEls.push(g);
});

leftLabels.forEach(({ d, y }) => {
  const color = colorForChange(d);
  const name = d.n === "Egypt, Arab Rep." ? "Egypt" : d.n;
  svg.appendChild(mkEl("text", { x: xLeft - 8, y: y + 3.5, "text-anchor": "end", fill: color, "font-size": "9", "font-weight": "500" }, `${name}  ${d.a}%`));
});
rightLabels.forEach(({ d, y }) => {
  const color = colorForChange(d);
  const name = d.n === "Egypt, Arab Rep." ? "Egypt" : d.n;
  svg.appendChild(mkEl("text", { x: xRight + 8, y: y + 3.5, "text-anchor": "start", fill: color, "font-size": "9", "font-weight": "500" }, `${d.b}%  ${name}`));
});

const legend = [
  { label: ">5pt gain", color: "#3D7A5A" },
  { label: "1–5pt gain", color: "#8BAD72" },
  { label: "stable", color: "#A6C4A2" },
  { label: "1–5pt loss", color: "#C4715A" },
  { label: ">5pt loss", color: "#B34B3B" }
];
legend.forEach((l, i) => {
  const lx = 20 + i * 115;
  svg.appendChild(mkEl("rect", { x: lx, y: H - pad.bottom + 6, width: 8, height: 8, fill: l.color }));
  svg.appendChild(mkEl("text", { x: lx + 12, y: H - pad.bottom + 14, fill: "#7A786F", "font-size": "8", "font-family": "JetBrains Mono, monospace" }, l.label));
});
</script>
</body></html>
