<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      margin: 0; padding: 24px;
      background: #faf9f7;
      color: #0f172a;
    }
    h1 { font-size: 18px; font-weight: 700; margin: 0 0 4px; color: #1e293b; }
    .subtitle { font-size: 13px; color: #64748b; margin: 0 0 4px; }
    .note { font-size: 12px; color: #94a3b8; margin: 0 0 20px; font-style: italic; }
    #chart { width: 100%; max-width: 700px; }
    .source { font-size: 11px; color: #94a3b8; margin-top: 12px; }
    #tip {
      position: fixed; background: #1e293b; color: #f8fafc;
      font-size: 12px; padding: 6px 10px; border-radius: 5px;
      pointer-events: none; opacity: 0; transition: opacity 0.1s;
      white-space: nowrap; z-index: 10;
    }
  </style>
</head>
<body>
  <h1>COVID-19 Erased a Decade of Tourism Growth</h1>
  <p class="subtitle">International tourist arrivals in 2019 vs. 2020 (millions) — COVID-19 cut arrivals by 50–94% for major destinations</p>
  <p class="note">Hover a line to see exact figures. Color encodes % drop.</p>
  <svg id="chart" viewBox="0 0 700 560" width="100%"></svg>
  <p class="source">Source: World Bank — International Tourism Arrivals (ST.INT.ARVL)</p>
  <div id="tip"></div>
  <script>
    // Data from wb--ST-INT-ARVL: {n, a: 2019 value (millions), b: 2020 value (millions)}
    const data = [
      {n:"France",         a:217.9, b:117.1},
      {n:"China",          a:162.5, b:30.4},
      {n:"Italy",          a:95.4,  b:38.4},
      {n:"Hungary",        a:61.4,  b:31.6},
      {n:"Croatia",        a:60.0,  b:21.6},
      {n:"Germany",        a:39.6,  b:12.4},
      {n:"Greece",         a:34.0,  b:7.4},
      {n:"Canada",         a:32.4,  b:13.0},
      {n:"Denmark",        a:33.1,  b:15.6},
      {n:"Austria",        a:31.9,  b:15.1},
      {n:"Japan",          a:31.9,  b:4.1},
      {n:"Korea, Rep.",    a:17.5,  b:2.5},
      {n:"Indonesia",      a:16.1,  b:4.1},
    ].sort((a, b) => b.a - a.a);

    function colorForDrop(pctDrop) {
      if (pctDrop > 85) return "#7B1D1D";
      if (pctDrop > 70) return "#B91C1C";
      if (pctDrop > 55) return "#DC2626";
      if (pctDrop > 40) return "#F97316";
      return "#FBBF24";
    }

    const W = 700, H = 560;
    const pad = {left: 120, right: 130, top: 50, bottom: 30};
    const NS = "http://www.w3.org/2000/svg";

    const allVals = data.flatMap(d => [d.a, d.b]);
    const maxV = Math.ceil(Math.max(...allVals) / 10) * 10;
    const minV = 0;

    const scale = v => pad.top + (maxV - v) / (maxV - minV) * (H - pad.top - pad.bottom);
    const xL = pad.left;
    const xR = W - pad.right;

    function mkEl(tag, attrs, text) {
      const el = document.createElementNS(NS, tag);
      for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
      if (text !== undefined) el.textContent = text;
      return el;
    }

    const svg = document.getElementById("chart");

    // Column headers
    svg.appendChild(mkEl("text", {x: xL, y: pad.top - 18, "text-anchor": "middle", "font-size": "11", fill: "#7A786F", "font-family": "JetBrains Mono, monospace", "font-weight": "500"}, "2019"));
    svg.appendChild(mkEl("text", {x: xR, y: pad.top - 18, "text-anchor": "middle", "font-size": "11", fill: "#7A786F", "font-family": "JetBrains Mono, monospace", "font-weight": "500"}, "2020"));
    svg.appendChild(mkEl("text", {x: xL, y: pad.top - 5, "text-anchor": "middle", "font-size": "9", fill: "#B0AEA6", "font-family": "Inter, sans-serif"}, "(Pre-COVID)"));
    svg.appendChild(mkEl("text", {x: xR, y: pad.top - 5, "text-anchor": "middle", "font-size": "9", fill: "#B0AEA6", "font-family": "Inter, sans-serif"}, "(COVID year)"));

    // Axis lines
    svg.appendChild(mkEl("line", {x1: xL, y1: pad.top - 28, x2: xL, y2: H - pad.bottom, stroke: "#E2E8F0", "stroke-width": "1"}));
    svg.appendChild(mkEl("line", {x1: xR, y1: pad.top - 28, x2: xR, y2: H - pad.bottom, stroke: "#E2E8F0", "stroke-width": "1"}));

    // Collision resolution
    function resolveCollisions(items, minGap) {
      const sorted = items.slice().sort((a, b) => a.y - b.y);
      for (let pass = 0; pass < 40; pass++) {
        let moved = false;
        for (let i = 1; i < sorted.length; i++) {
          const gap = sorted[i].y - sorted[i-1].y;
          if (gap < minGap) {
            const shift = (minGap - gap) / 2;
            sorted[i-1].y -= shift;
            sorted[i].y += shift;
            moved = true;
          }
        }
        if (!moved) break;
      }
      for (const item of sorted) {
        item.y = Math.max(pad.top + 4, Math.min(H - pad.bottom - 4, item.y));
      }
      return sorted;
    }

    const leftLabels = data.map(d => ({n: d.n, y: scale(d.a), rawY: scale(d.a)}));
    const rightLabels = data.map(d => ({n: d.n, y: scale(d.b), rawY: scale(d.b)}));
    const resolvedLeft = resolveCollisions(leftLabels, 14);
    const resolvedRight = resolveCollisions(rightLabels, 14);

    const groups = [];
    for (const d of data) {
      const pctDrop = Math.round((d.a - d.b) / d.a * 100);
      const color = colorForDrop(pctDrop);
      const g = mkEl("g", {class: "row"});

      const ya = scale(d.a);
      const yb = scale(d.b);

      // Connecting line (visible)
      g.appendChild(mkEl("line", {x1: xL, y1: ya, x2: xR, y2: yb, stroke: color, "stroke-width": "1.5", "stroke-linecap": "round"}));

      // Dots
      g.appendChild(mkEl("circle", {cx: xL, cy: ya, r: "3.5", fill: color}));
      g.appendChild(mkEl("circle", {cx: xR, cy: yb, r: "3.5", fill: color}));

      // Hit area
      const hit = mkEl("line", {x1: xL, y1: ya, x2: xR, y2: yb, stroke: "transparent", "stroke-width": "14", cursor: "pointer"});
      g.appendChild(hit);

      // Left label (country name + 2019 value), right-aligned
      const leftLabelY = resolvedLeft.find(l => l.n === d.n).y;
      const rightLabelY = resolvedRight.find(l => l.n === d.n).y;

      if (Math.abs(leftLabelY - ya) > 2) {
        g.appendChild(mkEl("line", {x1: xL - 3, y1: ya, x2: xL - 10, y2: leftLabelY, stroke: color, "stroke-width": "0.6", opacity: "0.5"}));
      }
      if (Math.abs(rightLabelY - yb) > 2) {
        g.appendChild(mkEl("line", {x1: xR + 3, y1: yb, x2: xR + 10, y2: rightLabelY, stroke: color, "stroke-width": "0.6", opacity: "0.5"}));
      }

      g.appendChild(mkEl("text", {x: xL - 13, y: leftLabelY + 4, "text-anchor": "end", "font-size": "9.5", fill: color, "font-family": "JetBrains Mono, monospace"},
        `${d.n}  ${d.a.toFixed(1)}`));

      g.appendChild(mkEl("text", {x: xR + 13, y: rightLabelY + 4, "text-anchor": "start", "font-size": "9.5", fill: color, "font-family": "JetBrains Mono, monospace"},
        `${d.b.toFixed(1)}  −${pctDrop}%`));

      groups.push({g, d, color, ya, yb, pctDrop});
      svg.appendChild(g);
    }

    // Legend
    const legendData = [
      {label: ">85% drop", color: "#7B1D1D"},
      {label: "70–85% drop", color: "#B91C1C"},
      {label: "55–70% drop", color: "#DC2626"},
      {label: "40–55% drop", color: "#F97316"},
      {label: "<40% drop", color: "#FBBF24"}
    ];
    let lx = pad.left;
    const ly = H - 8;
    for (const {label, color} of legendData) {
      svg.appendChild(mkEl("rect", {x: lx, y: ly - 9, width: 14, height: 3, rx: "1", fill: color}));
      svg.appendChild(mkEl("text", {x: lx + 18, y: ly, "font-size": "9", fill: "#94A3B8", "font-family": "Inter, sans-serif"}, label));
      lx += 105;
    }

    const tip = document.getElementById("tip");
    for (const {g, d, pctDrop} of groups) {
      const hit = g.children[2];
      hit.addEventListener("mouseenter", e => {
        tip.textContent = `${d.n}: ${d.a.toFixed(1)}M → ${d.b.toFixed(1)}M (−${pctDrop}%)`;
        tip.style.opacity = "1";
        tip.style.left = (e.clientX + 14) + "px";
        tip.style.top = (e.clientY - 24) + "px";
        for (const {g: gg} of groups) gg.style.opacity = "0.1";
        g.style.opacity = "1";
      });
      hit.addEventListener("mousemove", e => {
        tip.style.left = (e.clientX + 14) + "px";
        tip.style.top = (e.clientY - 24) + "px";
      });
      hit.addEventListener("mouseleave", () => {
        tip.style.opacity = "0";
        for (const {g: gg} of groups) gg.style.opacity = "1";
      });
    }
  </script>
</body>
</html>
