<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 32px 40px;
      background: #1a1a2e;
      color: #e8e6e3;
    }
    h1 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.3px;
      margin: 0 0 5px;
      color: #e8e6e3;
    }
    .subtitle {
      font-size: 12px;
      color: #8b8a86;
      margin: 0 0 28px;
      max-width: 560px;
      line-height: 1.5;
    }
    .source {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      color: #6b6a66;
      margin-top: 20px;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }
    svg text { font-family: 'Inter', sans-serif; }
    #chart { position: relative; }
    .tooltip {
      position: fixed;
      pointer-events: none;
      background: #2a2a40;
      border: 1px solid #3a3a5c;
      color: #e8e6e3;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      padding: 7px 11px;
      border-radius: 3px;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.12s;
      z-index: 100;
    }
  </style>
</head>
<body>
  <h1>How Crowded Is Your Country? 1961 vs 2023</h1>
  <p class="subtitle">Population density (people per sq. km of land area) for 12 major countries. Lines connect each country from 1961 to 2023. Bangladesh is the standout: from 410 to 1,319 people per sq. km.</p>
  <div id="chart"></div>
  <div class="tooltip" id="tip"></div>
  <p class="source">Source: World Bank EN.POP.DNST</p>

  <script>
    // Data from catalog: wb--EN-POP-DNST
    // 1961 and 2023 values, people per sq. km of land area
    const data = [
      {"n":"Bangladesh","a":409.5,"b":1319.2},
      {"n":"India",     "a":150.2,"b":483.7},
      {"n":"Japan",     "a":256.5,"b":341.5},
      {"n":"Germany",   "a":210.2,"b":238.4},
      {"n":"France",    "a":88.9, "b":126.9},
      {"n":"China",     "a":70.3, "b":150.3},
      {"n":"Indonesia", "a":50.1, "b":148.6},
      {"n":"Egypt",     "a":27.7, "b":115.1},
      {"n":"Kenya",     "a":14.0, "b":95.3},
      {"n":"Brazil",    "a":8.9,  "b":25.3},
      {"n":"Canada",    "a":2.0,  "b":4.6},
      {"n":"Australia", "a":1.4,  "b":3.5}
    ];

    const W = 680, H = 580;
    const pad = { left: 128, right: 136, top: 44, bottom: 32 };

    // Log scale makes sense here given the extreme spread
    const minV = 1, maxV = 1400;
    const logMin = Math.log10(minV + 0.5);
    const logMax = Math.log10(maxV);
    const scale = v => pad.top + (logMax - Math.log10(Math.max(v, 0.5))) / (logMax - logMin) * (H - pad.top - pad.bottom);

    function resolveCollisions(items, minGap) {
      const sorted = items.slice().sort((a, b) => a.y - b.y);
      for (let pass = 0; pass < 40; pass++) {
        let moved = false;
        for (let i = 1; i < sorted.length; i++) {
          const gap = sorted[i].y - sorted[i - 1].y;
          if (gap < minGap) {
            const shift = (minGap - gap) / 2;
            sorted[i - 1].y -= shift;
            sorted[i].y += shift;
            moved = true;
          }
        }
        if (!moved) break;
      }
      return sorted;
    }

    // Color by pct change (b/a - 1)
    function colorForChange(d) {
      const pct = (d.b - d.a) / d.a;
      if (pct > 2.0)  return "#ff6b6b"; // > 200% — extreme
      if (pct > 1.0)  return "#ffa94d"; // 100-200%
      if (pct > 0.5)  return "#4ecdc4"; // 50-100%
      if (pct > 0.2)  return "#74c0fc"; // 20-50%
      return "#a9a9c8";                  // < 20%
    }

    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.setAttribute("width", "100%");
    svg.style.maxWidth = W + "px";
    svg.style.cursor = "crosshair";
    svg.style.display = "block";

    // Y-axis grid lines at round numbers on log scale
    const gridVals = [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000];
    gridVals.forEach(v => {
      const y = scale(v);
      if (y < pad.top || y > H - pad.bottom) return;
      const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("x1", pad.left);
      line.setAttribute("x2", W - pad.right);
      line.setAttribute("y1", y);
      line.setAttribute("y2", y);
      line.setAttribute("stroke", "#2e2e4a");
      line.setAttribute("stroke-width", "1");
      svg.appendChild(line);

      const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
      t.setAttribute("x", pad.left - 8);
      t.setAttribute("y", y + 3.5);
      t.setAttribute("text-anchor", "end");
      t.setAttribute("font-size", "9");
      t.setAttribute("font-family", "'JetBrains Mono', monospace");
      t.setAttribute("fill", "#4a4a6a");
      t.textContent = v >= 1000 ? (v/1000) + "k" : v;
      svg.appendChild(t);
    });

    // Year column headers
    function makeHeader(x, label) {
      const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
      t.setAttribute("x", x);
      t.setAttribute("y", 26);
      t.setAttribute("text-anchor", "middle");
      t.setAttribute("font-family", "'JetBrains Mono', monospace");
      t.setAttribute("font-size", "11");
      t.setAttribute("fill", "#6b6a88");
      t.setAttribute("letter-spacing", "0.5");
      t.textContent = label;
      svg.appendChild(t);
    }
    makeHeader(pad.left, "1961");
    makeHeader(W - pad.right, "2023");

    // Vertical axis lines
    [pad.left, W - pad.right].forEach(x => {
      const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("x1", x); line.setAttribute("x2", x);
      line.setAttribute("y1", pad.top - 8); line.setAttribute("y2", H - pad.bottom);
      line.setAttribute("stroke", "#2e2e4a");
      line.setAttribute("stroke-width", "1");
      svg.appendChild(line);
    });

    // Build label arrays for collision resolution
    const leftLabels = data.map(d => ({ n: d.n, y: scale(d.a), v: d.a, d }));
    const rightLabels = data.map(d => ({ n: d.n, y: scale(d.b), v: d.b, d }));
    resolveCollisions(leftLabels, 14);
    resolveCollisions(rightLabels, 14);

    const leftByName = {};
    leftLabels.forEach(l => { leftByName[l.n] = l; });
    const rightByName = {};
    rightLabels.forEach(l => { rightByName[l.n] = l; });

    // Draw rows
    const rows = [];
    const x1 = pad.left, x2 = W - pad.right;

    data.forEach((d, i) => {
      const y1 = scale(d.a);
      const y2 = scale(d.b);
      const col = colorForChange(d);
      const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
      g.style.transition = "opacity 0.12s";

      // Main slope line
      const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("x1", x1); line.setAttribute("y1", y1);
      line.setAttribute("x2", x2); line.setAttribute("y2", y2);
      line.setAttribute("stroke", col);
      line.setAttribute("stroke-width", "1.5");
      line.setAttribute("opacity", "0.8");
      g.appendChild(line);

      // End dots
      [{ x: x1, y: y1 }, { x: x2, y: y2 }].forEach(p => {
        const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        c.setAttribute("cx", p.x); c.setAttribute("cy", p.y); c.setAttribute("r", "3");
        c.setAttribute("fill", col);
        g.appendChild(c);
      });

      // Left label
      const ll = leftByName[d.n];
      const lt = document.createElementNS("http://www.w3.org/2000/svg", "text");
      lt.setAttribute("x", x1 - 8);
      lt.setAttribute("y", ll.y + 3.5);
      lt.setAttribute("text-anchor", "end");
      lt.setAttribute("font-size", "10.5");
      lt.setAttribute("fill", "#b0aead");
      lt.textContent = d.n + "  " + d.a.toFixed(0);
      g.appendChild(lt);

      // Right label
      const rl = rightByName[d.n];
      const rt = document.createElementNS("http://www.w3.org/2000/svg", "text");
      rt.setAttribute("x", x2 + 8);
      rt.setAttribute("y", rl.y + 3.5);
      rt.setAttribute("text-anchor", "start");
      rt.setAttribute("font-size", "10.5");
      rt.setAttribute("fill", "#b0aead");
      rt.textContent = d.b.toFixed(0) + "  " + d.n;
      g.appendChild(rt);

      // Invisible wide hit area
      const hit = document.createElementNS("http://www.w3.org/2000/svg", "line");
      hit.setAttribute("x1", x1); hit.setAttribute("y1", y1);
      hit.setAttribute("x2", x2); hit.setAttribute("y2", y2);
      hit.setAttribute("stroke", "transparent");
      hit.setAttribute("stroke-width", "18");
      hit.style.cursor = "pointer";
      g.appendChild(hit);

      svg.appendChild(g);
      rows.push({ g, line, d, col, y1, y2 });
    });

    // Legend
    const legendItems = [
      { col: "#ff6b6b", label: "> 200% increase" },
      { col: "#ffa94d", label: "100-200%" },
      { col: "#4ecdc4", label: "50-100%" },
      { col: "#74c0fc", label: "20-50%" },
      { col: "#a9a9c8", label: "< 20%" },
    ];
    legendItems.forEach((li, i) => {
      const lx = pad.left + i * 120;
      const ly = H - 10;
      const r = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      r.setAttribute("x", lx); r.setAttribute("y", ly - 5);
      r.setAttribute("width", 14); r.setAttribute("height", 3);
      r.setAttribute("fill", li.col); r.setAttribute("rx", 1);
      svg.appendChild(r);
      const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
      t.setAttribute("x", lx + 18); t.setAttribute("y", ly);
      t.setAttribute("font-size", "9");
      t.setAttribute("font-family", "'JetBrains Mono', monospace");
      t.setAttribute("fill", "#6b6a88");
      t.textContent = li.label;
      svg.appendChild(t);
    });

    // Y-axis label
    const axLabel = document.createElementNS("http://www.w3.org/2000/svg", "text");
    axLabel.setAttribute("x", 10);
    axLabel.setAttribute("y", H / 2);
    axLabel.setAttribute("text-anchor", "middle");
    axLabel.setAttribute("font-size", "9");
    axLabel.setAttribute("font-family", "'JetBrains Mono', monospace");
    axLabel.setAttribute("fill", "#4a4a6a");
    axLabel.setAttribute("transform", "rotate(-90, 10, " + (H / 2) + ")");
    axLabel.textContent = "people / sq km (log scale)";
    svg.appendChild(axLabel);

    document.getElementById("chart").appendChild(svg);

    // Interactivity
    const tip = document.getElementById("tip");
    let activeIdx = -1;

    function highlight(idx) {
      if (idx === activeIdx) return;
      activeIdx = idx;
      rows.forEach((row, i) => {
        if (idx === -1) {
          row.g.style.opacity = "1";
          row.line.setAttribute("stroke-width", "1.5");
          row.line.setAttribute("opacity", "0.8");
        } else if (i === idx) {
          row.g.style.opacity = "1";
          row.line.setAttribute("stroke-width", "3");
          row.line.setAttribute("opacity", "1");
        } else {
          row.g.style.opacity = "0.12";
          row.line.setAttribute("stroke-width", "1");
        }
      });
    }

    svg.addEventListener("mousemove", function(e) {
      const rect = svg.getBoundingClientRect();
      const sx = (e.clientX - rect.left) / rect.width * W;
      const sy = (e.clientY - rect.top) / rect.height * H;

      let best = -1, bestDist = 22;
      rows.forEach(function(row, i) {
        const t = Math.max(0, Math.min(1, (sx - x1) / (x2 - x1)));
        const lineY = row.y1 + (row.y2 - row.y1) * t;
        const dist = Math.abs(sy - lineY);
        if (dist < bestDist) { bestDist = dist; best = i; }
      });

      highlight(best);

      if (best >= 0) {
        const d = rows[best].d;
        const change = ((d.b - d.a) / d.a * 100).toFixed(0);
        tip.textContent = d.n + ": " + d.a.toFixed(1) + " → " + d.b.toFixed(1) + " people/km² (+" + change + "%)";
        tip.style.opacity = "1";
        tip.style.left = (e.clientX + 14) + "px";
        tip.style.top = (e.clientY - 22) + "px";
      } else {
        tip.style.opacity = "0";
      }
    });

    svg.addEventListener("mouseleave", function() {
      highlight(-1);
      tip.style.opacity = "0";
    });
  </script>
</body>
</html>
