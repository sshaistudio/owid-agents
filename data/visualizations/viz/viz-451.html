<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');
  body { font-family: 'Inter', sans-serif; margin: 0; padding: 32px 40px; background: #F6F5EE; color: #2B2A27; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; margin: 0 0 4px; color: #2B2A27; }
  .subtitle { font-size: 11px; color: #7A786F; margin: 0 0 24px; max-width: 560px; line-height: 1.5; }
  .source { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #7A786F; margin-top: 16px; letter-spacing: 0.3px; text-transform: uppercase; }
  svg text { font-family: 'Inter', sans-serif; }
  .tooltip { position: fixed; pointer-events: none; background: #2B2A27; color: #F6F5EE; font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 6px 10px; border-radius: 2px; white-space: nowrap; opacity: 0; transition: opacity 0.12s; z-index: 10; }
</style></head><body>
<h1>Youth Literacy Rate, 1975–2024</h1>
<p class="subtitle">Share of 15-24 year olds who can read and write, for countries that began the period with low literacy. Across sub-Saharan Africa and South Asia, rates have roughly doubled in a generation.</p>
<div id="chart" style="position:relative;"></div>
<div class="tooltip" id="tip"></div>
<p class="source">Source: World Bank — SE.ADT.1524.LT.ZS</p>
<script>
const data = [{"n":"Bangladesh","pts":[{"y":1981,"v":35.7},{"y":1991,"v":44.7},{"y":2001,"v":63.6},{"y":2007,"v":87.6},{"y":2011,"v":78.0},{"y":2015,"v":87.9},{"y":2018,"v":93.3},{"y":2020,"v":94.5},{"y":2022,"v":93.4}]},{"n":"Burundi","pts":[{"y":1979,"v":31.0},{"y":1990,"v":53.6},{"y":2000,"v":73.3},{"y":2010,"v":74.5},{"y":2016,"v":84.4},{"y":2020,"v":88.4}]},{"n":"Ethiopia","pts":[{"y":1994,"v":33.6},{"y":2000,"v":38.6},{"y":2007,"v":55.0},{"y":2013,"v":71.8},{"y":2019,"v":79.1},{"y":2022,"v":84.7}]},{"n":"Burkina Faso","pts":[{"y":1975,"v":14.4},{"y":1991,"v":20.2},{"y":2003,"v":31.2},{"y":2007,"v":39.3},{"y":2014,"v":50.1},{"y":2019,"v":47.0},{"y":2022,"v":62.8}]},{"n":"Egypt","pts":[{"y":1976,"v":51.0},{"y":1986,"v":63.3},{"y":1996,"v":73.2},{"y":2005,"v":84.8},{"y":2010,"v":87.5},{"y":2013,"v":92.0},{"y":2017,"v":88.2},{"y":2022,"v":95.2}]},{"n":"India","pts":[{"y":1981,"v":53.8},{"y":1991,"v":61.9},{"y":2001,"v":76.4},{"y":2010,"v":87.9},{"y":2016,"v":90.3},{"y":2020,"v":95.7},{"y":2024,"v":97.3}]},{"n":"Iran","pts":[{"y":1976,"v":56.5},{"y":1986,"v":75.2},{"y":1996,"v":93.0},{"y":2005,"v":97.4},{"y":2012,"v":98.0},{"y":2019,"v":98.5},{"y":2023,"v":98.7}]},{"n":"Benin","pts":[{"y":1979,"v":29.8},{"y":1992,"v":39.9},{"y":2001,"v":48.0},{"y":2006,"v":57.4},{"y":2013,"v":62.2},{"y":2019,"v":69.2},{"y":2022,"v":71.2}]},{"n":"Afghanistan","pts":[{"y":1979,"v":30.1},{"y":2011,"v":47.0},{"y":2015,"v":35.8},{"y":2020,"v":54.0},{"y":2022,"v":62.7}]}];

const COLORS = [
  '#3D7A5A','#5B9E78','#8BAD72','#C49A45',
  '#F29A44','#EA5E33','#C4715A','#B34B3B','#7A9BB5'
];

const W = 740, H = 440;
const mar = { top: 36, right: 118, bottom: 32, left: 46 };
const yMin = 10, yMax = 102;
const xMin = 1975, xMax = 2024;

const xS = y => mar.left + (y - xMin) / (xMax - xMin) * (W - mar.left - mar.right);
const yS = v => mar.top + (yMax - v) / (yMax - yMin) * (H - mar.top - mar.bottom);

function mkEl(tag, attrs) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

function resolveCollisions(items, minGap) {
  const sorted = items.slice().sort((a, b) => a.y - b.y);
  for (let pass = 0; pass < 30; pass++) {
    let moved = false;
    for (let i = 1; i < sorted.length; i++) {
      const gap = sorted[i].y - sorted[i - 1].y;
      if (gap < minGap) {
        const shift = (minGap - gap) / 2;
        sorted[i - 1].y -= shift;
        sorted[i].y += shift;
        moved = true;
      }
    }
    if (!moved) break;
  }
  return sorted;
}

const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
svg.setAttribute("width", "100%");
svg.style.maxWidth = W + "px";
document.getElementById("chart").appendChild(svg);

// Grid lines
[20, 40, 60, 80, 100].forEach(v => {
  svg.appendChild(mkEl("line", {
    x1: mar.left, y1: yS(v), x2: W - mar.right, y2: yS(v),
    stroke: "#E2E0D5", "stroke-width": "0.5"
  }));
  svg.appendChild(mkEl("text", {
    x: mar.left - 6, y: yS(v) + 3.5,
    "text-anchor": "end", fill: "#9A9890",
    "font-family": "JetBrains Mono, monospace", "font-size": "9"
  })).textContent = v + "%";
});

// 90% reference line
svg.appendChild(mkEl("line", {
  x1: mar.left, y1: yS(90), x2: W - mar.right, y2: yS(90),
  stroke: "#C2C0B5", "stroke-dasharray": "4,3", "stroke-width": "0.8"
}));
const refLbl = mkEl("text", {
  x: xS(1977), y: yS(90) - 4,
  fill: "#9A9890", "font-size": "8.5", "font-family": "JetBrains Mono, monospace"
});
refLbl.textContent = "90% threshold";
svg.appendChild(refLbl);

// X-axis
[1980, 1990, 2000, 2010, 2020].forEach(yr => {
  svg.appendChild(mkEl("text", {
    x: xS(yr), y: H - mar.bottom + 14,
    "text-anchor": "middle", fill: "#9A9890",
    "font-family": "JetBrains Mono, monospace", "font-size": "9"
  })).textContent = yr;
});

const tip = document.getElementById("tip");
function showTip(text, e) {
  tip.textContent = text;
  tip.style.opacity = "1";
  tip.style.left = (e.clientX + 14) + "px";
  tip.style.top = (e.clientY - 26) + "px";
}
function hideTip() { tip.style.opacity = "0"; }

const groups = [];
data.forEach((series, i) => {
  const color = COLORS[i % COLORS.length];
  const g = mkEl("g", {});

  const pathPts = series.pts.map(p => `${xS(p.y)},${yS(p.v)}`).join(" L ");
  const line = mkEl("path", {
    d: "M " + pathPts, stroke: color, "stroke-width": "2",
    fill: "none", "stroke-linejoin": "round", "stroke-linecap": "round"
  });
  g.appendChild(line);

  // Dots at data points
  series.pts.forEach(p => {
    const dot = mkEl("circle", { cx: xS(p.y), cy: yS(p.v), r: "2", fill: color });
    g.appendChild(dot);
  });

  // Hit area
  const hit = mkEl("path", {
    d: "M " + pathPts, stroke: "transparent", "stroke-width": "12", fill: "none"
  });
  g.appendChild(hit);

  svg.appendChild(g);
  groups.push({ g, line, series, color, i });
});

// Endpoint labels
const endLabels = groups.map(({ series, color, i }) => {
  const last = series.pts[series.pts.length - 1];
  return { n: series.n, y: yS(last.v), origY: yS(last.v), color };
});

const resolved = resolveCollisions(endLabels.map(l => ({...l})), 12);
resolved.forEach(lbl => {
  const origLbl = endLabels.find(l => l.n === lbl.n);
  if (Math.abs(lbl.y - origLbl.origY) > 4) {
    svg.appendChild(mkEl("line", {
      x1: W - mar.right + 2, y1: origLbl.origY,
      x2: W - mar.right + 8, y2: lbl.y,
      stroke: lbl.color, "stroke-width": "0.5", opacity: "0.5"
    }));
  }
  const t = mkEl("text", {
    x: W - mar.right + 10, y: lbl.y + 3.5,
    fill: lbl.color, "font-size": "9.5", "font-weight": "500"
  });
  t.textContent = lbl.n;
  svg.appendChild(t);
});

groups.forEach(({ g, line, series, color }) => {
  const hitPath = g.lastChild;
  hitPath.addEventListener("mouseenter", e => {
    groups.forEach(other => {
      other.g.style.opacity = other.series.n === series.n ? "1" : "0.1";
      other.line.setAttribute("stroke-width", other.series.n === series.n ? "2.8" : "2");
    });
  });
  hitPath.addEventListener("mousemove", e => {
    const rect = svg.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const ratio = Math.max(0, Math.min(1, (mx - mar.left) / (W - mar.left - mar.right)));
    const yr = Math.round(xMin + ratio * (xMax - xMin));
    const closest = series.pts.reduce((best, p) =>
      Math.abs(p.y - yr) < Math.abs(best.y - yr) ? p : best
    );
    showTip(`${series.n} ${closest.y}: ${closest.v.toFixed(1)}%`, e);
  });
  hitPath.addEventListener("mouseleave", () => {
    groups.forEach(other => {
      other.g.style.opacity = "1";
      other.line.setAttribute("stroke-width", "2");
    });
    hideTip();
  });
});
</script>
</body></html>
