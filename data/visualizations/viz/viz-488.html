<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      margin: 0;
      padding: 24px;
      background: #fff;
      color: #0f172a;
    }
    h1 { font-size: 18px; font-weight: 700; margin: 0 0 4px; }
    .subtitle { font-size: 13px; color: #64748b; margin: 0 0 20px; }
    #chart { width: 100%; }
    .source { font-size: 11px; color: #94a3b8; margin-top: 12px; }
    #tip {
      position: fixed;
      background: #0f172a;
      color: #fff;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 12px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.1s;
      white-space: nowrap;
      z-index: 10;
    }
  </style>
</head>
<body>
  <h1>Human Capital Index, 2020</h1>
  <p class="subtitle">World Bank HCI measures the productivity of a future worker relative to a benchmark of complete education and full health (0 = none, 1 = full)</p>
  <div id="chart"></div>
  <p class="source">Source: World Bank — Human Capital Index (HD.HCI.OVRL), 2020</p>
  <div id="tip"></div>
  <script>
    // Data from World Bank HCI dataset, 2020 values
    const data = [
      {"n":"Central African Republic","v":0.292},
      {"n":"Chad","v":0.300},
      {"n":"Mali","v":0.318},
      {"n":"Nigeria","v":0.361},
      {"n":"Mozambique","v":0.362},
      {"n":"Ethiopia","v":0.383},
      {"n":"Pakistan","v":0.406},
      {"n":"South Africa","v":0.425},
      {"n":"Bangladesh","v":0.464},
      {"n":"India","v":0.494},
      {"n":"Indonesia","v":0.540},
      {"n":"Brazil","v":0.551},
      {"n":"Iran","v":0.593},
      {"n":"Colombia","v":0.604},
      {"n":"Mexico","v":0.613},
      {"n":"China","v":0.653},
      {"n":"United States","v":0.702},
      {"n":"Germany","v":0.751},
      {"n":"Poland","v":0.753},
      {"n":"France","v":0.763},
      {"n":"Australia","v":0.770},
      {"n":"United Kingdom","v":0.783},
      {"n":"Netherlands","v":0.790},
      {"n":"Ireland","v":0.793},
      {"n":"Sweden","v":0.795},
      {"n":"Finland","v":0.796},
      {"n":"Canada","v":0.798},
      {"n":"South Korea","v":0.799},
      {"n":"Japan","v":0.805},
      {"n":"Singapore","v":0.879}
    ];

    function colorForValue(v) {
      if (v >= 0.75) return "#3D7A5A";
      if (v >= 0.60) return "#5B9E78";
      if (v >= 0.45) return "#C4A23C";
      if (v >= 0.35) return "#C4715A";
      return "#B34B3B";
    }

    const W = 640, barH = 22, gap = 5;
    const leftPad = 170, rightPad = 60, topPad = 10, bottomPad = 10;
    const H = data.length * (barH + gap) + topPad + bottomPad;

    const maxV = 0.88;
    const barScale = v => (v / maxV) * (W - leftPad - rightPad);

    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    svg.setAttribute("width", "100%");
    svg.style.maxWidth = "680px";
    svg.style.display = "block";

    function mkEl(tag, attrs) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
      return el;
    }

    const tip = document.getElementById("tip");
    function showTip(text, e) {
      tip.textContent = text;
      tip.style.opacity = "1";
      tip.style.left = (e.clientX + 14) + "px";
      tip.style.top = (e.clientY - 24) + "px";
    }
    function hideTip() { tip.style.opacity = "0"; }

    // Vertical axis line
    svg.appendChild(mkEl("line", {
      x1: leftPad, y1: topPad - 4,
      x2: leftPad, y2: H - bottomPad,
      stroke: "#E2E0DA", "stroke-width": "1"
    }));

    // Grid lines
    for (const v of [0.25, 0.50, 0.75]) {
      const x = leftPad + barScale(v);
      svg.appendChild(mkEl("line", {
        x1: x, y1: topPad - 4,
        x2: x, y2: H - bottomPad,
        stroke: "#E2E0DA", "stroke-width": "0.8",
        "stroke-dasharray": "3,3"
      }));
      svg.appendChild(mkEl("text", {
        x: x, y: topPad - 8,
        "text-anchor": "middle",
        "font-family": "JetBrains Mono, monospace",
        "font-size": "9",
        fill: "#94a3b8"
      })).textContent = v.toFixed(2);
    }

    const allBars = [];
    data.forEach((d, i) => {
      const y = topPad + i * (barH + gap);
      const color = colorForValue(d.v);
      const bw = barScale(d.v);

      const g = mkEl("g", {});
      g.style.cursor = "default";

      // Bar
      const bar = mkEl("rect", {
        x: leftPad, y: y,
        width: bw, height: barH,
        fill: color, rx: "2"
      });
      g.appendChild(bar);

      // Country label
      const label = mkEl("text", {
        x: leftPad - 8, y: y + barH * 0.65,
        "text-anchor": "end",
        "font-family": "Inter, sans-serif",
        "font-size": "11",
        fill: "#334155"
      });
      label.textContent = d.n;
      g.appendChild(label);

      // Value label
      const valLabel = mkEl("text", {
        x: leftPad + bw + 6, y: y + barH * 0.65,
        "text-anchor": "start",
        "font-family": "JetBrains Mono, monospace",
        "font-size": "10",
        fill: color
      });
      valLabel.textContent = d.v.toFixed(3);
      g.appendChild(valLabel);

      g.addEventListener("mousemove", e => {
        allBars.forEach(b => b.style.opacity = "0.2");
        g.style.opacity = "1";
        showTip(`${d.n}: HCI = ${d.v.toFixed(3)}`, e);
      });
      g.addEventListener("mouseout", () => {
        allBars.forEach(b => b.style.opacity = "1");
        hideTip();
      });

      svg.appendChild(g);
      allBars.push(g);
    });

    document.getElementById("chart").appendChild(svg);
  </script>
</body>
</html>
