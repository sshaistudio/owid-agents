<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');
  body { font-family: 'Inter', sans-serif; margin: 0; padding: 32px 40px; background: #F6F5EE; color: #2B2A27; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; margin: 0 0 4px; color: #2B2A27; }
  .subtitle { font-size: 11px; color: #7A786F; margin: 0 0 24px; max-width: 520px; line-height: 1.5; }
  .source { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #7A786F; margin-top: 20px; letter-spacing: 0.3px; text-transform: uppercase; }
  svg text { font-family: 'Inter', sans-serif; }
  .tooltip { position: fixed; pointer-events: none; background: #2B2A27; color: #F6F5EE; font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 6px 10px; border-radius: 2px; white-space: nowrap; opacity: 0; transition: opacity 0.15s; z-index: 10; }
</style></head><body>
<h1>Rising Mean BMI — 20 Countries with the Largest Increase</h1>
<p class="subtitle">Average body mass index (age-standardized, kg/m²) in the mid-1970s versus the most recent available year (~2012–2016). A BMI above 25 is classified as overweight.</p>
<div id="chart" style="position:relative;"></div>
<div class="tooltip" id="tip"></div>
<p class="source">Source: WHO Global Health Observatory — NCD_BMI_MEAN</p>
<script>
// n = WHO countryName (ISO-3 code) for validator; display name resolved below
const data = [
  {"n":"SYC","a":21.3,"b":27.9},
  {"n":"COM","a":19.4,"b":25.6},
  {"n":"CPV","a":19.9,"b":25.2},
  {"n":"BWA","a":20.8,"b":26.0},
  {"n":"HND","a":20.7,"b":25.7},
  {"n":"CRI","a":22.9,"b":27.6},
  {"n":"PER","a":22.3,"b":26.9},
  {"n":"AGO","a":19.2,"b":23.8},
  {"n":"SUR","a":23.0,"b":27.5},
  {"n":"AFG","a":19.5,"b":24.0},
  {"n":"GHA","a":20.4,"b":24.8},
  {"n":"MEX","a":23.5,"b":27.8},
  {"n":"GMB","a":19.0,"b":23.3},
  {"n":"KGZ","a":22.3,"b":26.5},
  {"n":"CMR","a":20.0,"b":24.1},
  {"n":"MYS","a":21.2,"b":25.3},
  {"n":"TTO","a":23.4,"b":27.4},
  {"n":"UGA","a":19.2,"b":23.2},
  {"n":"TJK","a":21.6,"b":25.5},
  {"n":"USA","a":25.0,"b":28.8}
];
const NAMES = {
  "SYC":"Seychelles","COM":"Comoros","CPV":"Cape Verde","BWA":"Botswana",
  "HND":"Honduras","CRI":"Costa Rica","PER":"Peru","AGO":"Angola",
  "SUR":"Suriname","AFG":"Afghanistan","GHA":"Ghana","MEX":"Mexico",
  "GMB":"Gambia","KGZ":"Kyrgyzstan","CMR":"Cameroon","MYS":"Malaysia",
  "TTO":"Trinidad & Tobago","UGA":"Uganda","TJK":"Tajikistan","USA":"United States"
};
function dname(d) { return NAMES[d.n] || d.n; }

const W = 700, H = 580;
const pad = { left: 150, right: 160, top: 48, bottom: 20 };

const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
svg.setAttribute("width", "100%");
svg.style.maxWidth = W + "px";
document.getElementById("chart").appendChild(svg);

function mkEl(tag, attrs) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

const minV = 18, maxV = 31;
const scaleY = v => pad.top + (maxV - v) / (maxV - minV) * (H - pad.top - pad.bottom);
const xA = pad.left, xB = W - pad.right;

// Overweight threshold reference line
const owY = scaleY(25.0);
svg.appendChild(mkEl("rect", {
  x: xA, y: owY, width: xB - xA, height: scaleY(18) - owY,
  fill: "#F29A44", opacity: "0.07"
}));
svg.appendChild(mkEl("line", {
  x1: xA, y1: owY, x2: xB, y2: owY,
  stroke: "#F29A44", "stroke-dasharray": "4,3", "stroke-width": "0.8"
}));
const owLbl = mkEl("text", { x: xA + 4, y: owY - 4, fill: "#F29A44", "font-size": "9", "font-family": "JetBrains Mono, monospace" });
owLbl.textContent = "BMI 25 — overweight threshold";
svg.appendChild(owLbl);

// Grid lines
[18, 20, 22, 24, 26, 28, 30].forEach(v => {
  svg.appendChild(mkEl("line", {
    x1: xA, y1: scaleY(v), x2: xB, y2: scaleY(v),
    stroke: "#E2E0D5", "stroke-width": "0.5"
  }));
  svg.appendChild(mkEl("text", {
    x: xA - 8, y: scaleY(v) + 3.5,
    fill: "#9A9890", "font-family": "JetBrains Mono, monospace", "font-size": "8", "text-anchor": "end"
  })).textContent = v;
});

// Column headers
const hdr1 = mkEl("text", { x: xA, y: pad.top - 20, fill: "#7A786F", "font-family": "JetBrains Mono, monospace", "font-size": "10", "text-anchor": "middle" });
hdr1.textContent = "mid-1970s";
svg.appendChild(hdr1);

const hdr2 = mkEl("text", { x: xB, y: pad.top - 20, fill: "#7A786F", "font-family": "JetBrains Mono, monospace", "font-size": "10", "text-anchor": "middle" });
hdr2.textContent = "~2012–2016";
svg.appendChild(hdr2);

svg.appendChild(mkEl("line", { x1: xA, y1: scaleY(minV-0.5), x2: xA, y2: scaleY(maxV+0.5), stroke: "#E2E0D5", "stroke-width": "1" }));
svg.appendChild(mkEl("line", { x1: xB, y1: scaleY(minV-0.5), x2: xB, y2: scaleY(maxV+0.5), stroke: "#E2E0D5", "stroke-width": "1" }));

function resolveCollisions(items, minGap) {
  const sorted = items.slice().sort((a, b) => a.y - b.y);
  for (let pass = 0; pass < 30; pass++) {
    let moved = false;
    for (let i = 1; i < sorted.length; i++) {
      const gap = sorted[i].y - sorted[i - 1].y;
      if (gap < minGap) {
        const shift = (minGap - gap) / 2;
        sorted[i - 1].y -= shift;
        sorted[i].y += shift;
        moved = true;
      }
    }
    if (!moved) break;
  }
  return sorted;
}

function clampLabels(items) {
  const sorted = items.slice().sort((a, b) => a.y - b.y);
  for (let i = 0; i < sorted.length; i++) {
    sorted[i].y = Math.max(pad.top, Math.min(H - pad.bottom - 4, sorted[i].y));
  }
  return resolveCollisions(sorted, 13);
}

function colorForChange(change) {
  if (change >= 5) return "#EA5E33";
  if (change >= 4) return "#F29A44";
  if (change >= 3) return "#C49A45";
  return "#A6C4A2";
}

const tip = document.getElementById("tip");

const leftLabels = data.map(d => ({ d, y: scaleY(d.a) }));
const rightLabels = data.map(d => ({ d, y: scaleY(d.b) }));
const leftResolved = clampLabels(leftLabels);
const rightResolved = clampLabels(rightLabels);
const leftMap = new Map(leftResolved.map(l => [l.d.n, l.y]));
const rightMap = new Map(rightResolved.map(l => [l.d.n, l.y]));

const groups = [];
data.forEach(d => {
  const change = d.b - d.a;
  const color = colorForChange(change);
  const yA = scaleY(d.a);
  const yB = scaleY(d.b);

  const g = mkEl("g", {});
  g.style.cursor = "pointer";

  const hit = mkEl("line", { x1: xA, y1: yA, x2: xB, y2: yB, stroke: "transparent", "stroke-width": "12" });
  const line = mkEl("line", { x1: xA, y1: yA, x2: xB, y2: yB, stroke: color, "stroke-width": "1.5", "stroke-linecap": "round" });
  const dotA = mkEl("circle", { cx: xA, cy: yA, r: "2.5", fill: color });
  const dotB = mkEl("circle", { cx: xB, cy: yB, r: "2.5", fill: color });

  const lyA = leftMap.get(d.n);
  const leftLbl = mkEl("text", { x: xA - 8, y: lyA + 3.5, fill: "#2B2A27", "font-size": "9.5", "text-anchor": "end" });
  leftLbl.textContent = `${dname(d)}  ${d.a.toFixed(1)}`;
  if (Math.abs(lyA - yA) > 2) {
    g.appendChild(mkEl("line", { x1: xA - 5, y1: yA, x2: xA - 5, y2: lyA, stroke: color, "stroke-width": "0.5", opacity: "0.4" }));
  }

  const lyB = rightMap.get(d.n);
  const rightLbl = mkEl("text", { x: xB + 8, y: lyB + 3.5, fill: "#2B2A27", "font-size": "9.5", "text-anchor": "start" });
  rightLbl.textContent = `${d.b.toFixed(1)}  ${dname(d)}`;
  if (Math.abs(lyB - yB) > 2) {
    g.appendChild(mkEl("line", { x1: xB + 5, y1: yB, x2: xB + 5, y2: lyB, stroke: color, "stroke-width": "0.5", opacity: "0.4" }));
  }

  g.appendChild(line);
  g.appendChild(dotA);
  g.appendChild(dotB);
  g.appendChild(leftLbl);
  g.appendChild(rightLbl);
  g.appendChild(hit);

  g.addEventListener("mouseenter", e => {
    groups.forEach(og => { og.style.opacity = "0.12"; });
    g.style.opacity = "1";
    tip.textContent = `${dname(d)}: ${d.a.toFixed(1)} → ${d.b.toFixed(1)} kg/m² (+${change.toFixed(1)})`;
    tip.style.opacity = "1";
    tip.style.left = (e.clientX + 14) + "px";
    tip.style.top = (e.clientY - 22) + "px";
  });
  g.addEventListener("mousemove", e => {
    tip.style.left = (e.clientX + 14) + "px";
    tip.style.top = (e.clientY - 22) + "px";
  });
  g.addEventListener("mouseleave", () => {
    groups.forEach(og => { og.style.opacity = "1"; });
    tip.style.opacity = "0";
  });

  groups.push(g);
  svg.appendChild(g);
});

// Legend
const legendX = xA, legendY = H - 4;
const legendItems = [
  { color: "#EA5E33", label: "≥5 kg/m² rise" },
  { color: "#F29A44", label: "4–5 kg/m²" },
  { color: "#C49A45", label: "3–4 kg/m²" },
  { color: "#A6C4A2", label: "<3 kg/m²" }
];
legendItems.forEach((li, i) => {
  const lx = legendX + i * 108;
  svg.appendChild(mkEl("rect", { x: lx, y: legendY - 8, width: 8, height: 8, fill: li.color, rx: "1" }));
  const lt = mkEl("text", { x: lx + 11, y: legendY, fill: "#7A786F", "font-size": "8.5", "font-family": "JetBrains Mono, monospace" });
  lt.textContent = li.label;
  svg.appendChild(lt);
});
</script>
</body></html>
