<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0; padding: 24px;
      background: #fff; color: #0f172a;
    }
    h1 { font-size: 18px; font-weight: 700; margin: 0 0 4px; }
    .subtitle { font-size: 13px; color: #64748b; margin: 0 0 20px; }
    #chart { width: 100%; max-width: 760px; }
    .source { font-size: 11px; color: #94a3b8; margin-top: 12px; }
    #tip {
      position: fixed; pointer-events: none; opacity: 0;
      background: #1e293b; color: #f8fafc;
      font-size: 12px; padding: 6px 10px; border-radius: 5px;
      white-space: nowrap; transition: opacity 0.1s;
    }
  </style>
</head>
<body>
  <h1>Net Forest Depletion, 2000–2021</h1>
  <p class="subtitle">Value of timber harvested beyond sustainable yield, as a share of national income. Countries losing the most from their forests, year by year.</p>
  <div id="chart"></div>
  <p class="source">Source: World Bank Adjusted Savings (NY.ADJ.DFOR.GN.ZS)</p>
  <div id="tip"></div>
  <script>
    const data = [{"n":"Burundi","pts":[{"y":2000,"v":14.82},{"y":2001,"v":18.98},{"y":2002,"v":24.56},{"y":2003,"v":41.35},{"y":2004,"v":31.28},{"y":2005,"v":26.98},{"y":2006,"v":23.79},{"y":2007,"v":32.15},{"y":2008,"v":32.75},{"y":2009,"v":30.35},{"y":2010,"v":23.79},{"y":2011,"v":24.8},{"y":2012,"v":17.16},{"y":2013,"v":17.5},{"y":2014,"v":17.24},{"y":2015,"v":15.39},{"y":2016,"v":18.95},{"y":2017,"v":18.23},{"y":2018,"v":13.4},{"y":2019,"v":13.09},{"y":2020,"v":13.77},{"y":2021,"v":13.92}]},{"n":"Congo, Dem. Rep.","pts":[{"y":2000,"v":6.71},{"y":2001,"v":17.47},{"y":2002,"v":17.9},{"y":2003,"v":28.47},{"y":2004,"v":22.21},{"y":2005,"v":20.42},{"y":2006,"v":16.93},{"y":2007,"v":21.61},{"y":2008,"v":22.8},{"y":2009,"v":24.08},{"y":2010,"v":18.52},{"y":2011,"v":17.94},{"y":2012,"v":18.45},{"y":2013,"v":17.92},{"y":2014,"v":18.06},{"y":2015,"v":17.78},{"y":2016,"v":18.19},{"y":2017,"v":17.6},{"y":2018,"v":9.89},{"y":2019,"v":8.97},{"y":2020,"v":10.2},{"y":2021,"v":9.97}]},{"n":"Guinea-Bissau","pts":[{"y":2000,"v":12.27},{"y":2001,"v":11.49},{"y":2002,"v":12.85},{"y":2003,"v":18.25},{"y":2004,"v":14.41},{"y":2005,"v":13.66},{"y":2006,"v":13.49},{"y":2007,"v":16.81},{"y":2008,"v":16.24},{"y":2009,"v":17.41},{"y":2010,"v":14.99},{"y":2011,"v":13.17},{"y":2012,"v":17.03},{"y":2013,"v":17.27},{"y":2014,"v":18.06},{"y":2015,"v":19.4},{"y":2016,"v":18.24},{"y":2017,"v":15.95},{"y":2018,"v":10.24},{"y":2019,"v":9.74},{"y":2020,"v":10.96},{"y":2021,"v":10.41}]},{"n":"Ethiopia","pts":[{"y":2000,"v":18.49},{"y":2001,"v":18.13},{"y":2002,"v":23.17},{"y":2003,"v":36.34},{"y":2004,"v":27.94},{"y":2005,"v":23.49},{"y":2006,"v":18.73},{"y":2007,"v":21.76},{"y":2008,"v":18.65},{"y":2009,"v":16.33},{"y":2010,"v":15.58},{"y":2011,"v":16.75},{"y":2012,"v":14.41},{"y":2013,"v":13.69},{"y":2014,"v":13.18},{"y":2015,"v":12.13},{"y":2016,"v":11.15},{"y":2017,"v":9.82},{"y":2018,"v":6.36},{"y":2019,"v":5.51},{"y":2020,"v":5.44},{"y":2021,"v":5.63}]},{"n":"Guinea","pts":[{"y":2000,"v":7.63},{"y":2001,"v":7.57},{"y":2002,"v":8.36},{"y":2003,"v":12.25},{"y":2004,"v":10.37},{"y":2005,"v":14.04},{"y":2006,"v":8.41},{"y":2007,"v":7.62},{"y":2008,"v":7.42},{"y":2009,"v":6.94},{"y":2010,"v":4.95},{"y":2011,"v":6.34},{"y":2012,"v":7.06},{"y":2013,"v":7.49},{"y":2014,"v":8.32},{"y":2015,"v":9.12},{"y":2016,"v":10.15},{"y":2017,"v":8.4},{"y":2018,"v":5.37},{"y":2019,"v":4.76},{"y":2020,"v":5.32},{"y":2021,"v":5.12}]},{"n":"Guyana","pts":[{"y":2000,"v":8.52},{"y":2001,"v":9.15},{"y":2002,"v":8.95},{"y":2003,"v":10.09},{"y":2004,"v":10.65},{"y":2005,"v":10.98},{"y":2006,"v":6.02},{"y":2007,"v":5.73},{"y":2008,"v":5.43},{"y":2009,"v":5.11},{"y":2010,"v":7.89},{"y":2011,"v":6.77},{"y":2012,"v":5.87},{"y":2013,"v":6.97},{"y":2014,"v":6.65},{"y":2015,"v":5.37},{"y":2016,"v":5.53},{"y":2017,"v":4.96},{"y":2018,"v":4.36},{"y":2019,"v":3.49},{"y":2020,"v":3.94},{"y":2021,"v":2.34}]},{"n":"Ghana","pts":[{"y":2000,"v":10.03},{"y":2001,"v":9.59},{"y":2002,"v":10.07},{"y":2003,"v":14.2},{"y":2004,"v":11.08},{"y":2005,"v":9.48},{"y":2006,"v":5.04},{"y":2007,"v":6.29},{"y":2008,"v":6.6},{"y":2009,"v":7.64},{"y":2010,"v":5.87},{"y":2011,"v":5.68},{"y":2012,"v":6.56},{"y":2013,"v":4.55},{"y":2014,"v":5.98},{"y":2015,"v":7.04},{"y":2016,"v":6.64},{"y":2017,"v":6.21},{"y":2018,"v":3.99},{"y":2019,"v":3.63},{"y":2020,"v":3.76},{"y":2021,"v":3.85}]},{"n":"Gambia","pts":[{"y":2000,"v":2.35},{"y":2001,"v":2.61},{"y":2002,"v":3.76},{"y":2003,"v":6.42},{"y":2004,"v":2.61},{"y":2005,"v":2.69},{"y":2006,"v":2.8},{"y":2007,"v":3.1},{"y":2008,"v":3.24},{"y":2009,"v":3.36},{"y":2010,"v":3.09},{"y":2011,"v":4.57},{"y":2012,"v":5.9},{"y":2013,"v":6.04},{"y":2014,"v":5.37},{"y":2015,"v":5.7},{"y":2016,"v":6.69},{"y":2017,"v":6.62},{"y":2018,"v":2.77},{"y":2019,"v":2.86},{"y":2020,"v":3.08},{"y":2021,"v":2.93}]},{"n":"Chad","pts":[{"y":2000,"v":10.14},{"y":2001,"v":7.31},{"y":2002,"v":6.97},{"y":2003,"v":8.1},{"y":2004,"v":3.77},{"y":2005,"v":2.39},{"y":2006,"v":2.6},{"y":2007,"v":3.43},{"y":2008,"v":4.06},{"y":2009,"v":4.32},{"y":2010,"v":3.69},{"y":2011,"v":3.68},{"y":2012,"v":4.18},{"y":2013,"v":4.27},{"y":2014,"v":4.32},{"y":2015,"v":5.61},{"y":2016,"v":6.21},{"y":2017,"v":6.13},{"y":2018,"v":3.93},{"y":2019,"v":3.63},{"y":2020,"v":4.33},{"y":2021,"v":3.96}]},{"n":"Bhutan","pts":[{"y":2000,"v":3.86},{"y":2001,"v":3.57},{"y":2002,"v":3.41},{"y":2003,"v":3.24},{"y":2004,"v":2.88},{"y":2005,"v":2.45},{"y":2006,"v":3.06},{"y":2007,"v":3.95},{"y":2008,"v":3.46},{"y":2009,"v":3.32},{"y":2010,"v":4.88},{"y":2011,"v":4.49},{"y":2012,"v":3.95},{"y":2013,"v":3.25},{"y":2014,"v":3.24},{"y":2015,"v":3.83},{"y":2016,"v":4.31},{"y":2017,"v":3.25},{"y":2018,"v":1.89},{"y":2019,"v":2.06},{"y":2020,"v":2.63},{"y":2021,"v":2.55}]}];

    const W = 760, H = 460;
    const margin = { top: 40, right: 140, bottom: 40, left: 50 };

    const allPts = data.flatMap(d => d.pts);
    const yearMin = 2000, yearMax = 2021;
    const valMin = 0, valMax = 45;

    const xScale = y => margin.left + (y - yearMin) / (yearMax - yearMin) * (W - margin.left - margin.right);
    const yScale = v => margin.top + (valMax - v) / (valMax - valMin) * (H - margin.top - margin.bottom);

    const PALETTE = ["#7c3aed","#dc2626","#ea580c","#ca8a04","#16a34a","#0891b2","#1d4ed8","#64748b","#9d174d","#374151"];

    function mkEl(tag, attrs) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
      return el;
    }

    function resolveCollisions(items, minGap) {
      const sorted = items.slice().sort((a, b) => a.y - b.y);
      for (let pass = 0; pass < 30; pass++) {
        let moved = false;
        for (let i = 1; i < sorted.length; i++) {
          const gap = sorted[i].y - sorted[i - 1].y;
          if (gap < minGap) {
            const shift = (minGap - gap) / 2;
            sorted[i - 1].y -= shift;
            sorted[i].y += shift;
            moved = true;
          }
        }
        if (!moved) break;
      }
      return sorted;
    }

    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    svg.setAttribute("width", "100%");

    // Grid + Y axis
    [0, 10, 20, 30, 40].forEach(v => {
      const y = yScale(v);
      svg.appendChild(mkEl("line", {x1: margin.left, y1: y, x2: W - margin.right, y2: y, stroke: "#f1f5f9", "stroke-width": "1"}));
      const lbl = mkEl("text", {x: margin.left - 6, y: y + 4, "text-anchor": "end", style: "font-family:'JetBrains Mono',monospace;font-size:9px;fill:#94a3b8"});
      lbl.textContent = v + "%";
      svg.appendChild(lbl);
    });

    // X axis labels
    [2000, 2005, 2010, 2015, 2021].forEach(yr => {
      const x = xScale(yr);
      const lbl = mkEl("text", {x, y: H - margin.bottom + 14, "text-anchor": "middle", style: "font-family:'JetBrains Mono',monospace;font-size:9px;fill:#94a3b8"});
      lbl.textContent = yr;
      svg.appendChild(lbl);
    });

    const tip = document.getElementById("tip");
    const allGroups = [];

    // Endpoint labels
    const endLabels = data.map((d, i) => {
      const last = d.pts[d.pts.length - 1];
      return { d, i, y: yScale(last.v) };
    });
    const resolved = resolveCollisions(endLabels, 12);
    const labelMap = Object.fromEntries(resolved.map(item => [item.d.n, item.y]));

    data.forEach((d, i) => {
      const col = PALETTE[i % PALETTE.length];
      const g = mkEl("g", {});

      const pathD = d.pts.map((p, j) => `${j === 0 ? "M" : "L"} ${xScale(p.y)} ${yScale(p.v)}`).join(" ");
      const line = mkEl("path", {d: pathD, stroke: col, "stroke-width": "1.5", fill: "none", "stroke-linejoin": "round"});
      g.appendChild(line);

      const last = d.pts[d.pts.length - 1];
      const actualY = yScale(last.v);
      const labelY = labelMap[d.n];

      if (Math.abs(labelY - actualY) > 2) {
        g.appendChild(mkEl("line", {x1: W - margin.right + 3, y1: actualY, x2: W - margin.right + 8, y2: labelY, stroke: col, "stroke-width": "0.5", opacity: "0.5"}));
      }

      const lbl = mkEl("text", {
        x: W - margin.right + 10, y: labelY + 4, "text-anchor": "start",
        style: `font-family:"JetBrains Mono",monospace;font-size:9px;fill:${col};font-weight:500`
      });
      lbl.textContent = `${last.v}%  ${d.n}`;
      g.appendChild(lbl);

      const hit = mkEl("path", {d: pathD, stroke: "transparent", "stroke-width": "12", fill: "none", cursor: "pointer"});
      g.appendChild(hit);

      hit.addEventListener("mouseenter", e => {
        allGroups.forEach(og => og.style.opacity = og === g ? "1" : "0.08");
        line.setAttribute("stroke-width", "3");
        tip.textContent = `${d.n}: ${last.v}% of GNI (2021)`;
        tip.style.opacity = "1";
        tip.style.left = (e.clientX + 12) + "px";
        tip.style.top = (e.clientY - 20) + "px";
      });
      hit.addEventListener("mousemove", e => {
        const rect = svg.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const ratio = Math.max(0, Math.min(1, (mx - margin.left) / (W - margin.left - margin.right)));
        const yr = Math.round(yearMin + ratio * (yearMax - yearMin));
        const closest = d.pts.reduce((best, p) => Math.abs(p.y - yr) < Math.abs(best.y - yr) ? p : best, d.pts[0]);
        tip.textContent = `${d.n} (${closest.y}): ${closest.v}% of GNI`;
        tip.style.left = (e.clientX + 12) + "px";
        tip.style.top = (e.clientY - 20) + "px";
      });
      hit.addEventListener("mouseleave", () => {
        allGroups.forEach(og => og.style.opacity = "1");
        line.setAttribute("stroke-width", "1.5");
        tip.style.opacity = "0";
      });

      svg.appendChild(g);
      allGroups.push(g);
    });

    document.getElementById("chart").appendChild(svg);
  </script>
</body>
</html>
