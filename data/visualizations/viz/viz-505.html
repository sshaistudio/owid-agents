<h1>World Cereal Production — Top 10 Producers, 1961–2024</h1>
<p class="subtitle">Annual cereal production in million metric tons. China and India together account for over half of global output, with both more than quadrupling since 1961.</p>

<p class="source">Source: World Bank — AG.PRD.CREL.MT (FAO)</p>
<script>

  {"n":"Brazil","pts":[{"y":1961,"v":15.0},{"y":1964,"v":16.5},{"y":1967,"v":20.3},{"y":1970,"v":23.7},{"y":1973,"v":23.7},{"y":1976,"v":31.1},{"y":1979,"v":27.1},{"y":1982,"v":33.8},{"y":1985,"v":36.0},{"y":1988,"v":42.9},{"y":1991,"v":36.7},{"y":1994,"v":45.8},{"y":1997,"v":44.9},{"y":2000,"v":46.5},{"y":2003,"v":67.5},{"y":2006,"v":59.1},{"y":2009,"v":70.9},{"y":2012,"v":89.9},{"y":2015,"v":106.0},{"y":2018,"v":103.3},{"y":2021,"v":112.0},{"y":2024,"v":139.0}]},
  {"n":"Argentina","pts":[{"y":1961,"v":14.5},{"y":1964,"v":20.8},{"y":1967,"v":19.6},{"y":1970,"v":19.9},{"y":1973,"v":23.9},{"y":1976,"v":24.9},{"y":1979,"v":25.1},{"y":1982,"v":34.3},{"y":1985,"v":28.1},{"y":1988,"v":22.3},{"y":1991,"v":21.7},{"y":1994,"v":25.4},{"y":1997,"v":35.4},{"y":2000,"v":38.5},{"y":2003,"v":34.6},{"y":2006,"v":34.1},{"y":2009,"v":26.7},{"y":2012,"v":40.7},{"y":2015,"v":53.4},{"y":2018,"v":71.5},{"y":2021,"v":92.2},{"y":2024,"v":85.7}]},
  {"n":"Indonesia","pts":[{"y":1961,"v":14.4},{"y":1964,"v":16.1},{"y":1967,"v":15.6},{"y":1970,"v":22.2},{"y":1973,"v":25.2},{"y":1976,"v":25.9},{"y":1979,"v":29.9},{"y":1982,"v":36.8},{"y":1985,"v":43.4},{"y":1988,"v":48.3},{"y":1991,"v":50.9},{"y":1994,"v":53.5},{"y":1997,"v":58.1},{"y":2000,"v":61.6},{"y":2003,"v":63.0},{"y":2006,"v":66.1},{"y":2009,"v":76.6},{"y":2012,"v":79.1},{"y":2015,"v":80.6},{"y":2018,"v":78.0},{"y":2021,"v":67.8},{"y":2024,"v":68.3}]},
  {"n":"Bangladesh","pts":[{"y":1961,"v":14.5},{"y":1964,"v":15.8},{"y":1967,"v":16.9},{"y":1970,"v":16.9},{"y":1973,"v":18.0},{"y":1976,"v":17.9},{"y":1979,"v":19.7},{"y":1982,"v":22.3},{"y":1985,"v":24.1},{"y":1988,"v":24.4},{"y":1991,"v":27.8},{"y":1994,"v":26.8},{"y":1997,"v":28.8},{"y":2000,"v":38.2},{"y":2003,"v":40.0},{"y":2006,"v":40.8},{"y":2009,"v":49.2},{"y":2012,"v":53.0},{"y":2015,"v":56.1},{"y":2018,"v":59.0},{"y":2021,"v":62.0},{"y":2024,"v":66.3}]},
  {"n":"Canada","pts":[{"y":1961,"v":16.7},{"y":1964,"v":28.5},{"y":1967,"v":30.1},{"y":1970,"v":28.6},{"y":1973,"v":36.6},{"y":1976,"v":44.7},{"y":1979,"v":36.0},{"y":1982,"v":53.3},{"y":1985,"v":48.2},{"y":1988,"v":35.5},{"y":1991,"v":53.9},{"y":1994,"v":46.6},{"y":1997,"v":49.6},{"y":2000,"v":51.1},{"y":2003,"v":49.2},{"y":2006,"v":48.6},{"y":2009,"v":49.7},{"y":2012,"v":51.8},{"y":2015,"v":53.6},{"y":2018,"v":58.7},{"y":2021,"v":47.5},{"y":2024,"v":63.7}]},
  {"n":"France","pts":[{"y":1961,"v":20.8},{"y":1964,"v":26.1},{"y":1967,"v":32.3},{"y":1970,"v":31.4},{"y":1973,"v":43.1},{"y":1976,"v":32.7},{"y":1979,"v":44.3},{"y":1982,"v":48.7},{"y":1985,"v":55.7},{"y":1988,"v":56.1},{"y":1991,"v":60.3},{"y":1994,"v":53.2},{"y":1997,"v":63.0},{"y":2000,"v":65.7},{"y":2003,"v":55.1},{"y":2006,"v":61.8},{"y":2009,"v":70.4},{"y":2012,"v":68.3},{"y":2015,"v":73.1},{"y":2018,"v":61.8},{"y":2021,"v":66.9},{"y":2024,"v":53.6}]},
  {"n":"Australia","pts":[{"y":1961,"v":9.1},{"y":1964,"v":13.0},{"y":1967,"v":9.9},{"y":1970,"v":12.9},{"y":1973,"v":17.0},{"y":1976,"v":17.4},{"y":1979,"v":23.3},{"y":1982,"v":14.2},{"y":1985,"v":24.9},{"y":1988,"v":21.9},{"y":1991,"v":18.8},{"y":1994,"v":15.5},{"y":1997,"v":31.3},{"y":2000,"v":34.4},{"y":2003,"v":41.1},{"y":2006,"v":20.0},{"y":2009,"v":34.4},{"y":2012,"v":35.4},{"y":2015,"v":36.2},{"y":2018,"v":30.0},{"y":2021,"v":55.0},{"y":2024,"v":52.4}]},
  {"n":"Germany","pts":[{"y":1961,"v":17.3},{"y":1964,"v":22.7},{"y":1967,"v":25.4},{"y":1970,"v":23.8},{"y":1973,"v":29.7},{"y":1976,"v":27.3},{"y":1979,"v":31.7},{"y":1982,"v":34.6},{"y":1985,"v":37.6},{"y":1988,"v":36.9},{"y":1991,"v":39.3},{"y":1994,"v":36.3},{"y":1997,"v":45.5},{"y":2000,"v":45.3},{"y":2003,"v":39.4},{"y":2006,"v":43.5},{"y":2009,"v":49.8},{"y":2012,"v":45.4},{"y":2015,"v":48.9},{"y":2018,"v":37.9},{"y":2021,"v":42.4},{"y":2024,"v":39.0}]}
];

const W = 800, H = 460;
const margin = { top: 30, right: 130, bottom: 40, left: 58 };

const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
svg.setAttribute("width", "100%");
svg.style.maxWidth = W + "px";
document.getElementById("chart").appendChild(svg);

function mkEl(tag, attrs) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

const yearMin = 1961, yearMax = 2024;
const valMin = 0, valMax = 700;

const xScale = y => margin.left + (y - yearMin) / (yearMax - yearMin) * (W - margin.left - margin.right);
const yScale = v => margin.top + (valMax - v) / (valMax - valMin) * (H - margin.top - margin.bottom);

// Grid
[100, 200, 300, 400, 500, 600].forEach(v => {
  svg.appendChild(mkEl("line", {
    x1: margin.left, y1: yScale(v), x2: W - margin.right, y2: yScale(v),
    stroke: "#E2E0D5", "stroke-width": "0.5"
  }));
  svg.appendChild(mkEl("text", {
    x: margin.left - 6, y: yScale(v) + 3.5,
    fill: "#9A9890", "font-family": "JetBrains Mono, monospace", "font-size": "8.5", "text-anchor": "end"
  })).textContent = v;
});

// Y-axis label
const yLbl = mkEl("text", {
  x: 12, y: margin.top + (H - margin.top - margin.bottom) / 2,
  fill: "#7A786F", "font-family": "JetBrains Mono, monospace", "font-size": "9", "text-anchor": "middle",
  transform: `rotate(-90, 12, ${margin.top + (H - margin.top - margin.bottom) / 2})`
});
yLbl.textContent = "million metric tons";
svg.appendChild(yLbl);

// X-axis
[1961, 1970, 1980, 1990, 2000, 2010, 2024].forEach(y => {
  svg.appendChild(mkEl("text", {
    x: xScale(y), y: H - margin.bottom + 14,
    fill: "#9A9890", "font-family": "JetBrains Mono, monospace", "font-size": "9", "text-anchor": "middle"
  })).textContent = y;
  svg.appendChild(mkEl("line", {
    x1: xScale(y), y1: yScale(0) + 2, x2: xScale(y), y2: yScale(0) + 5,
    stroke: "#C2C0B5", "stroke-width": "0.7"
  }));
});

const COLORS = ["#EA5E33","#F29A44","#C49A45","#5B9E78","#3D7A5A","#A6C4A2","#7A786F","#4A7A9B","#B34B3B","#8B5E9B"];

function resolveCollisions(items, minGap) {
  const sorted = items.slice().sort((a, b) => a.y - b.y);
  for (let pass = 0; pass < 30; pass++) {
    let moved = false;
    for (let i = 1; i < sorted.length; i++) {
      const gap = sorted[i].y - sorted[i - 1].y;
      if (gap < minGap) {
        const shift = (minGap - gap) / 2;
        sorted[i - 1].y -= shift;
        sorted[i].y += shift;
        moved = true;
      }
    }
    if (!moved) break;
  }
  return sorted;
}

const tip = document.getElementById("tip");
const groups = [];

const endpointLabels = data.map((series, idx) => {
  const last = series.pts[series.pts.length - 1];
  return { series, idx, y: yScale(last.v) };
});
const resolved = resolveCollisions(endpointLabels, 12);
const labelMap = new Map(resolved.map(l => [l.series.n, l.y]));

data.forEach((series, idx) => {
  const color = COLORS[idx % COLORS.length];
  const pts = series.pts;

  const g = mkEl("g", {});
  g.style.cursor = "pointer";

  const pathD = pts.map((p, i) => `${i === 0 ? "M" : "L"} ${xScale(p.y)} ${yScale(p.v)}`).join(" ");
  const line = mkEl("path", { d: pathD, stroke: color, "stroke-width": "1.5", fill: "none", "stroke-linejoin": "round" });
  const hitPath = mkEl("path", { d: pathD, stroke: "transparent", "stroke-width": "12", fill: "none" });

  const last = pts[pts.length - 1];
  const lyEnd = labelMap.get(series.n);
  const yEnd = yScale(last.v);

  if (Math.abs(lyEnd - yEnd) > 2) {
    g.appendChild(mkEl("line", {
      x1: W - margin.right + 2, y1: yEnd,
      x2: W - margin.right + 4, y2: lyEnd,
      stroke: color, "stroke-width": "0.6", opacity: "0.5"
    }));
  }

  const lbl = mkEl("text", { x: W - margin.right + 8, y: lyEnd + 3.5, fill: "#2B2A27", "font-size": "9.5" });
  lbl.textContent = `${last.v.toFixed(0)}  ${series.n}`;

  g.appendChild(line);
  g.appendChild(lbl);
  g.appendChild(hitPath);

  g.addEventListener("mouseenter", e => {
    groups.forEach(og => { og.style.opacity = "0.1"; });
    g.style.opacity = "1";
    line.setAttribute("stroke-width", "2.5");
    tip.style.opacity = "1";
    tip.style.left = (e.clientX + 14) + "px";
    tip.style.top = (e.clientY - 22) + "px";
  });
  g.addEventListener("mousemove", e => {
    const rect = svg.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (W / rect.width);
    const yr = yearMin + (mx - margin.left) / (W - margin.left - margin.right) * (yearMax - yearMin);
    const nearest = pts.reduce((best, p) => Math.abs(p.y - yr) < Math.abs(best.y - yr) ? p : best);
    tip.textContent = `${series.n} ${nearest.y}: ${nearest.v.toFixed(1)} Mt`;
    tip.style.left = (e.clientX + 14) + "px";
    tip.style.top = (e.clientY - 22) + "px";
  });
  g.addEventListener("mouseleave", () => {
    groups.forEach(og => { og.style.opacity = "1"; });
    line.setAttribute("stroke-width", "1.5");
    tip.style.opacity = "0";
  });

  groups.push(g);
  svg.appendChild(g);
});
</script>
</body></html>
