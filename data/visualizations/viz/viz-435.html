<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; margin: 0; padding: 32px 40px; background: #F6F5EE; color: #2B2A27; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; margin: 0 0 4px; color: #2B2A27; }
  .subtitle { font-size: 11px; color: #7A786F; margin: 0 0 24px; max-width: 520px; line-height: 1.5; }
  .source { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #7A786F; margin-top: 16px; letter-spacing: 0.3px; text-transform: uppercase; }
  svg text { font-family: 'Inter', sans-serif; }
  .tooltip { position: fixed; pointer-events: none; background: #2B2A27; color: #F6F5EE; font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 6px 10px; border-radius: 2px; white-space: nowrap; opacity: 0; transition: opacity 0.15s; z-index: 10; }
</style></head>
<body>
<h1>Hydropower's Share of Electricity: 1990 vs. 2022</h1>
<p class="subtitle">% of total electricity generated from hydroelectric sources. Several historically hydro-dominant countries (Cameroon, Brazil, Ghana, Costa Rica) have diversified away; DR Congo and Albania remain near 100%.</p>
<div id="chart" style="position:relative;"></div>
<div class="tooltip" id="tip"></div>
<p class="source">Source: World Bank — EG.ELC.HYRO.ZS</p>
<script>
const data = [{"n":"DR Congo","a":99.6,"b":99.6},{"n":"Albania","a":86.4,"b":97.7},{"n":"Ethiopia","a":88.4,"b":96.7},{"n":"Costa Rica","a":97.5,"b":74.6},{"n":"Ecuador","a":78.5,"b":74.6},{"n":"Colombia","a":75.6,"b":72.4},{"n":"Cameroon","a":98.5,"b":67.3},{"n":"Brazil","a":92.8,"b":63.1},{"n":"Canada","a":61.5,"b":60.4},{"n":"Austria","a":64.6,"b":56.6},{"n":"Ghana","a":100,"b":35.4},{"n":"China","a":20.4,"b":15.1},{"n":"India","a":24.8,"b":9.5},{"n":"Australia","a":9.6,"b":6.3},{"n":"Germany","a":3.6,"b":4.1}];

const W = 640, H = 580;
const pad = { left: 120, right: 130, top: 48, bottom: 20 };
const xL = pad.left, xR = W - pad.right;
const minV = 0, maxV = 100;

const scale = v => pad.top + (maxV - v) / (maxV - minV) * (H - pad.top - pad.bottom);

function colorFor(d) {
  const change = d.b - d.a;
  if (change > 5) return '#3D7A5A';
  if (change > 0) return '#8BAD72';
  if (change > -10) return '#C49A45';
  if (change > -25) return '#C4715A';
  return '#B34B3B';
}

function resolveCollisions(items, minGap) {
  const sorted = items.slice().sort((a, b) => a.y - b.y);
  for (let pass = 0; pass < 60; pass++) {
    let moved = false;
    for (let i = 1; i < sorted.length; i++) {
      const gap = sorted[i].y - sorted[i-1].y;
      if (gap < minGap) { const shift = (minGap-gap)/2; sorted[i-1].y -= shift; sorted[i].y += shift; moved = true; }
    }
    if (!moved) break;
  }
  return sorted;
}

function mkEl(tag, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
svg.setAttribute('width', '100%');
svg.style.maxWidth = W + 'px';
document.getElementById('chart').appendChild(svg);

// Column headers
['1990', '2022'].forEach((label, i) => {
  const x = i === 0 ? xL : xR;
  const hdr = mkEl('text', { x, y: pad.top - 16, 'text-anchor': 'middle', 'font-size': '10', 'font-family': 'JetBrains Mono', fill: '#7A786F' });
  hdr.textContent = label;
  svg.appendChild(hdr);
  svg.appendChild(mkEl('line', { x1: x, y1: pad.top-8, x2: x, y2: H-pad.bottom, stroke: '#E2E0D5', 'stroke-width': '1' }));
});

// Grid ticks
[0,25,50,75,100].forEach(v => {
  [xL, xR].forEach(x => svg.appendChild(mkEl('line', { x1: x-3, y1: scale(v), x2: x+3, y2: scale(v), stroke: '#C2C0B5', 'stroke-width': '0.8' })));
  const lbl = mkEl('text', { x: xL-8, y: scale(v)+3, 'text-anchor': 'end', 'font-size': '8', 'font-family': 'JetBrains Mono', fill: '#9A9890' });
  lbl.textContent = v + '%';
  svg.appendChild(lbl);
});

const tip = document.getElementById('tip');
function showTip(text, e) { tip.textContent = text; tip.style.opacity = '1'; tip.style.left = (e.clientX+14)+'px'; tip.style.top = (e.clientY-28)+'px'; }
function hideTip() { tip.style.opacity = '0'; }

const rows = [];
data.forEach(d => {
  const color = colorFor(d);
  const g = mkEl('g', { cursor: 'crosshair' });
  const ya = scale(d.a), yb = scale(d.b);
  const line = mkEl('line', { x1: xL, y1: ya, x2: xR, y2: yb, stroke: color, 'stroke-width': '1.5', opacity: '0.9' });
  g.appendChild(line);
  const hit = mkEl('line', { x1: xL, y1: ya, x2: xR, y2: yb, stroke: 'transparent', 'stroke-width': '14' });
  g.appendChild(hit);
  [{ x: xL, y: ya }, { x: xR, y: yb }].forEach(pt => g.appendChild(mkEl('circle', { cx: pt.x, cy: pt.y, r: '3', fill: color })));
  svg.appendChild(g);
  rows.push({ g, line, d, color, ya, yb });
});

// Left labels
const leftItems = rows.map(r => ({ y: r.ya, row: r }));
resolveCollisions(leftItems, 13).forEach(item => {
  const lbl = mkEl('text', { x: xL-8, y: item.y+3.5, 'text-anchor': 'end', 'font-size': '9', fill: item.row.color });
  lbl.textContent = `${item.row.d.n}  ${item.row.d.a.toFixed(0)}%`;
  svg.appendChild(lbl);
  if (Math.abs(item.y - item.row.ya) > 2) svg.appendChild(mkEl('line', { x1: xL-4, y1: item.row.ya, x2: xL-4, y2: item.y, stroke: '#C2C0B5', 'stroke-width': '0.5' }));
});

// Right labels
const rightItems = rows.map(r => ({ y: r.yb, row: r }));
resolveCollisions(rightItems, 13).forEach(item => {
  const lbl = mkEl('text', { x: xR+8, y: item.y+3.5, 'text-anchor': 'start', 'font-size': '9', fill: item.row.color });
  lbl.textContent = `${item.row.d.b.toFixed(0)}%  ${item.row.d.n}`;
  svg.appendChild(lbl);
  if (Math.abs(item.y - item.row.yb) > 2) svg.appendChild(mkEl('line', { x1: xR+4, y1: item.row.yb, x2: xR+4, y2: item.y, stroke: '#C2C0B5', 'stroke-width': '0.5' }));
});

// Hover
rows.forEach(({ g, line, d }) => {
  const hit = g.querySelectorAll('line')[1];
  hit.addEventListener('mouseenter', () => {
    rows.forEach(o => { if (o.g!==g) { o.line.setAttribute('opacity','0.08'); o.g.querySelectorAll('circle').forEach(c=>c.setAttribute('opacity','0.08')); } });
    line.setAttribute('stroke-width','3');
  });
  hit.addEventListener('mousemove', e => showTip(`${d.n}: ${d.a.toFixed(1)}% → ${d.b.toFixed(1)}% (${(d.b-d.a>0?'+':'')}${(d.b-d.a).toFixed(1)} pp)`, e));
  hit.addEventListener('mouseleave', () => {
    rows.forEach(o => { o.line.setAttribute('opacity','0.9'); o.g.querySelectorAll('circle').forEach(c=>c.setAttribute('opacity','1')); });
    line.setAttribute('stroke-width','1.5');
    hideTip();
  });
});

// Legend
const legendData = [['gain >5pp','#3D7A5A'],['gain 0–5pp','#8BAD72'],['loss 0–10pp','#C49A45'],['loss 10–25pp','#C4715A'],['loss >25pp','#B34B3B']];
const lx = xL + (xR-xL)/2 - 145;
legendData.forEach(([label, color], i) => {
  svg.appendChild(mkEl('rect', { x: lx+i*60, y: H-pad.bottom-14, width: 10, height: 10, fill: color, rx: '1' }));
  const t = mkEl('text', { x: lx+i*60+13, y: H-pad.bottom-5, 'font-size': '8', fill: '#7A786F' });
  t.textContent = label;
  svg.appendChild(t);
});
</script>
</body></html>
