<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif; margin: 0; padding: 24px; background: #fff; color: #0f172a; }
    h1 { font-size: 18px; font-weight: 700; margin: 0 0 4px; }
    .subtitle { font-size: 13px; color: #64748b; margin: 0 0 16px; }
    #chart { width: 100%; }
    .source { font-size: 11px; color: #94a3b8; margin-top: 8px; }
    #tip {
      position: fixed; pointer-events: none; opacity: 0;
      background: #0f172a; color: #fff; font-size: 12px;
      padding: 6px 10px; border-radius: 4px;
      transition: opacity 0.1s; white-space: nowrap; z-index: 10;
    }
  </style>
</head>
<body>
  <h1>The Global Scale-Up of HIV Treatment</h1>
  <p class="subtitle">Antiretroviral therapy coverage (% of people living with HIV), 2000–2024 — selected countries</p>
  <div id="chart"></div>
  <p class="source">Source: World Bank / WHO — Antiretroviral Therapy Coverage (SH.HIV.ARTC.ZS)</p>
  <div id="tip"></div>
  <script>
    // Data exported from catalog: wb--SH-HIV-ARTC-ZS
    const data = [{"n":"Botswana","s":[0,1,2,6,12,19,25,29,36,44,49,54,61,65,67,72,76,79,84,86,89,92,93,94,95],"y0":2000},{"n":"Eswatini","s":[0,1,1,2,3,6,10,13,17,22,31,34,38,43,52,67,77,78,78,84,90,88,89,91,94],"y0":2000},{"n":"Burundi","s":[0,0,1,1,4,6,8,11,15,18,23,28,31,36,41,49,61,69,75,83,86,88,90,91,93],"y0":2000},{"n":"Cambodia","s":[0,0,0,3,8,12,22,30,37,44,50,54,57,60,63,66,69,72,76,79,81,81,84,88,92],"y0":2000},{"n":"Kenya","s":[0,0,0,0,2,4,9,13,18,24,31,38,43,47,54,65,74,81,80,78,78,84,85,86,87],"y0":2000},{"n":"Ethiopia","s":[0,0,0,0,1,3,7,13,20,27,33,40,44,48,56,60,66,69,71,75,78,78,82,85,88],"y0":2000},{"n":"Cameroon","s":[0,0,0,0,3,4,5,8,10,13,15,18,21,23,25,30,37,46,53,59,66,73,80,85,88],"y0":2000},{"n":"Haiti","s":[0,0,0,1,1,2,5,7,10,13,13,16,20,25,29,32,30,49,49,63,77,78,81,82,87],"y0":2000},{"n":"Ecuador","s":[1,1,1,1,3,4,6,9,12,16,20,24,25,28,31,38,43,50,56,67,71,71,77,80,82],"y0":2000},{"n":"Cote d'Ivoire","s":[0,0,0,0,1,3,5,6,10,14,15,19,22,25,30,34,42,52,57,62,66,69,70,74,78],"y0":2000}];

    const COLORS = ["#EA5E33","#F29A44","#3D7A5A","#5B9E78","#2B6CB0","#4A9ED1","#7B55AA","#B34B8A","#6B8E23","#C49A45"];

    const W = 760, H = 420;
    const margin = {top: 30, right: 140, bottom: 36, left: 46};
    const innerW = W - margin.left - margin.right;
    const innerH = H - margin.top - margin.bottom;

    const yearMin = 2000, yearMax = 2024;
    const valMin = 0, valMax = 100;

    const xScale = yr => margin.left + (yr - yearMin) / (yearMax - yearMin) * innerW;
    const yScale = v => margin.top + (valMax - v) / (valMax - valMin) * innerH;

    function mkEl(tag, attrs) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
      return el;
    }

    function resolveCollisions(items, minGap) {
      const sorted = items.slice().sort((a, b) => a.y - b.y);
      for (let pass = 0; pass < 30; pass++) {
        let moved = false;
        for (let i = 1; i < sorted.length; i++) {
          const gap = sorted[i].y - sorted[i - 1].y;
          if (gap < minGap) {
            const shift = (minGap - gap) / 2;
            sorted[i - 1].y -= shift;
            sorted[i].y += shift;
            moved = true;
          }
        }
        if (!moved) break;
      }
      return sorted;
    }

    const svg = mkEl("svg", {viewBox: `0 0 ${W} ${H}`, width: "100%", style: "max-width:760px;display:block;"});

    // Gridlines
    [0, 25, 50, 75, 100].forEach(v => {
      svg.appendChild(mkEl("line", {
        x1: margin.left, y1: yScale(v), x2: W - margin.right, y2: yScale(v),
        stroke: "#E8E5DC", "stroke-width": "0.8"
      }));
      const lbl = mkEl("text", {x: margin.left - 6, y: yScale(v) + 4, "text-anchor": "end", "font-size": "10", fill: "#94a3b8", "font-family": "monospace"});
      lbl.textContent = v + "%";
      svg.appendChild(lbl);
    });

    // X axis ticks
    [2000, 2005, 2010, 2015, 2020, 2024].forEach(yr => {
      const x = xScale(yr);
      svg.appendChild(mkEl("line", {x1: x, y1: margin.top, x2: x, y2: H - margin.bottom + 4, stroke: "#E8E5DC", "stroke-width": "0.8"}));
      const lbl = mkEl("text", {x, y: H - margin.bottom + 14, "text-anchor": "middle", "font-size": "10", fill: "#94a3b8", "font-family": "monospace"});
      lbl.textContent = yr;
      svg.appendChild(lbl);
    });

    const tip = document.getElementById("tip");
    const groups = [];

    // Build labels for collision resolution
    const labelItems = data.map((row, i) => {
      const pts = row.s.map((v, j) => v !== null ? {year: row.y0 + j, value: v} : null).filter(Boolean);
      const last = pts[pts.length - 1];
      return {y: yScale(last.value), name: row.n, color: COLORS[i], lastVal: last.value};
    });
    const resolved = resolveCollisions(labelItems, 13);

    data.forEach((row, i) => {
      const color = COLORS[i];
      const pts = row.s.map((v, j) => v !== null ? {year: row.y0 + j, value: v} : null).filter(Boolean);
      if (pts.length < 2) return;

      const g = mkEl("g", {});

      // Visible line
      const pathD = pts.map((p, pi) => `${pi === 0 ? "M" : "L"}${xScale(p.year).toFixed(1)},${yScale(p.value).toFixed(1)}`).join(" ");
      const line = mkEl("path", {d: pathD, stroke: color, "stroke-width": "1.8", fill: "none", "stroke-linejoin": "round", "stroke-linecap": "round"});
      g.appendChild(line);

      // Invisible hit area
      const hit = mkEl("path", {d: pathD, stroke: "transparent", "stroke-width": "14", fill: "none", style: "cursor:pointer"});
      g.appendChild(hit);

      // Endpoint dot
      const last = pts[pts.length - 1];
      g.appendChild(mkEl("circle", {cx: xScale(last.year), cy: yScale(last.value), r: "3", fill: color}));

      // Label (resolved position)
      const labelEntry = resolved.find(r => r.name === row.n);
      const labelY = labelEntry ? labelEntry.y : yScale(last.value);
      const labelX = xScale(last.year) + 8;

      // Leader line if label moved
      if (Math.abs(labelY - yScale(last.value)) > 4) {
        g.appendChild(mkEl("line", {x1: xScale(last.year) + 4, y1: yScale(last.value), x2: labelX, y2: labelY, stroke: color, "stroke-width": "0.6", opacity: "0.5"}));
      }

      const lbl = mkEl("text", {x: labelX, y: labelY + 4, "font-size": "9.5", fill: color, "font-family": "monospace", "font-weight": "600"});
      lbl.textContent = `${last.value}%  ${row.n}`;
      g.appendChild(lbl);

      svg.appendChild(g);
      groups.push({g, line, hit, row, pts, color, labelY, lbl});
    });

    // Hover
    groups.forEach(({g, line, hit, row, pts, color, lbl}, idx) => {
      hit.addEventListener("mousemove", e => {
        groups.forEach(({line: l, lbl: lb}, j) => {
          l.setAttribute("stroke-width", j === idx ? "3" : "1.8");
          l.setAttribute("opacity", j === idx ? "1" : "0.1");
          lb.setAttribute("opacity", j === idx ? "1" : "0.15");
        });
        const rect = svg.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const ratio = Math.max(0, Math.min(1, (mx - margin.left) / innerW));
        const yr = Math.round(yearMin + ratio * (yearMax - yearMin));
        const ptAtYr = pts.find(p => p.year === yr);
        const val = ptAtYr ? ptAtYr.value.toFixed(0) + "%" : "—";
        tip.textContent = `${row.n} (${yr}): ${val} ART coverage`;
        tip.style.opacity = "1";
        tip.style.left = (e.clientX + 14) + "px";
        tip.style.top = (e.clientY - 20) + "px";
      });
      hit.addEventListener("mouseleave", () => {
        groups.forEach(({line: l, lbl: lb}) => {
          l.setAttribute("stroke-width", "1.8");
          l.setAttribute("opacity", "1");
          lb.setAttribute("opacity", "1");
        });
        tip.style.opacity = "0";
      });
    });

    document.getElementById("chart").appendChild(svg);
  </script>
</body>
</html>
