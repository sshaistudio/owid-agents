<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');
  body { font-family: 'Inter', sans-serif; margin: 0; padding: 32px 40px; background: #F6F5EE; color: #2B2A27; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; margin: 0 0 4px; color: #2B2A27; }
  .subtitle { font-size: 11px; color: #7A786F; margin: 0 0 24px; max-width: 520px; line-height: 1.5; }
  .source { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #7A786F; margin-top: 20px; letter-spacing: 0.3px; text-transform: uppercase; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; max-width: 760px; border-top: 1px solid #E2E0D5; border-left: 1px solid #E2E0D5; }
  .cell { padding: 11px 12px 8px; border-bottom: 1px solid #E2E0D5; border-right: 1px solid #E2E0D5; position: relative; cursor: crosshair; transition: background 0.12s; }
  .cell:hover { background: rgba(234,94,51,0.04); }
  .cell-name { font-size: 10px; font-weight: 500; color: #2B2A27; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cell-wrap { position: relative; }
  canvas { display: block; width: 100%; height: 32px; }
  .cell-marker { position: absolute; top: 0; width: 1px; height: 32px; background: #2B2A27; opacity: 0; pointer-events: none; }
  .cell-tip { position: absolute; top: -18px; left: 0; background: #2B2A27; color: #F6F5EE; font-family: 'JetBrains Mono', monospace; font-size: 9px; padding: 2px 6px; border-radius: 2px; white-space: nowrap; opacity: 0; pointer-events: none; transform: translateX(-50%); }
  .cell-meta { font-family: 'JetBrains Mono', monospace; font-size: 8.5px; color: #9A9890; display: flex; justify-content: space-between; margin-top: 3px; }
  .cell-val { color: #EA5E33; font-weight: 500; }
</style></head><body>

<p class="source">Source: World Bank SL.TLF.PART.ZS</p>

  {"n":"Iceland","e":31.8,"l":50.3,"s":[31.8,32.0,33.5,38.6,35.9,37.0,38.2,38.4,35.2,38.9,39.8,39.4,39.3,40.4,37.2,37.5,37.5,37.3,37.3,37.1,39.7,48.0,50.3],"y0":2000},

  {"n":"Germany","e":26.2,"l":43.1,"s":[26.2,26.5,26.8,28.2,29.2,34.5,35.5,35.5,36.3,39.0,38.8,39.2,40.1,40.7,40.5,40.5,39.7,40.8,40.8,41.2,43.3,43.0,43.1],"y0":2000},

  {"n":"Ireland","e":31.4,"l":38.8,"s":[31.4,30.8,32.0,33.5,35.7,35.6,36.5,35.7,36.9,40.6,41.0,41.5,42.1,41.9,40.9,41.3,39.6,37.8,35.2,35.0,39.9,29.0,38.8],"y0":2000},
  {"n":"France","e":29.2,"l":38.4,"s":[29.2,28.2,28.2,36.0,36.8,25.5,26.0,25.7,25.7,26.8,25.3,25.0,25.5,27.1,27.4,26.9,39.0,39.4,39.1,39.6,43.8,40.2,38.4],"y0":2000},
  {"n":"Bolivia","e":26.7,"l":37.8,"s":[26.7,37.4,32.7,33.1,31.3,29.3,27.9,29.1,30.8,31.4,27.8,29.3,29.7,29.9,35.0,37.7,38.7,38.9,35.4,36.7,37.8],"y0":2000},
  {"n":"Italy","e":20.4,"l":34.2,"s":[20.4,21.1,44.8,21.3,25.4,28.6,30.2,29.8,31.2,32.8,31.2,31.0,34.1,34.9,35.5,35.5,34.4,34.8,33.6,33.4,40.4,35.7,34.2],"y0":2000},
  {"n":"Cyprus","e":26.6,"l":33.5,"s":[26.6,28.9,30.0,32.3,28.4,28.7,26.4,27.0,27.8,31.8,29.0,28.9,27.4,32.7,34.8,33.8,31.1,29.7,28.8,31.0,36.3,34.9,33.5],"y0":2000},
  {"n":"Estonia","e":25.3,"l":33.4,"s":[25.3,22.2,18.0,20.9,16.2,14.6,14.7,14.6,15.2,27.9,25.3,21.8,24.9,26.8,27.1,27.9,25.6,26.1,29.2,29.7,32.6,32.3,33.4],"y0":2000},
  {"n":"Czechia","e":17.1,"l":30.0,"s":[17.1,17.6,19.0,20.6,19.9,18.7,19.0,19.3,19.3,22.8,21.9,23.5,24.5,26.7,26.2,28.7,25.7,28.2,28.2,28.4,33.9,28.7,30.0],"y0":2000},

  {"n":"Greece","e":19.0,"l":25.8,"s":[19.0,18.9,20.7,20.3,20.1,20.2,21.0,22.2,22.9,25.5,23.6,22.5,23.1,24.1,26.0,26.3,25.3,25.2,25.2,25.1,31.9,25.9,25.8],"y0":2000},
  {"n":"Hungary","e":19.9,"l":23.0,"s":[19.9,11.2,10.1,16.2,16.1,14.8,15.7,15.9,14.2,15.1,14.6,17.2,21.4,23.9,22.3,22.9,18.1,23.5,24.3,26.0,25.1,27.3,23.0],"y0":2000},
  {"n":"Dominican Republic","e":42.2,"l":28.3,"s":[42.2,43.9,45.7,45.8,46.5,38.8,38.7,37.0,36.9,36.5,37.1,37.4,36.4,35.6,34.1,30.9,28.7,28.8,28.7,30.0,40.0,31.3,28.3],"y0":2000},
  {"n":"Chile","e":13.2,"l":27.3,"s":[13.2,13.3,16.6,17.0,27.5,28.2,28.5,28.4,29.2,28.3,29.3,29.3,29.7,30.9,34.6,29.6,27.3],"y0":2000},
  {"n":"Bulgaria","e":6.6,"l":11.9,"s":[6.6,6.6,5.9,12.0,14.1,9.4,9.7,9.0,9.1,12.0,11.6,11.0,10.0,10.2,10.6,10.5,9.6,11.0,11.6,11.2,13.5,11.3,11.9],"y0":2000}
];

const grid = document.getElementById("grid");

data.forEach(d => {
  const cell = document.createElement("div");
  cell.className = "cell";

  const nameEl = document.createElement("div");
  nameEl.className = "cell-name";
  const displayN = d.n === "Korea, Rep." ? "South Korea" : d.n === "Dominican Republic" ? "Dominican Rep." : d.n;
  nameEl.textContent = displayN;
  cell.appendChild(nameEl);

  const wrap = document.createElement("div");
  wrap.className = "cell-wrap";

  const canvas = document.createElement("canvas");
  canvas.width = 200;
  canvas.height = 32;
  wrap.appendChild(canvas);

  const marker = document.createElement("div");
  marker.className = "cell-marker";
  wrap.appendChild(marker);

  const ctip = document.createElement("div");
  ctip.className = "cell-tip";
  wrap.appendChild(ctip);

  cell.appendChild(wrap);

  const meta = document.createElement("div");
  meta.className = "cell-meta";
  meta.innerHTML = `<span>${d.e.toFixed(1)}%</span><span class="cell-val">${d.l.toFixed(1)}%</span>`;
  cell.appendChild(meta);

  grid.appendChild(cell);

  const ctx = canvas.getContext("2d");
  const series = d.s;
  const cw = canvas.width, ch = canvas.height;
  const step = cw / (series.length - 1);
  const minV = Math.min(...series) * 0.9;
  const maxV = Math.max(...series) * 1.05;
  const norm = v => ch - 2 - ((v - minV) / (maxV - minV)) * (ch - 4);

  function draw(hiIdx) {
    ctx.clearRect(0, 0, cw, ch);
    // Fill area
    ctx.beginPath();
    ctx.moveTo(0, ch);
    series.forEach((v, i) => ctx.lineTo(i * step, norm(v)));
    ctx.lineTo((series.length - 1) * step, ch);
    ctx.closePath();
    ctx.fillStyle = "rgba(234,94,51,0.07)";
    ctx.fill();
    // Line
    ctx.beginPath();
    series.forEach((v, i) => {
      const x = i * step, y = norm(v);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.strokeStyle = "#EA5E33";
    ctx.lineWidth = 1.3;
    ctx.lineJoin = "round";
    ctx.stroke();
    // Endpoint dot
    const lx = (series.length - 1) * step, ly = norm(series[series.length - 1]);
    ctx.beginPath(); ctx.arc(lx, ly, 2, 0, Math.PI * 2);
    ctx.fillStyle = "#EA5E33"; ctx.fill();
    // Hover dot
    if (hiIdx >= 0 && hiIdx < series.length) {
      const hx = hiIdx * step, hy = norm(series[hiIdx]);
      ctx.beginPath(); ctx.arc(hx, hy, 3.5, 0, Math.PI * 2);
      ctx.fillStyle = "#EA5E33"; ctx.fill();
      ctx.beginPath(); ctx.arc(hx, hy, 1.5, 0, Math.PI * 2);
      ctx.fillStyle = "#F6F5EE"; ctx.fill();
    }
  }

  draw(-1);

  cell.addEventListener("mousemove", e => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const ratio = mx / rect.width;
    const idx = Math.max(0, Math.min(series.length - 1, Math.round(ratio * (series.length - 1))));
    const px = (idx / (series.length - 1)) * rect.width;
    marker.style.left = px + "px";
    marker.style.opacity = "1";
    const year = d.y0 + idx;
    ctip.textContent = `${year}: ${series[idx].toFixed(1)}%`;
    ctip.style.left = px + "px";
    ctip.style.opacity = "1";
    draw(idx);
  });

  cell.addEventListener("mouseleave", () => {
    marker.style.opacity = "0";
    ctip.style.opacity = "0";
    draw(-1);
  });
});
</script>
