<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 32px 40px;
      background: #1a1a2e;
      color: #e8e6e3;
    }
    h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.3px;
      margin: 0 0 4px;
      color: #e8e6e3;
    }
    .subtitle {
      font-size: 11px;
      color: #9a9890;
      margin: 0 0 24px;
      max-width: 560px;
      line-height: 1.5;
    }
    .source {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      color: #5a5a72;
      margin-top: 20px;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }
    svg text { font-family: 'Inter', sans-serif; }
    .tooltip {
      position: fixed;
      pointer-events: none;
      background: #0d0d1e;
      color: #e8e6e3;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      padding: 7px 11px;
      border-radius: 3px;
      border: 1px solid #2e2e4a;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.12s;
      z-index: 10;
    }
  </style>
</head>
<body>
  <h1>The Demographic Transition, 1960-2023</h1>
  <p class="subtitle">Age dependency ratio (% of working-age population). Countries in East Asia and Latin America cut their dependency burdens in half. Sub-Saharan Africa remains near 1960 levels.</p>
  <div id="chart" style="position:relative;"></div>
  <div class="tooltip" id="tip"></div>
  <p class="source">Source: World Bank SP.POP.DPND</p>
  <script>
// Data from World Bank catalog -- do not modify
const data = [
  {"n":"Colombia","a":98.6,"b":42.8},
  {"n":"Brazil","a":87.7,"b":44.0},
  {"n":"Iran","a":91.0,"b":44.4},
  {"n":"China","a":79.5,"b":44.7},
  {"n":"Chile","a":75.5,"b":45.1},
  {"n":"Indonesia","a":73.0,"b":47.0},
  {"n":"India","a":78.2,"b":47.0},
  {"n":"Bangladesh","a":81.9,"b":53.1},
  {"n":"Australia","a":63.2,"b":54.8},
  {"n":"Germany","a":48.7,"b":58.0},
  {"n":"Egypt","a":85.1,"b":59.8},
  {"n":"France","a":61.3,"b":62.7},
  {"n":"Kenya","a":108.0,"b":67.7},
  {"n":"Japan","a":55.2,"b":70.1},
  {"n":"Ethiopia","a":82.0,"b":74.0},
  {"n":"Burkina Faso","a":73.9,"b":81.9},
  {"n":"DR Congo","a":84.8,"b":96.7}
];

const W = 700, H = 580;
const pad = { left: 130, right: 140, top: 44, bottom: 24 };
const minV = 30, maxV = 115;
const scale = v => pad.top + (maxV - v) / (maxV - minV) * (H - pad.top - pad.bottom);

const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
svg.setAttribute("width", "100%");
svg.style.maxWidth = W + "px";
svg.style.cursor = "crosshair";
svg.style.display = "block";

// Background
const bg = document.createElementNS("http://www.w3.org/2000/svg", "rect");
bg.setAttribute("width", W); bg.setAttribute("height", H);
bg.setAttribute("fill", "#1a1a2e");
svg.appendChild(bg);

// Axis lines
const ax1 = document.createElementNS("http://www.w3.org/2000/svg", "line");
ax1.setAttribute("x1", pad.left); ax1.setAttribute("y1", pad.top - 10);
ax1.setAttribute("x2", pad.left); ax1.setAttribute("y2", H - pad.bottom);
ax1.setAttribute("stroke", "#2e2e4a"); ax1.setAttribute("stroke-width", "1");
svg.appendChild(ax1);

const ax2 = document.createElementNS("http://www.w3.org/2000/svg", "line");
ax2.setAttribute("x1", W - pad.right); ax2.setAttribute("y1", pad.top - 10);
ax2.setAttribute("x2", W - pad.right); ax2.setAttribute("y2", H - pad.bottom);
ax2.setAttribute("stroke", "#2e2e4a"); ax2.setAttribute("stroke-width", "1");
svg.appendChild(ax2);

// Grid lines
[40, 50, 60, 70, 80, 90, 100, 110].forEach(v => {
  const y = scale(v);
  const gl = document.createElementNS("http://www.w3.org/2000/svg", "line");
  gl.setAttribute("x1", pad.left); gl.setAttribute("y1", y);
  gl.setAttribute("x2", W - pad.right); gl.setAttribute("y2", y);
  gl.setAttribute("stroke", "#1e1e34"); gl.setAttribute("stroke-width", "0.5");
  svg.appendChild(gl);
  const gt = document.createElementNS("http://www.w3.org/2000/svg", "text");
  gt.setAttribute("x", pad.left - 8); gt.setAttribute("y", y + 3);
  gt.setAttribute("text-anchor", "end");
  gt.setAttribute("font-size", "9"); gt.setAttribute("fill", "#3a3a5a");
  gt.setAttribute("font-family", "'JetBrains Mono', monospace");
  gt.textContent = v;
  svg.appendChild(gt);
});

// Year headers
const mkHdr = (x, txt) => {
  const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
  t.setAttribute("x", x); t.setAttribute("y", 22);
  t.setAttribute("text-anchor", "middle");
  t.setAttribute("font-family", "'JetBrains Mono', monospace");
  t.setAttribute("font-size", "11");
  t.setAttribute("fill", "#5a5a72");
  t.setAttribute("letter-spacing", "1");
  t.textContent = txt;
  svg.appendChild(t);
};
mkHdr(pad.left, "1960");
mkHdr(W - pad.right, "2023");

// Color encoding by change direction and magnitude
const colorForRow = d => {
  const change = d.b - d.a;
  if (change < -40) return "#4ecdc4";   // large decrease -- accent
  if (change < -20) return "#7ee8e4";   // moderate decrease
  if (change < 0)   return "#a8f0ee";   // small decrease
  if (change < 15)  return "#f5a623";   // small increase
  return "#e85d5d";                      // large increase (aging trap)
};

function resolveCollisions(items, minGap) {
  const sorted = items.slice().sort((a, b) => a.y - b.y);
  for (let pass = 0; pass < 30; pass++) {
    let moved = false;
    for (let i = 1; i < sorted.length; i++) {
      const gap = sorted[i].y - sorted[i - 1].y;
      if (gap < minGap) {
        const shift = (minGap - gap) / 2;
        sorted[i - 1].y -= shift;
        sorted[i].y += shift;
        moved = true;
      }
    }
    if (!moved) break;
  }
  return sorted;
}

const leftLabels  = data.map(d => ({ n: d.n, y: scale(d.a), v: d.a, d }));
const rightLabels = data.map(d => ({ n: d.n, y: scale(d.b), v: d.b, d }));
resolveCollisions(leftLabels, 13);
resolveCollisions(rightLabels, 13);

const rows = [];
const x1 = pad.left + 3, x2 = W - pad.right - 3;

data.forEach((d, i) => {
  const y1 = scale(d.a), y2 = scale(d.b);
  const col = colorForRow(d);

  const g = document.createElementNS("http://www.w3.org/2000/svg", "g");

  // Main line
  const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
  line.setAttribute("x1", x1); line.setAttribute("y1", y1);
  line.setAttribute("x2", x2); line.setAttribute("y2", y2);
  line.setAttribute("stroke", col); line.setAttribute("stroke-width", "1.5");
  line.setAttribute("opacity", "0.75");
  g.appendChild(line);

  // Endpoint dots
  [{ x: x1, y: y1 }, { x: x2, y: y2 }].forEach(p => {
    const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    c.setAttribute("cx", p.x); c.setAttribute("cy", p.y); c.setAttribute("r", "2.5");
    c.setAttribute("fill", col);
    g.appendChild(c);
  });

  // Left label
  const ll = leftLabels.find(l => l.n === d.n);
  const lt = document.createElementNS("http://www.w3.org/2000/svg", "text");
  lt.setAttribute("x", x1 - 7); lt.setAttribute("y", ll.y + 3.5);
  lt.setAttribute("text-anchor", "end");
  lt.setAttribute("font-size", "10"); lt.setAttribute("fill", "#9a9890");
  lt.textContent = `${d.n}  ${d.a.toFixed(0)}`;
  g.appendChild(lt);

  // Right label
  const rl = rightLabels.find(l => l.n === d.n);
  const rt = document.createElementNS("http://www.w3.org/2000/svg", "text");
  rt.setAttribute("x", x2 + 7); rt.setAttribute("y", rl.y + 3.5);
  rt.setAttribute("text-anchor", "start");
  rt.setAttribute("font-size", "10"); rt.setAttribute("fill", "#9a9890");
  rt.textContent = `${d.b.toFixed(0)}  ${d.n}`;
  g.appendChild(rt);

  // Invisible wide hit area
  const hit = document.createElementNS("http://www.w3.org/2000/svg", "line");
  hit.setAttribute("x1", x1); hit.setAttribute("y1", y1);
  hit.setAttribute("x2", x2); hit.setAttribute("y2", y2);
  hit.setAttribute("stroke", "transparent"); hit.setAttribute("stroke-width", "14");
  hit.style.cursor = "pointer";
  g.appendChild(hit);

  svg.appendChild(g);
  rows.push({ g, line, d, col, y1, y2 });
});

// Legend
const legendItems = [
  { col: "#4ecdc4", label: "Decrease > 40pp" },
  { col: "#7ee8e4", label: "Decrease 20-40pp" },
  { col: "#a8f0ee", label: "Decrease < 20pp" },
  { col: "#f5a623", label: "Increase < 15pp" },
  { col: "#e85d5d", label: "Increase > 15pp" },
];
legendItems.forEach((l, i) => {
  const lx = pad.left + i * 110;
  const ly = H - 4;
  const r = document.createElementNS("http://www.w3.org/2000/svg", "rect");
  r.setAttribute("x", lx); r.setAttribute("y", ly - 6);
  r.setAttribute("width", 12); r.setAttribute("height", 3);
  r.setAttribute("fill", l.col); r.setAttribute("rx", 1);
  svg.appendChild(r);
  const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
  t.setAttribute("x", lx + 16); t.setAttribute("y", ly);
  t.setAttribute("font-size", "9"); t.setAttribute("fill", "#5a5a72");
  t.setAttribute("font-family", "'JetBrains Mono', monospace");
  t.textContent = l.label;
  svg.appendChild(t);
});

document.getElementById("chart").appendChild(svg);

// Interactivity
const tip = document.getElementById("tip");
let activeIdx = -1;

function highlight(idx) {
  if (idx === activeIdx) return;
  activeIdx = idx;
  rows.forEach((row, i) => {
    if (idx === -1) {
      row.g.style.opacity = "1";
      row.line.setAttribute("stroke-width", "1.5");
    } else if (i === idx) {
      row.g.style.opacity = "1";
      row.line.setAttribute("stroke-width", "3");
    } else {
      row.g.style.opacity = "0.1";
      row.line.setAttribute("stroke-width", "1");
    }
  });
}

svg.addEventListener("mousemove", e => {
  const rect = svg.getBoundingClientRect();
  const sx = (e.clientX - rect.left) / rect.width * W;
  const sy = (e.clientY - rect.top) / rect.height * H;

  let best = -1, bestDist = 20;
  rows.forEach((row, i) => {
    const t = Math.max(0, Math.min(1, (sx - x1) / (x2 - x1)));
    const lineY = row.y1 + (row.y2 - row.y1) * t;
    const dist = Math.abs(sy - lineY);
    if (dist < bestDist) { bestDist = dist; best = i; }
  });

  highlight(best);

  if (best >= 0) {
    const d = rows[best].d;
    const change = (d.b - d.a).toFixed(1);
    const sign = d.b > d.a ? "+" : "";
    tip.textContent = `${d.n}: ${d.a.toFixed(1)} (1960) → ${d.b.toFixed(1)} (2023)  ${sign}${change}pp`;
    tip.style.opacity = "1";
    tip.style.left = (e.clientX + 14) + "px";
    tip.style.top = (e.clientY - 22) + "px";
  } else {
    tip.style.opacity = "0";
  }
});

svg.addEventListener("mouseleave", () => {
  highlight(-1);
  tip.style.opacity = "0";
});
  </script>
</body>
</html>
