<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0; padding: 24px;
      background: #fff; color: #0f172a;
    }
    h1 { font-size: 18px; font-weight: 700; margin: 0 0 4px; }
    .subtitle { font-size: 13px; color: #64748b; margin: 0 0 20px; }
    #chart { width: 100%; max-width: 760px; }
    .source { font-size: 11px; color: #94a3b8; margin-top: 12px; }
    #tip {
      position: fixed; pointer-events: none; opacity: 0;
      background: #1e293b; color: #f8fafc;
      font-size: 12px; padding: 6px 10px; border-radius: 5px;
      white-space: nowrap; transition: opacity 0.1s;
    }
  </style>
</head>
<body>
  <h1>Old-Age Dependency Ratio, 1960–2023</h1>
  <p class="subtitle">People aged 65+ per 100 working-age adults (15–64). Japan is in a league of its own; South Korea is accelerating fast.</p>
  <div id="chart"></div>
  <p class="source">Source: World Bank (SP.POP.DPND.OL)</p>
  <div id="tip"></div>
  <script>
    const data = [{"n":"Japan","pts":[{"y":1960,"v":8.9},{"y":1963,"v":9.0},{"y":1966,"v":9.4},{"y":1969,"v":10.0},{"y":1972,"v":10.7},{"y":1975,"v":11.6},{"y":1978,"v":12.7},{"y":1981,"v":13.8},{"y":1984,"v":14.8},{"y":1987,"v":15.9},{"y":1990,"v":17.4},{"y":1993,"v":19.5},{"y":1996,"v":21.9},{"y":1999,"v":24.6},{"y":2002,"v":27.6},{"y":2005,"v":30.7},{"y":2008,"v":34.7},{"y":2011,"v":37.5},{"y":2014,"v":43.1},{"y":2017,"v":47.1},{"y":2020,"v":49.1},{"y":2023,"v":50.3}]},{"n":"South Korea","pts":[{"y":1972,"v":6.3},{"y":1975,"v":6.2},{"y":1978,"v":6.1},{"y":1981,"v":6.2},{"y":1984,"v":6.4},{"y":1987,"v":6.7},{"y":1990,"v":7.1},{"y":1993,"v":7.6},{"y":1996,"v":8.3},{"y":1999,"v":9.4},{"y":2002,"v":10.9},{"y":2005,"v":12.5},{"y":2008,"v":14.2},{"y":2011,"v":15.6},{"y":2014,"v":17.1},{"y":2017,"v":19.0},{"y":2020,"v":22.0},{"y":2023,"v":25.9}]},{"n":"Italy","pts":[{"y":1960,"v":14.5},{"y":1963,"v":15.1},{"y":1966,"v":15.8},{"y":1969,"v":16.8},{"y":1972,"v":18.0},{"y":1975,"v":19.1},{"y":1978,"v":20.1},{"y":1981,"v":20.3},{"y":1984,"v":19.3},{"y":1987,"v":20.4},{"y":1990,"v":21.8},{"y":1993,"v":23.2},{"y":1996,"v":24.9},{"y":1999,"v":26.4},{"y":2002,"v":28.1},{"y":2005,"v":29.6},{"y":2008,"v":30.7},{"y":2011,"v":31.7},{"y":2014,"v":33.7},{"y":2017,"v":35.2},{"y":2020,"v":36.6},{"y":2023,"v":38.1}]},{"n":"Germany","pts":[{"y":1960,"v":17.1},{"y":1963,"v":18.4},{"y":1966,"v":19.8},{"y":1969,"v":21.2},{"y":1972,"v":22.3},{"y":1975,"v":23.3},{"y":1978,"v":23.9},{"y":1981,"v":23.0},{"y":1984,"v":20.9},{"y":1987,"v":21.4},{"y":1990,"v":21.5},{"y":1993,"v":21.9},{"y":1996,"v":22.8},{"y":1999,"v":23.7},{"y":2002,"v":25.6},{"y":2005,"v":28.3},{"y":2008,"v":30.8},{"y":2011,"v":31.1},{"y":2014,"v":31.8},{"y":2017,"v":32.6},{"y":2020,"v":33.9},{"y":2023,"v":36.0}]},{"n":"Finland","pts":[{"y":1960,"v":11.7},{"y":1963,"v":12.0},{"y":1966,"v":12.6},{"y":1969,"v":13.4},{"y":1972,"v":14.5},{"y":1975,"v":15.7},{"y":1978,"v":17.1},{"y":1981,"v":17.8},{"y":1984,"v":18.2},{"y":1987,"v":19.0},{"y":1990,"v":19.9},{"y":1993,"v":20.6},{"y":1996,"v":21.6},{"y":1999,"v":22.1},{"y":2002,"v":22.8},{"y":2005,"v":23.9},{"y":2008,"v":25.0},{"y":2011,"v":27.1},{"y":2014,"v":30.8},{"y":2017,"v":33.7},{"y":2020,"v":36.4},{"y":2023,"v":38.3}]},{"n":"China","pts":[{"y":1960,"v":7.1},{"y":1963,"v":6.7},{"y":1966,"v":6.6},{"y":1969,"v":6.7},{"y":1972,"v":6.8},{"y":1975,"v":7.1},{"y":1978,"v":7.3},{"y":1981,"v":7.4},{"y":1984,"v":7.5},{"y":1987,"v":7.7},{"y":1990,"v":8.1},{"y":1993,"v":8.7},{"y":1996,"v":9.3},{"y":1999,"v":10.0},{"y":2002,"v":10.6},{"y":2005,"v":11.0},{"y":2008,"v":11.5},{"y":2011,"v":12.2},{"y":2014,"v":13.4},{"y":2017,"v":15.5},{"y":2020,"v":18.2},{"y":2023,"v":20.7}]},{"n":"Brazil","pts":[{"y":1960,"v":4.7},{"y":1963,"v":5.0},{"y":1966,"v":5.2},{"y":1969,"v":5.4},{"y":1972,"v":5.6},{"y":1975,"v":5.8},{"y":1978,"v":5.9},{"y":1981,"v":6.1},{"y":1984,"v":6.3},{"y":1987,"v":6.5},{"y":1990,"v":6.8},{"y":1993,"v":7.2},{"y":1996,"v":7.5},{"y":1999,"v":7.8},{"y":2002,"v":8.2},{"y":2005,"v":8.6},{"y":2008,"v":9.2},{"y":2011,"v":10.0},{"y":2014,"v":11.0},{"y":2017,"v":12.3},{"y":2020,"v":13.8},{"y":2023,"v":15.3}]},{"n":"India","pts":[{"y":1960,"v":5.9},{"y":1963,"v":6.3},{"y":1966,"v":6.5},{"y":1969,"v":6.6},{"y":1972,"v":6.8},{"y":1975,"v":6.9},{"y":1978,"v":7.0},{"y":1981,"v":7.0},{"y":1984,"v":7.0},{"y":1987,"v":7.0},{"y":1990,"v":7.0},{"y":1993,"v":7.1},{"y":1996,"v":7.2},{"y":1999,"v":7.3},{"y":2002,"v":7.4},{"y":2005,"v":7.6},{"y":2008,"v":7.7},{"y":2011,"v":7.8},{"y":2014,"v":8.1},{"y":2017,"v":8.8},{"y":2020,"v":9.5},{"y":2023,"v":10.2}]}];

    const W = 760, H = 460;
    const margin = { top: 40, right: 130, bottom: 40, left: 50 };

    const allPts = data.flatMap(d => d.pts);
    const yearMin = Math.min(...allPts.map(p => p.y));
    const yearMax = Math.max(...allPts.map(p => p.y));
    const valMin = 0, valMax = 55;

    const xScale = y => margin.left + (y - yearMin) / (yearMax - yearMin) * (W - margin.left - margin.right);
    const yScale = v => margin.top + (valMax - v) / (valMax - valMin) * (H - margin.top - margin.bottom);

    const PALETTE = [
      "#1d4ed8","#dc2626","#ea580c","#16a34a","#7c3aed","#0891b2","#ca8a04","#64748b"
    ];

    function mkEl(tag, attrs) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
      return el;
    }

    function resolveCollisions(items, minGap) {
      const sorted = items.slice().sort((a, b) => a.y - b.y);
      for (let pass = 0; pass < 30; pass++) {
        let moved = false;
        for (let i = 1; i < sorted.length; i++) {
          const gap = sorted[i].y - sorted[i - 1].y;
          if (gap < minGap) {
            const shift = (minGap - gap) / 2;
            sorted[i - 1].y -= shift;
            sorted[i].y += shift;
            moved = true;
          }
        }
        if (!moved) break;
      }
      return sorted;
    }

    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    svg.setAttribute("width", "100%");

    // Grid lines
    [0, 10, 20, 30, 40, 50].forEach(v => {
      const y = yScale(v);
      svg.appendChild(mkEl("line", {x1: margin.left, y1: y, x2: W - margin.right, y2: y, stroke: "#f1f5f9", "stroke-width": "1"}));
      const lbl = mkEl("text", {x: margin.left - 6, y: y + 4, "text-anchor": "end", style: "font-family:'JetBrains Mono',monospace;font-size:9px;fill:#94a3b8"});
      lbl.textContent = v;
      svg.appendChild(lbl);
    });

    // X axis labels
    [1960, 1970, 1980, 1990, 2000, 2010, 2020].forEach(yr => {
      const x = xScale(yr);
      const lbl = mkEl("text", {x, y: H - margin.bottom + 14, "text-anchor": "middle", style: "font-family:'JetBrains Mono',monospace;font-size:9px;fill:#94a3b8"});
      lbl.textContent = yr;
      svg.appendChild(lbl);
    });

    const tip = document.getElementById("tip");
    const allGroups = [];

    // Prepare endpoint labels for collision resolution
    const endLabels = data.map((d, i) => {
      const last = d.pts[d.pts.length - 1];
      return { d, i, y: yScale(last.v) };
    });
    const resolved = resolveCollisions(endLabels, 12);
    const labelMap = Object.fromEntries(resolved.map(item => [item.d.n, item.y]));

    data.forEach((d, i) => {
      const col = PALETTE[i % PALETTE.length];
      const g = mkEl("g", {});

      // Line path
      const pathD = d.pts.map((p, j) => `${j === 0 ? "M" : "L"} ${xScale(p.y)} ${yScale(p.v)}`).join(" ");
      const line = mkEl("path", {d: pathD, stroke: col, "stroke-width": "1.8", fill: "none", "stroke-linejoin": "round"});
      g.appendChild(line);

      // Endpoint label
      const last = d.pts[d.pts.length - 1];
      const actualY = yScale(last.v);
      const labelY = labelMap[d.n];

      if (Math.abs(labelY - actualY) > 2) {
        g.appendChild(mkEl("line", {x1: W - margin.right + 3, y1: actualY, x2: W - margin.right + 8, y2: labelY, stroke: col, "stroke-width": "0.5", opacity: "0.5"}));
      }

      const lbl = mkEl("text", {
        x: W - margin.right + 10, y: labelY + 4, "text-anchor": "start",
        style: `font-family:"JetBrains Mono",monospace;font-size:9px;fill:${col};font-weight:500`
      });
      lbl.textContent = `${last.v}  ${d.n}`;
      g.appendChild(lbl);

      // Invisible hit path
      const hit = mkEl("path", {d: pathD, stroke: "transparent", "stroke-width": "12", fill: "none", cursor: "pointer"});
      g.appendChild(hit);

      hit.addEventListener("mouseenter", e => {
        allGroups.forEach(og => og.style.opacity = og === g ? "1" : "0.08");
        line.setAttribute("stroke-width", "3");
        const last = d.pts[d.pts.length - 1];
        tip.textContent = `${d.n}: ${last.v} (2023)`;
        tip.style.opacity = "1";
        tip.style.left = (e.clientX + 12) + "px";
        tip.style.top = (e.clientY - 20) + "px";
      });
      hit.addEventListener("mousemove", e => {
        const rect = svg.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const ratio = Math.max(0, Math.min(1, (mx - margin.left) / (W - margin.left - margin.right)));
        const yr = Math.round(yearMin + ratio * (yearMax - yearMin));
        const closest = d.pts.reduce((best, p) => Math.abs(p.y - yr) < Math.abs(best.y - yr) ? p : best, d.pts[0]);
        tip.textContent = `${d.n} (${closest.y}): ${closest.v}`;
        tip.style.left = (e.clientX + 12) + "px";
        tip.style.top = (e.clientY - 20) + "px";
      });
      hit.addEventListener("mouseleave", () => {
        allGroups.forEach(og => og.style.opacity = "1");
        line.setAttribute("stroke-width", "1.8");
        tip.style.opacity = "0";
      });

      svg.appendChild(g);
      allGroups.push(g);
    });

    document.getElementById("chart").appendChild(svg);
  </script>
</body>
</html>
