<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif; margin: 0; padding: 24px; background: #fff; color: #0f172a; }
  h1 { font-size: 18px; font-weight: 700; margin: 0 0 4px; }
  .subtitle { font-size: 13px; color: #64748b; margin: 0 0 20px; }
  #chart { width: 100%; }
  .source { font-size: 11px; color: #94a3b8; margin-top: 12px; }
  #tip {
    position: fixed; pointer-events: none; opacity: 0;
    background: #1e293b; color: #f1f5f9; font-size: 12px;
    padding: 6px 10px; border-radius: 4px; white-space: nowrap;
    transition: opacity 0.1s; z-index: 100;
  }
</style>
</head>
<body>
<h1>The Global Spread of Hepatitis B Vaccination, 2000–2024</h1>
<p class="subtitle">HepB3 immunization coverage among 1-year-old children (%). 3-dose series confers ~95% protection against a leading cause of liver cancer.</p>
<div id="chart"></div>
<p class="source">Source: World Bank (SH.IMM.HEPB)</p>
<div id="tip"></div>
<script>
const data = [
  {"n":"France","s":[26,28,29,28,35,35,39,42,47,51,64,74,78,82,83,88,90,91,90,92,95,96,96,96,96],"y0":2000,"step":1},
  {"n":"Austria","s":[33,44,81,83,83,86,83,85,83,83,86,89,92,95,98,93,87,90,85,88,85,86,84,87,85],"y0":2000,"step":1},
  {"n":"Barbados","s":[null,18,66,91,93,92,84,93,85,93,86,91,87,91,94,97,97,90,95,90,85,82,86,85,94],"y0":2000,"step":1},
  {"n":"Cote d'Ivoire","s":[null,10,48,63,67,77,77,76,74,81,79,62,82,75,73,79,87,83,83,79,72,73,73,79,77],"y0":2000,"step":1},
  {"n":"China","s":[60,65,70,75,79,84,91,92,95,99,99,99,99,99,99,99,99,99,99,99,99,99,99,96,96],"y0":2000,"step":1},
  {"n":"India","s":[null,null,null,null,6,8,6,6,29,37,38,44,70,67,77,87,88,89,90,91,85,85,93,91,94],"y0":2000,"step":1},
  {"n":"Bangladesh","s":[null,null,null,null,5,null,null,null,null,null,null,null,null,null,null,96,96,97,97,97,97,97,97,97,97],"y0":2000,"step":1},
  {"n":"Kenya","s":[84,84,84,78,84,80,83,80,76,76,77,79,81,82,82,84,83,86,80,82,88,88,88,91,91],"y0":2000,"step":1},
  {"n":"Ethiopia","s":[47,53,56,52,70,73,74,71,69,70,74,69,67,65,67,68,69,72,71,69,67,67,71,73,73],"y0":2000,"step":1},
  {"n":"Ghana","s":[80,80,80,80,80,80,80,80,80,80,80,82,91,94,97,97,97,96,96,97,97,97,97,95,95],"y0":2000,"step":1},
  {"n":"Iran","s":[99,99,99,99,99,99,99,99,99,99,99,99,99,99,99,99,99,99,99,99,99,98,98,98,98],"y0":2000,"step":1},
  {"n":"Kazakhstan","s":[99,99,99,99,99,99,99,99,99,99,99,99,99,99,99,97,97,96,97,98,97,98,98,98,98],"y0":2000,"step":1},
  {"n":"Cuba","s":[98,98,98,98,98,98,98,98,98,98,98,98,98,98,98,98,98,98,99,99,99,98,99,99,99],"y0":2000,"step":1},
  {"n":"Fiji","s":[98,98,98,98,98,98,99,98,98,99,99,98,99,98,99,99,99,99,99,99,99,99,99,97,93],"y0":2000,"step":1}
];

function colorForStart(v2000) {
  if (v2000 === null || v2000 === undefined) return "#52b788";
  if (v2000 >= 95) return "#94a3b8";
  if (v2000 >= 70) return "#74c69d";
  if (v2000 >= 40) return "#f29a44";
  return "#ea5e33";
}

const W = 820, H = 480;
const margin = { top: 36, right: 148, bottom: 36, left: 46 };

const allVals = data.flatMap(d => d.s.filter(v => v !== null));
const valMin = 0, valMax = 100;
const years = Array.from({ length: 25 }, (_, i) => 2000 + i);

function xScale(year) {
  return margin.left + (year - 2000) / 24 * (W - margin.left - margin.right);
}
function yScale(val) {
  return margin.top + (100 - val) / 100 * (H - margin.top - margin.bottom);
}

function mkEl(tag, attrs) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

function resolveCollisions(items, minGap) {
  const sorted = items.slice().sort((a, b) => a.y - b.y);
  for (let pass = 0; pass < 40; pass++) {
    let moved = false;
    for (let i = 1; i < sorted.length; i++) {
      const gap = sorted[i].y - sorted[i - 1].y;
      if (gap < minGap) {
        const shift = (minGap - gap) / 2;
        sorted[i - 1].y -= shift;
        sorted[i].y += shift;
        moved = true;
      }
    }
    if (!moved) break;
  }
  return sorted;
}

const svg = mkEl("svg", {
  viewBox: `0 0 ${W} ${H}`, width: "100%",
  style: `max-width:${W}px; display:block;`
});

// 90% target line
svg.appendChild(mkEl("line", {
  x1: margin.left, y1: yScale(90), x2: W - margin.right, y2: yScale(90),
  stroke: "#c2c0b5", "stroke-dasharray": "4,3", "stroke-width": "0.8"
}));
const tgtLbl = mkEl("text", { x: margin.left + 2, y: yScale(90) - 4,
  fill: "#c2c0b5", "font-size": "9" });
tgtLbl.textContent = "90% target";
svg.appendChild(tgtLbl);

// Y grid
for (let v = 0; v <= 100; v += 20) {
  const y = yScale(v);
  svg.appendChild(mkEl("line", { x1: margin.left, y1: y, x2: W - margin.right, y2: y,
    stroke: "#e2e8f0", "stroke-width": "0.5" }));
  const lbl = mkEl("text", { x: margin.left - 6, y: y + 4, "text-anchor": "end",
    fill: "#7a786f", "font-size": "10" });
  lbl.textContent = v + "%";
  svg.appendChild(lbl);
}

// X labels
for (let yr = 2000; yr <= 2024; yr += 4) {
  const lbl = mkEl("text", { x: xScale(yr), y: H - margin.bottom + 14, "text-anchor": "middle",
    fill: "#7a786f", "font-size": "10" });
  lbl.textContent = yr;
  svg.appendChild(lbl);
}

// Endpoint labels
const labelItems = data.map(s => {
  let lastV = 0;
  for (let i = s.s.length - 1; i >= 0; i--) { if (s.s[i] !== null) { lastV = s.s[i]; break; } }
  return { n: s.n, lastVal: lastV, y: yScale(lastV) };
});
const resolved = resolveCollisions(labelItems, 13);

const groups = [];
data.forEach(s => {
  const firstNonNull = s.s.find(v => v !== null);
  const color = colorForStart(firstNonNull);
  const pts = s.s.map((v, i) => v !== null ? { year: 2000 + i, v } : null).filter(Boolean);

  if (pts.length < 3) return;

  const segments = [];
  let segStart = 0;
  for (let i = 1; i <= pts.length; i++) {
    if (i === pts.length || pts[i].year - pts[i - 1].year > 2) {
      segments.push(pts.slice(segStart, i));
      segStart = i;
    }
  }

  const g = mkEl("g", {});

  segments.forEach(seg => {
    const pathD = seg.map((p, i) => `${i === 0 ? "M" : "L"} ${xScale(p.year).toFixed(1)} ${yScale(p.v).toFixed(1)}`).join(" ");
    g.appendChild(mkEl("path", { d: pathD, stroke: color, "stroke-width": "1.8", fill: "none",
      "stroke-linejoin": "round" }));
  });

  const fullD = pts.map((p, i) => `${i === 0 ? "M" : "L"} ${xScale(p.year).toFixed(1)} ${yScale(p.v).toFixed(1)}`).join(" ");
  const hitPath = mkEl("path", { d: fullD, stroke: "transparent", "stroke-width": "12", fill: "none",
    style: "cursor:pointer" });

  const rItem = resolved.find(r => r.n === s.n);
  const labelY = rItem ? rItem.y : yScale(pts[pts.length - 1].v);
  const anchorX = xScale(2024) + 6;
  const dataY = yScale(pts[pts.length - 1].v);

  if (Math.abs(labelY - dataY) > 2) {
    g.appendChild(mkEl("line", {
      x1: xScale(pts[pts.length - 1].year), y1: dataY, x2: anchorX + 1, y2: labelY,
      stroke: color, "stroke-width": "0.5", opacity: "0.5"
    }));
  }

  const lbl = mkEl("text", { x: anchorX, y: labelY + 4, "text-anchor": "start",
    fill: color, "font-size": "9", "font-family": "'JetBrains Mono', monospace" });
  lbl.textContent = `${pts[pts.length-1].v}%  ${s.n}`;

  g.appendChild(lbl);
  g.appendChild(hitPath);
  svg.appendChild(g);
  groups.push({ g, hitPath, s, color });
});

const tip = document.getElementById("tip");
const allLines = svg.querySelectorAll("path[stroke]:not([stroke=transparent])");

groups.forEach(({ hitPath, s, color }) => {
  hitPath.addEventListener("mousemove", e => {
    allLines.forEach(l => { if (l !== hitPath) l.style.opacity = "0.08"; });
    const rect = svg.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const ratio = Math.max(0, Math.min(1, (mx - margin.left) / (W - margin.left - margin.right)));
    const idx = Math.min(Math.round(ratio * 24), 24);
    const year = 2000 + idx;
    const val = s.s[idx];
    if (val !== null) {
      tip.textContent = `${s.n}: ${val}% (${year})`;
      tip.style.opacity = "1";
      tip.style.left = (e.clientX + 14) + "px";
      tip.style.top = (e.clientY - 24) + "px";
    }
  });
  hitPath.addEventListener("mouseleave", () => {
    allLines.forEach(l => { l.style.opacity = "1"; });
    tip.style.opacity = "0";
  });
});

document.getElementById("chart").appendChild(svg);
</script>
</body>
</html>
