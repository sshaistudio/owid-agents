<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');
  body { font-family: 'Inter', sans-serif; margin: 0; padding: 32px 40px; background: #F6F5EE; color: #2B2A27; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; margin: 0 0 4px; color: #2B2A27; }
  .subtitle { font-size: 11px; color: #7A786F; margin: 0 0 24px; max-width: 520px; line-height: 1.5; }
  .source { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #7A786F; margin-top: 20px; letter-spacing: 0.3px; text-transform: uppercase; }
  svg text { font-family: 'Inter', sans-serif; }
  .tooltip { position: fixed; pointer-events: none; background: #2B2A27; color: #F6F5EE; font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 6px 10px; border-radius: 2px; white-space: nowrap; opacity: 0; transition: opacity 0.15s; z-index: 10; }
</style></head><body>
<h1>Government Consumption Expenditure: 1995 vs. 2023</h1>
<p class="subtitle">General government final consumption as a share of GDP. Nordic countries maintain large public sectors while Bangladesh and Indonesia remain well below 10%.</p>
<div id="chart" style="position:relative;"></div>
<div class="tooltip" id="tip"></div>
<p class="source">Source: World Bank — General government final consumption expenditure (% of GDP)</p>
<script>
const slopeData = [{"y":1995,"n":"Denmark","a":24.1,"b":22.8},{"y":1995,"n":"Finland","a":21.9,"b":25.7},{"y":1995,"n":"France","a":23.5,"b":24.1},{"y":1995,"n":"Germany","a":19.6,"b":21.5},{"y":1995,"n":"Belgium","a":21.3,"b":23.4},{"y":1995,"n":"Austria","a":19.9,"b":20.6},{"y":1995,"n":"Canada","a":21.7,"b":20.7},{"y":1995,"n":"Australia","a":18.6,"b":21.2},{"y":1995,"n":"Japan","a":14.8,"b":20.1},{"y":1995,"n":"South Korea","a":9.7,"b":17.8},{"y":1995,"n":"China","a":13.5,"b":17.2},{"y":1995,"n":"India","a":10.5,"b":10.6},{"y":1995,"n":"Brazil","a":20.9,"b":19.0},{"y":1995,"n":"Indonesia","a":7.8,"b":7.5},{"y":1995,"n":"Kenya","a":14.8,"b":11.8},{"y":1995,"n":"Bangladesh","a":4.6,"b":5.7},{"y":1995,"n":"Czech Republic","a":20.3,"b":19.6},{"y":1995,"n":"Hungary","a":22.8,"b":20.5}];

// Sort by 2023 value descending
slopeData.sort((a, b) => b.b - a.b);

const W = 680, H = 600;
const pad = { left: 120, right: 130, top: 50, bottom: 20 };

const minV = 4, maxV = 27;
const scale = v => pad.top + (maxV - v) / (maxV - minV) * (H - pad.top - pad.bottom);

const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
svg.setAttribute("width", "100%");
svg.style.maxWidth = W + "px";
document.getElementById("chart").appendChild(svg);

function mkEl(tag, attrs) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

const xL = pad.left, xR = W - pad.right;

// Column headers
[["1995", xL], ["2023", xR]].forEach(([lbl, x]) => {
  const t = mkEl("text", { x, y: pad.top - 20, "text-anchor": "middle", "font-family": "JetBrains Mono", "font-size": "10", fill: "#7A786F" });
  t.textContent = lbl;
  svg.appendChild(t);
  svg.appendChild(mkEl("line", { x1: x, y1: pad.top - 12, x2: x, y2: H - pad.bottom, stroke: "#C2C0B5", "stroke-width": "0.5" }));
});

function resolveCollisions(items, minGap) {
  const sorted = items.slice().sort((a, b) => a.y - b.y);
  for (let pass = 0; pass < 30; pass++) {
    let moved = false;
    for (let i = 1; i < sorted.length; i++) {
      const gap = sorted[i].y - sorted[i-1].y;
      if (gap < minGap) {
        const shift = (minGap - gap) / 2;
        sorted[i-1].y -= shift;
        sorted[i].y += shift;
        moved = true;
      }
    }
    if (!moved) break;
  }
  return sorted;
}

function colorForChange(diff) {
  if (diff > 5) return "#EA5E33";
  if (diff > 2) return "#F29A44";
  if (diff > -2) return "#A6C4A2";
  if (diff > -5) return "#C49A45";
  return "#B34B3B";
}

const rows = [];
slopeData.forEach(d => {
  const ya = scale(d.a), yb = scale(d.b);
  const color = colorForChange(d.b - d.a);
  const g = mkEl("g", {});

  const line = mkEl("line", { x1: xL, y1: ya, x2: xR, y2: yb, stroke: color, "stroke-width": "1.5", opacity: "0.85" });
  const hit = mkEl("line", { x1: xL, y1: ya, x2: xR, y2: yb, stroke: "transparent", "stroke-width": "12" });
  const dotL = mkEl("circle", { cx: xL, cy: ya, r: "3", fill: color });
  const dotR = mkEl("circle", { cx: xR, cy: yb, r: "3", fill: color });

  g.appendChild(line); g.appendChild(hit); g.appendChild(dotL); g.appendChild(dotR);
  svg.appendChild(g);
  rows.push({ g, line, hit, d, ya, yb, color });
});

// Left labels
const leftItems = rows.map(r => ({ y: r.ya, ref: r }));
const leftResolved = resolveCollisions(leftItems, 13);
leftResolved.forEach(item => {
  const { d, ya, color } = item.ref;
  const lbl = mkEl("text", { x: xL - 6, y: item.y + 4, "text-anchor": "end", "font-size": "10", "font-weight": "500", fill: "#2B2A27" });
  lbl.textContent = `${d.n}  ${d.a}%`;
  svg.appendChild(lbl);
  if (Math.abs(item.y - ya) > 3) {
    svg.appendChild(mkEl("line", { x1: xL - 3, y1: ya, x2: xL - 3, y2: item.y, stroke: "#C2C0B5", "stroke-width": "0.5" }));
  }
});

// Right labels
const rightItems = rows.map(r => ({ y: r.yb, ref: r }));
const rightResolved = resolveCollisions(rightItems, 13);
rightResolved.forEach(item => {
  const { d, yb, color } = item.ref;
  const lbl = mkEl("text", { x: xR + 6, y: item.y + 4, "text-anchor": "start", "font-size": "10", "font-weight": "500", fill: "#2B2A27" });
  lbl.textContent = `${d.b}%  ${d.n}`;
  svg.appendChild(lbl);
  if (Math.abs(item.y - yb) > 3) {
    svg.appendChild(mkEl("line", { x1: xR + 3, y1: yb, x2: xR + 3, y2: item.y, stroke: "#C2C0B5", "stroke-width": "0.5" }));
  }
});

// Interactivity
const tip = document.getElementById("tip");
rows.forEach(({ g, line, hit, d }) => {
  const diff = d.b - d.a;
  const sign = diff >= 0 ? "+" : "";
  hit.addEventListener("mouseenter", () => {
    rows.forEach(r => r.line.setAttribute("opacity", "0.1"));
    line.setAttribute("opacity", "1");
    line.setAttribute("stroke-width", "3");
  });
  hit.addEventListener("mousemove", e => {
    tip.textContent = `${d.n}: ${d.a}% → ${d.b}% (${sign}${diff.toFixed(1)} pp)`;
    tip.style.opacity = "1";
    tip.style.left = (e.clientX + 12) + "px";
    tip.style.top = (e.clientY - 20) + "px";
  });
  hit.addEventListener("mouseleave", () => {
    rows.forEach(r => { r.line.setAttribute("opacity", "0.85"); r.line.setAttribute("stroke-width", "1.5"); });
    tip.style.opacity = "0";
  });
});

// Color legend
const legendItems = [
  { label: "Rising >+5pp", color: "#EA5E33" },
  { label: "+2 to +5pp", color: "#F29A44" },
  { label: "Stable", color: "#A6C4A2" },
  { label: "Falling >−2pp", color: "#C49A45" },
];
let lx = xL;
legendItems.forEach(({ label, color }) => {
  const rect = mkEl("rect", { x: lx, y: H - 14, width: 10, height: 10, fill: color, rx: "1" });
  svg.appendChild(rect);
  const t = mkEl("text", { x: lx + 13, y: H - 6, "font-size": "9", fill: "#7A786F", "font-family": "JetBrains Mono" });
  t.textContent = label;
  svg.appendChild(t);
  lx += 95;
});
</script>
</body></html>
