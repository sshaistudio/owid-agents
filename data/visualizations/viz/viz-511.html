<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');
  body { font-family: 'Inter', sans-serif; margin: 0; padding: 32px 40px; background: #F6F5EE; color: #2B2A27; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; margin: 0 0 4px; color: #2B2A27; }
  .subtitle { font-size: 11px; color: #7A786F; margin: 0 0 24px; max-width: 520px; line-height: 1.5; }
  .source { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #7A786F; margin-top: 20px; letter-spacing: 0.3px; text-transform: uppercase; }
  svg text { font-family: 'Inter', sans-serif; }
  .tooltip { position: fixed; pointer-events: none; background: #2B2A27; color: #F6F5EE; font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 6px 10px; border-radius: 2px; white-space: nowrap; opacity: 0; transition: opacity 0.15s; z-index: 10; }
</style></head><body>
<h1>Suicide Rates: Countries Rising and Falling, 2000–2019</h1>
<p class="subtitle">Suicide mortality rate per 100,000 population. The 25 countries with the largest absolute change over two decades. Green lines show improvement; orange-red lines show rising rates.</p>
<div id="chart" style="position:relative;"></div>
<div class="tooltip" id="tip"></div>
<p class="source">Source: World Bank SH.STA.SUIC.P5</p>
<script>
const data = [
  {"n":"Belarus","y":2000,"a":39.5,"b":17.5},
  {"n":"Hungary","y":2000,"a":33.3,"b":16.6},
  {"n":"Kazakhstan","y":2000,"a":33.4,"b":18.8},
  {"n":"Estonia","y":2000,"a":29.3,"b":15.6},
  {"n":"Korea, Rep.","y":2000,"a":15.1,"b":28.4},
  {"n":"Finland","y":2000,"a":24.1,"b":14.4},
  {"n":"Bulgaria","y":2000,"a":18.2,"b":9.0},
  {"n":"Japan","y":2000,"a":24.1,"b":16.5},
  {"n":"Croatia","y":2000,"a":20.5,"b":14.9},
  {"n":"France","y":2000,"a":20.3,"b":15.1},
  {"n":"Austria","y":2000,"a":19.8,"b":14.6},
  {"n":"Belgium","y":2000,"a":22.1,"b":18.1},
  {"n":"Czechia","y":2000,"a":16.3,"b":12.2},
  {"n":"Denmark","y":2000,"a":15.5,"b":11.4},
  {"n":"China","y":2000,"a":15.5,"b":8.8},
  {"n":"Cuba","y":2000,"a":17.3,"b":13.8},
  {"n":"Ireland","y":2000,"a":12.4,"b":8.1},
  {"n":"Eswatini","y":2000,"a":12.5,"b":28.1},
  {"n":"Bahrain","y":2000,"a":10.8,"b":5.4},
  {"n":"Congo, Rep.","y":2000,"a":12.0,"b":7.0},
  {"n":"Burundi","y":2000,"a":10.9,"b":6.9},
  {"n":"Botswana","y":2000,"a":12.1,"b":9.0},
  {"n":"Georgia","y":2000,"a":3.0,"b":7.3},
  {"n":"Ecuador","y":2000,"a":5.5,"b":8.5},
  {"n":"Guatemala","y":2000,"a":9.3,"b":5.9}
];

const W = 700, H = 620;
const pad = { left: 130, right: 140, top: 44, bottom: 24 };
const minV = 0, maxV = 42;
const scale = v => pad.top + (maxV - v) / (maxV - minV) * (H - pad.top - pad.bottom);

const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
svg.setAttribute("width", "100%");
svg.style.maxWidth = W + "px";
svg.style.cursor = "crosshair";

function mkEl(tag, attrs) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

// Column headers
function hdr(x, txt) {
  const t = mkEl("text", { x, y: 24, "text-anchor": "middle",
    "font-family": "'JetBrains Mono', monospace", "font-size": "10", fill: "#7A786F", "letter-spacing": "0.5" });
  t.textContent = txt;
  svg.appendChild(t);
}
hdr(pad.left, "2000");
hdr(W - pad.right, "2019");

// Axis tick lines
[10, 20, 30, 40].forEach(v => {
  svg.appendChild(mkEl("line", {
    x1: pad.left, y1: scale(v), x2: W - pad.right, y2: scale(v),
    stroke: "#E2E0D5", "stroke-width": "0.5", "stroke-dasharray": "3,3"
  }));
  const t = mkEl("text", { x: pad.left - 6, y: scale(v) + 3,
    "text-anchor": "end", "font-family": "'JetBrains Mono', monospace",
    "font-size": "8", fill: "#9A9890" });
  t.textContent = v;
  svg.appendChild(t);
});

const colorForChange = d => {
  const delta = d.b - d.a;
  if (delta < -15) return "#3D7A5A";
  if (delta < -8) return "#5B9E78";
  if (delta < -3) return "#8BAD72";
  if (delta < 3) return "#C49A45";
  if (delta < 8) return "#F29A44";
  return "#EA5E33";
};

const displayName = n => n === "Korea, Rep." ? "South Korea" : n;

function resolveCollisions(items, minGap) {
  const sorted = items.slice().sort((a, b) => a.y - b.y);
  for (let pass = 0; pass < 30; pass++) {
    let moved = false;
    for (let i = 1; i < sorted.length; i++) {
      const gap = sorted[i].y - sorted[i - 1].y;
      if (gap < minGap) {
        const shift = (minGap - gap) / 2;
        sorted[i - 1].y -= shift;
        sorted[i].y += shift;
        moved = true;
      }
    }
    if (!moved) break;
  }
  // Clamp to chart bounds
  sorted.forEach(item => {
    item.y = Math.max(pad.top + 6, Math.min(H - pad.bottom - 6, item.y));
  });
  return sorted;
}

const leftLabels = data.map(d => ({ n: d.n, y: scale(d.a), v: d.a, d }));
const rightLabels = data.map(d => ({ n: d.n, y: scale(d.b), v: d.b, d }));
resolveCollisions(leftLabels, 13);
resolveCollisions(rightLabels, 13);

const rows = [];

data.forEach((d, i) => {
  const x1 = pad.left + 4, x2 = W - pad.right - 4;
  const y1 = scale(d.a), y2 = scale(d.b);
  const col = colorForChange(d);
  const g = mkEl("g", {});

  const line = mkEl("line", {
    x1, y1, x2, y2,
    stroke: col, "stroke-width": "1.5", opacity: "0.75"
  });
  g.appendChild(line);

  // Dots
  [{ x: x1, y: y1 }, { x: x2, y: y2 }].forEach(p => {
    g.appendChild(mkEl("circle", { cx: p.x, cy: p.y, r: "2.5", fill: col }));
  });

  const ll = leftLabels.find(l => l.n === d.n);
  const lt = mkEl("text", { x: x1 - 8, y: ll.y + 3.5,
    "text-anchor": "end", "font-size": "9.5", fill: "#2B2A27" });
  lt.textContent = `${displayName(d.n)}  ${d.a.toFixed(1)}`;
  g.appendChild(lt);

  // Leader line if label is offset from data point
  if (Math.abs(ll.y - y1) > 4) {
    g.appendChild(mkEl("line", { x1: x1 - 5, y1, x2: x1 - 5, y2: ll.y,
      stroke: "#C2C0B5", "stroke-width": "0.5" }));
  }

  const rl = rightLabels.find(l => l.n === d.n);
  const rt = mkEl("text", { x: x2 + 8, y: rl.y + 3.5,
    "text-anchor": "start", "font-size": "9.5", fill: "#2B2A27" });
  rt.textContent = `${d.b.toFixed(1)}  ${displayName(d.n)}`;
  g.appendChild(rt);

  if (Math.abs(rl.y - y2) > 4) {
    g.appendChild(mkEl("line", { x1: x2 + 5, y1: y2, x2: x2 + 5, y2: rl.y,
      stroke: "#C2C0B5", "stroke-width": "0.5" }));
  }

  const hit = mkEl("line", { x1, y1, x2, y2, stroke: "transparent", "stroke-width": "14" });
  hit.style.cursor = "pointer";
  g.appendChild(hit);

  svg.appendChild(g);
  rows.push({ g, line, d, col, y1, y2 });
});

// Legend
const legend = [
  { col: "#3D7A5A", label: "Large decrease (>15)" },
  { col: "#5B9E78", label: "Decrease 8–15" },
  { col: "#8BAD72", label: "Decrease 3–8" },
  { col: "#F29A44", label: "Increase 3–8" },
  { col: "#EA5E33", label: "Large increase (>8)" },
];
legend.forEach((l, i) => {
  const lx = i * 138;
  const ly = H - 6;
  svg.appendChild(mkEl("rect", { x: lx, y: ly - 6, width: 12, height: 3, fill: l.col, rx: 1 }));
  const t = mkEl("text", { x: lx + 16, y: ly,
    "font-size": "8.5", fill: "#7A786F",
    "font-family": "'JetBrains Mono', monospace" });
  t.textContent = l.label;
  svg.appendChild(t);
});

document.getElementById("chart").appendChild(svg);

const tip = document.getElementById("tip");
let activeIdx = -1;

function highlight(idx) {
  if (idx === activeIdx) return;
  activeIdx = idx;
  rows.forEach((row, i) => {
    if (idx === -1) {
      row.g.style.opacity = "1";
      row.line.setAttribute("stroke-width", "1.5");
    } else if (i === idx) {
      row.g.style.opacity = "1";
      row.line.setAttribute("stroke-width", "3");
    } else {
      row.g.style.opacity = "0.12";
      row.line.setAttribute("stroke-width", "1");
    }
  });
}

svg.addEventListener("mousemove", e => {
  const rect = svg.getBoundingClientRect();
  const sx = (e.clientX - rect.left) / rect.width * W;
  const sy = (e.clientY - rect.top) / rect.height * H;

  let best = -1, bestDist = 22;
  rows.forEach((row, i) => {
    const t = Math.max(0, Math.min(1, (sx - pad.left) / (W - pad.left - pad.right)));
    const lineY = row.y1 + (row.y2 - row.y1) * t;
    if (Math.abs(sy - lineY) < bestDist) { bestDist = Math.abs(sy - lineY); best = i; }
  });

  highlight(best);
  if (best >= 0) {
    const d = rows[best].d;
    const delta = d.b - d.a;
    const sign = delta >= 0 ? "+" : "";
    tip.textContent = `${displayName(d.n)}: ${d.a.toFixed(1)} → ${d.b.toFixed(1)} (${sign}${delta.toFixed(1)}) per 100k`;
    tip.style.opacity = "1";
    tip.style.left = (e.clientX + 14) + "px";
    tip.style.top = (e.clientY - 22) + "px";
  } else {
    tip.style.opacity = "0";
  }
});

svg.addEventListener("mouseleave", () => { highlight(-1); tip.style.opacity = "0"; });
</script>
</body></html>
