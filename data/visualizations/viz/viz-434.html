<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; margin: 0; padding: 32px 40px; background: #F6F5EE; color: #2B2A27; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; margin: 0 0 4px; color: #2B2A27; }
  .subtitle { font-size: 11px; color: #7A786F; margin: 0 0 24px; max-width: 520px; line-height: 1.5; }
  .source { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #7A786F; margin-top: 16px; letter-spacing: 0.3px; text-transform: uppercase; }
  svg text { font-family: 'Inter', sans-serif; }
  .tooltip { position: fixed; pointer-events: none; background: #2B2A27; color: #F6F5EE; font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 6px 10px; border-radius: 2px; white-space: nowrap; opacity: 0; transition: opacity 0.15s; z-index: 10; }
</style></head>
<body>
<h1>Physicians per 1,000 People: ~2000 vs. ~2020</h1>
<p class="subtitle">Countries ranked by most recent physician density. All 16 countries increased over two decades, but the gap between Europe and Sub-Saharan Africa remains vast. Hover to see values.</p>
<div id="chart" style="position:relative;"></div>
<div class="tooltip" id="tip"></div>
<p class="source">Source: World Bank — SH.MED.PHYS.ZS</p>
<script>
const data = [{"n":"Cuba","va":5.94,"vb":9.29},{"n":"Greece","va":4.38,"vb":6.19},{"n":"Austria","va":3.88,"vb":5.34},{"n":"Argentina","va":3.25,"vb":5.3},{"n":"Georgia","va":3.87,"vb":5.12},{"n":"Germany","va":3.26,"vb":4.44},{"n":"Denmark","va":2.91,"vb":4.38},{"n":"Australia","va":2.48,"vb":3.9},{"n":"Korea","va":1.3,"vb":2.51},{"n":"China","va":1.26,"vb":2.38},{"n":"Brazil","va":1.38,"vb":2.35},{"n":"Bangladesh","va":0.24,"vb":0.66},{"n":"Indonesia","va":0.13,"vb":0.62},{"n":"Burkina Faso","va":0.04,"vb":0.1},{"n":"Ethiopia","va":0.02,"vb":0.1},{"n":"Chad","va":0.03,"vb":0.06}];

const W = 640, H = 560;
const pad = { left: 130, right: 140, top: 48, bottom: 20 };

const allVals = data.flatMap(d => [d.va, d.vb]);
const minV = 0, maxV = 10;
const xL = pad.left, xR = W - pad.right;

const scale = v => pad.top + (maxV - v) / (maxV - minV) * (H - pad.top - pad.bottom);

function colorFor(d) {
  const gain = d.vb - d.va;
  if (gain > 3) return '#EA5E33';
  if (gain > 2) return '#F29A44';
  if (gain > 1) return '#C49A45';
  if (gain > 0.5) return '#8BAD72';
  return '#A6C4A2';
}

function resolveCollisions(items, minGap) {
  const sorted = items.slice().sort((a, b) => a.y - b.y);
  for (let pass = 0; pass < 60; pass++) {
    let moved = false;
    for (let i = 1; i < sorted.length; i++) {
      const gap = sorted[i].y - sorted[i-1].y;
      if (gap < minGap) { const shift = (minGap-gap)/2; sorted[i-1].y -= shift; sorted[i].y += shift; moved = true; }
    }
    if (!moved) break;
  }
  return sorted;
}

function mkEl(tag, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
svg.setAttribute('width', '100%');
svg.style.maxWidth = W + 'px';
document.getElementById('chart').appendChild(svg);

// Column headers
['~2000', '~2020'].forEach((label, i) => {
  const x = i === 0 ? xL : xR;
  const hdr = mkEl('text', { x, y: pad.top - 16, 'text-anchor': 'middle', 'font-size': '10', 'font-family': 'JetBrains Mono', fill: '#7A786F' });
  hdr.textContent = label;
  svg.appendChild(hdr);
  svg.appendChild(mkEl('line', { x1: x, y1: pad.top-8, x2: x, y2: H-pad.bottom, stroke: '#E2E0D5', 'stroke-width': '1' }));
});

// Grid ticks on axes
[0,2,4,6,8,10].forEach(v => {
  svg.appendChild(mkEl('line', { x1: xL-3, y1: scale(v), x2: xL+3, y2: scale(v), stroke: '#C2C0B5', 'stroke-width': '0.8' }));
  svg.appendChild(mkEl('line', { x1: xR-3, y1: scale(v), x2: xR+3, y2: scale(v), stroke: '#C2C0B5', 'stroke-width': '0.8' }));
  const lbl = mkEl('text', { x: xL-8, y: scale(v)+3, 'text-anchor': 'end', 'font-size': '8', 'font-family': 'JetBrains Mono', fill: '#9A9890' });
  lbl.textContent = v;
  svg.appendChild(lbl);
});

const tip = document.getElementById('tip');
function showTip(text, e) { tip.textContent = text; tip.style.opacity = '1'; tip.style.left = (e.clientX+14)+'px'; tip.style.top = (e.clientY-28)+'px'; }
function hideTip() { tip.style.opacity = '0'; }

const rows = [];
data.forEach(d => {
  const color = colorFor(d);
  const g = mkEl('g', { cursor: 'crosshair' });

  const ya = scale(d.va), yb = scale(d.vb);
  const line = mkEl('line', { x1: xL, y1: ya, x2: xR, y2: yb, stroke: color, 'stroke-width': '1.5', opacity: '0.9' });
  g.appendChild(line);
  const hit = mkEl('line', { x1: xL, y1: ya, x2: xR, y2: yb, stroke: 'transparent', 'stroke-width': '14' });
  g.appendChild(hit);

  // Dots
  [{ x: xL, y: ya }, { x: xR, y: yb }].forEach(pt => {
    g.appendChild(mkEl('circle', { cx: pt.x, cy: pt.y, r: '3', fill: color }));
  });

  svg.appendChild(g);
  rows.push({ g, line, d, color, ya, yb });
});

// Left labels (before)
const leftItems = rows.map(r => ({ y: r.ya, row: r }));
resolveCollisions(leftItems, 13).forEach(item => {
  const lbl = mkEl('text', { x: xL-8, y: item.y+3.5, 'text-anchor': 'end', 'font-size': '9', fill: item.row.color });
  lbl.textContent = `${item.row.d.n}  ${item.row.d.va}`;
  svg.appendChild(lbl);
  if (Math.abs(item.y - item.row.ya) > 2) {
    svg.appendChild(mkEl('line', { x1: xL-4, y1: item.row.ya, x2: xL-4, y2: item.y, stroke: '#C2C0B5', 'stroke-width': '0.5' }));
  }
});

// Right labels (after)
const rightItems = rows.map(r => ({ y: r.yb, row: r }));
resolveCollisions(rightItems, 13).forEach(item => {
  const lbl = mkEl('text', { x: xR+8, y: item.y+3.5, 'text-anchor': 'start', 'font-size': '9', fill: item.row.color });
  lbl.textContent = `${item.row.d.vb}  ${item.row.d.n}`;
  svg.appendChild(lbl);
  if (Math.abs(item.y - item.row.yb) > 2) {
    svg.appendChild(mkEl('line', { x1: xR+4, y1: item.row.yb, x2: xR+4, y2: item.y, stroke: '#C2C0B5', 'stroke-width': '0.5' }));
  }
});

// Hover
rows.forEach(({ g, line, d, color }) => {
  const hit = g.querySelectorAll('line')[1];
  hit.addEventListener('mouseenter', () => {
    rows.forEach(o => { if (o.g!==g) { o.line.setAttribute('opacity','0.08'); o.g.querySelectorAll('circle').forEach(c=>c.setAttribute('opacity','0.08')); } });
    line.setAttribute('stroke-width','3');
  });
  hit.addEventListener('mousemove', e => showTip(`${d.n}: ${d.va} → ${d.vb} (+${(d.vb-d.va).toFixed(2)})`, e));
  hit.addEventListener('mouseleave', () => {
    rows.forEach(o => { o.line.setAttribute('opacity','0.9'); o.g.querySelectorAll('circle').forEach(c=>c.setAttribute('opacity','1')); });
    line.setAttribute('stroke-width','1.5');
    hideTip();
  });
});

// Legend
const legendData = [['> +3.0', '#EA5E33'],['> +2.0', '#F29A44'],['> +1.0', '#C49A45'],['> +0.5', '#8BAD72'],['≤ +0.5', '#A6C4A2']];
const lx = xL + (xR - xL) / 2 - 120;
legendData.forEach(([label, color], i) => {
  svg.appendChild(mkEl('rect', { x: lx + i*52, y: H - pad.bottom - 14, width: 10, height: 10, fill: color, rx: '1' }));
  const t = mkEl('text', { x: lx + i*52 + 13, y: H - pad.bottom - 5, 'font-size': '8', fill: '#7A786F' });
  t.textContent = label;
  svg.appendChild(t);
});
const legHdr = mkEl('text', { x: lx - 8, y: H - pad.bottom - 5, 'text-anchor': 'end', 'font-size': '8', fill: '#7A786F', 'font-style': 'italic' });
legHdr.textContent = 'gain';
svg.appendChild(legHdr);
</script>
</body></html>
