<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; padding: 24px; background: #fff; color: #0f172a; }
    h1 { font-size: 18px; font-weight: 700; margin: 0 0 4px; }
    .subtitle { font-size: 13px; color: #64748b; margin: 0 0 20px; }
    #chart { width: 100%; }
    .source { font-size: 11px; color: #94a3b8; margin-top: 12px; }
    #tip {
      position: fixed; pointer-events: none; opacity: 0;
      background: #0f172a; color: #fff; font-size: 12px;
      padding: 6px 10px; border-radius: 4px; white-space: nowrap;
      transition: opacity 0.1s; z-index: 100; font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body>
  <h1>Aquaculture Production</h1>
  <p class="subtitle">Farmed fish, shellfish, and seaweed (million metric tons) — China alone produces more than the rest of the world combined</p>
  <div id="chart"></div>
  <p class="source">Source: World Bank (ER.FSH.AQUA.MT), 1980–2024</p>
  <div id="tip"></div>
  <script>
    const data = [{"n":"China","pts":[{"y":1980,"v":3.105},{"y":1981,"v":3.034},{"y":1982,"v":3.258},{"y":1983,"v":3.657},{"y":1984,"v":4.271},{"y":1985,"v":5.026},{"y":1986,"v":5.606},{"y":1987,"v":6.326},{"y":1988,"v":7.376},{"y":1989,"v":8.101},{"y":1990,"v":8.393},{"y":1991,"v":9.695},{"y":1992,"v":12.185},{"y":1993,"v":15.222},{"y":1994,"v":18.214},{"y":1995,"v":21.152},{"y":1996,"v":23.466},{"y":1997,"v":23.747},{"y":1998,"v":25.672},{"y":1999,"v":28.001},{"y":2000,"v":29.75},{"y":2001,"v":31.103},{"y":2002,"v":33.16},{"y":2003,"v":34.892},{"y":2004,"v":37.172},{"y":2005,"v":38.943},{"y":2006,"v":40.911},{"y":2007,"v":42.53},{"y":2008,"v":44.073},{"y":2009,"v":46.063},{"y":2010,"v":47.79},{"y":2011,"v":49.148},{"y":2012,"v":52.083},{"y":2013,"v":55.029},{"y":2014,"v":57.321},{"y":2015,"v":59.369},{"y":2016,"v":62.318},{"y":2017,"v":64.358},{"y":2018,"v":66.135},{"y":2019,"v":68.424},{"y":2020,"v":70.484},{"y":2021,"v":72.805},{"y":2022,"v":75.435},{"y":2023,"v":78.277},{"y":2024,"v":81.95}]},{"n":"Indonesia","pts":[{"y":1980,"v":0.225},{"y":1985,"v":0.36},{"y":1990,"v":0.6},{"y":1995,"v":0.743},{"y":2000,"v":0.994},{"y":2005,"v":2.124},{"y":2006,"v":2.479},{"y":2007,"v":3.137},{"y":2008,"v":3.855},{"y":2009,"v":4.713},{"y":2010,"v":6.278},{"y":2011,"v":7.937},{"y":2012,"v":9.6},{"y":2013,"v":13.301},{"y":2014,"v":14.375},{"y":2015,"v":15.649},{"y":2016,"v":16.002},{"y":2017,"v":16.118},{"y":2018,"v":15.772},{"y":2019,"v":15.372},{"y":2020,"v":14.791},{"y":2021,"v":14.678},{"y":2022,"v":14.776},{"y":2023,"v":15.361},{"y":2024,"v":15.755}]},{"n":"India","pts":[{"y":1980,"v":0.365},{"y":1985,"v":0.633},{"y":1990,"v":1.017},{"y":1995,"v":1.659},{"y":2000,"v":1.943},{"y":2005,"v":2.973},{"y":2010,"v":3.79},{"y":2015,"v":5.344},{"y":2016,"v":5.702},{"y":2017,"v":6.213},{"y":2018,"v":7.248},{"y":2019,"v":7.933},{"y":2020,"v":8.641},{"y":2021,"v":9.408},{"y":2022,"v":10.235},{"y":2023,"v":11.321},{"y":2024,"v":12.094}]},{"n":"Bangladesh","pts":[{"y":1980,"v":0.091},{"y":1985,"v":0.124},{"y":1990,"v":0.193},{"y":1995,"v":0.317},{"y":2000,"v":0.657},{"y":2005,"v":0.882},{"y":2010,"v":1.309},{"y":2015,"v":2.06},{"y":2020,"v":2.584},{"y":2024,"v":2.979}]},{"n":"Korea, Rep.","pts":[{"y":1980,"v":0.545},{"y":1985,"v":0.791},{"y":1990,"v":0.789},{"y":1995,"v":1.017},{"y":2000,"v":0.668},{"y":2005,"v":1.058},{"y":2010,"v":1.377},{"y":2015,"v":1.676},{"y":2020,"v":2.334},{"y":2024,"v":2.282}]},{"n":"Chile","pts":[{"y":1980,"v":0.002},{"y":1990,"v":0.07},{"y":1995,"v":0.206},{"y":2000,"v":0.425},{"y":2005,"v":0.739},{"y":2010,"v":0.713},{"y":2015,"v":1.058},{"y":2020,"v":1.505},{"y":2024,"v":1.42}]},{"n":"Japan","pts":[{"y":1980,"v":1.086},{"y":1985,"v":1.184},{"y":1990,"v":1.37},{"y":1995,"v":1.39},{"y":2000,"v":1.292},{"y":2005,"v":1.254},{"y":2010,"v":1.151},{"y":2015,"v":1.106},{"y":2020,"v":0.999},{"y":2024,"v":0.802}]}];

    const COLORS = {
      "China": "#E63946",
      "Indonesia": "#F4A261",
      "India": "#2A9D8F",
      "Bangladesh": "#6A4C93",
      "Korea, Rep.": "#1D3557",
      "Chile": "#457B9D",
      "Japan": "#A8DADC"
    };
    const DISPLAY = { "Korea, Rep.": "South Korea", "Egypt, Arab Rep.": "Egypt" };

    const W = 820, H = 460;
    const M = { top: 36, right: 130, bottom: 36, left: 52 };
    const yearMin = 1980, yearMax = 2024;
    const valMin = 0, valMax = 90;

    const xS = y => M.left + (y - yearMin) / (yearMax - yearMin) * (W - M.left - M.right);
    const yS = v => M.top + (valMax - v) / (valMax - valMin) * (H - M.top - M.bottom);

    function mkEl(tag, attrs, text) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
      if (text != null) el.textContent = text;
      return el;
    }

    const svg = mkEl("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%", style: "max-width:820px;display:block" });

    // Grid
    [0, 20, 40, 60, 80].forEach(v => {
      svg.appendChild(mkEl("line", { x1: M.left, y1: yS(v), x2: W - M.right, y2: yS(v), stroke: "#e2e8f0", "stroke-width": "1" }));
      svg.appendChild(mkEl("text", { x: M.left - 6, y: yS(v) + 4, "text-anchor": "end", fill: "#94a3b8", "font-size": "10", "font-family": "JetBrains Mono, monospace" }, v + "M mt"));
    });

    [1980, 1990, 2000, 2010, 2020].forEach(y => {
      svg.appendChild(mkEl("line", { x1: xS(y), y1: M.top, x2: xS(y), y2: H - M.bottom, stroke: "#f1f5f9", "stroke-width": "1" }));
      svg.appendChild(mkEl("text", { x: xS(y), y: H - M.bottom + 14, "text-anchor": "middle", fill: "#94a3b8", "font-size": "10", "font-family": "JetBrains Mono, monospace" }, y));
    });

    function resolveCollisions(items, minGap) {
      const sorted = items.slice().sort((a, b) => a.y - b.y);
      for (let pass = 0; pass < 30; pass++) {
        let moved = false;
        for (let i = 1; i < sorted.length; i++) {
          const gap = sorted[i].y - sorted[i - 1].y;
          if (gap < minGap) {
            const shift = (minGap - gap) / 2;
            sorted[i - 1].y -= shift;
            sorted[i].y += shift;
            moved = true;
          }
        }
        if (!moved) break;
      }
      for (const item of sorted) {
        item.y = Math.max(M.top + 6, Math.min(H - M.bottom - 6, item.y));
      }
      return sorted;
    }

    const endLabels = data.map(s => {
      const last = s.pts[s.pts.length - 1];
      return { s, y: yS(last.v) };
    });
    const resolved = resolveCollisions(endLabels, 13);

    const tip = document.getElementById("tip");
    const groups = [];

    data.forEach(s => {
      const color = COLORS[s.n] || "#888";
      const g = mkEl("g", {});

      const pathD = s.pts.map((p, i) => `${i === 0 ? "M" : "L"}${xS(p.y).toFixed(1)},${yS(p.v).toFixed(1)}`).join(" ");
      const line = mkEl("path", { d: pathD, stroke: color, "stroke-width": "2", fill: "none", "stroke-linejoin": "round", "stroke-linecap": "round" });
      g.appendChild(line);

      const hit = mkEl("path", { d: pathD, stroke: "transparent", "stroke-width": "14", fill: "none", cursor: "pointer" });
      g.appendChild(hit);

      const labelEntry = resolved.find(e => e.s === s);
      const labelY = labelEntry ? labelEntry.y : yS(s.pts[s.pts.length - 1].v);
      const last = s.pts[s.pts.length - 1];
      const actualY = yS(last.v);
      const displayName = DISPLAY[s.n] || s.n;

      if (Math.abs(actualY - labelY) > 3) {
        svg.appendChild(mkEl("line", {
          x1: W - M.right + 2, y1: actualY,
          x2: W - M.right + 6, y2: labelY,
          stroke: color, "stroke-width": "0.8", opacity: "0.4"
        }));
      }

      svg.appendChild(mkEl("text", {
        x: W - M.right + 8, y: labelY + 3.5,
        fill: color, "font-size": "9.5", "font-family": "JetBrains Mono, monospace", "font-weight": "500"
      }, `${last.v}M  ${displayName}`));

      hit.addEventListener("mousemove", e => {
        groups.forEach(gg => gg.setAttribute("opacity", "0.1"));
        g.setAttribute("opacity", "1");
        line.setAttribute("stroke-width", "3");
        const rect = svg.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const ratio = Math.max(0, Math.min(1, (mx - M.left) / (W - M.left - M.right)));
        const hoverYear = yearMin + ratio * (yearMax - yearMin);
        const closest = s.pts.reduce((a, b) => Math.abs(b.y - hoverYear) < Math.abs(a.y - hoverYear) ? b : a);
        tip.textContent = `${displayName}: ${closest.v}M mt (${closest.y})`;
        tip.style.opacity = "1";
        tip.style.left = (e.clientX + 14) + "px";
        tip.style.top = (e.clientY - 24) + "px";
      });
      hit.addEventListener("mouseleave", () => {
        groups.forEach(gg => gg.setAttribute("opacity", "1"));
        line.setAttribute("stroke-width", "2");
        tip.style.opacity = "0";
      });

      groups.push(g);
    });

    groups.forEach(g => svg.appendChild(g));
    document.getElementById("chart").appendChild(svg);
  </script>
</body>
</html>
