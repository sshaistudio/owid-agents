<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');
  body { font-family: 'Inter', sans-serif; margin: 0; padding: 32px 40px; background: #F6F5EE; color: #2B2A27; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; margin: 0 0 4px; color: #2B2A27; }
  .subtitle { font-size: 11px; color: #7A786F; margin: 0 0 24px; max-width: 520px; line-height: 1.5; }
  .source { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #7A786F; margin-top: 20px; letter-spacing: 0.3px; text-transform: uppercase; }
  .tooltip { position: fixed; pointer-events: none; background: #2B2A27; color: #F6F5EE; font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 6px 10px; border-radius: 2px; white-space: nowrap; opacity: 0; transition: opacity 0.15s; z-index: 10; }
</style></head><body>
<h1>Tuberculosis Treatment Coverage, 2023</h1>
<p class="subtitle">Share of estimated new and relapse TB cases that received treatment (%). Mongolia stands out as a major outlier at just 19%; seven countries report 100% coverage.</p>
<div id="chart" style="position:relative;"></div>
<div class="tooltip" id="tip"></div>
<p class="source">Source: WHO Global Health Observatory — Tuberculosis treatment coverage (TB_1)</p>
<script>
const data = [{"n":"Mongolia","v":19,"y":2023},{"n":"Ghana","v":44,"y":2023},{"n":"Solomon Islands","v":45,"y":2023},{"n":"Kiribati","v":47,"y":2023},{"n":"Montenegro","v":59,"y":2023},{"n":"Syria","v":62,"y":2023},{"n":"Mauritius","v":65,"y":2023},{"n":"Macao SAR, China","v":65,"y":2023},{"n":"Cameroon","v":65,"y":2023},{"n":"Iraq","v":66,"y":2023},{"n":"Madagascar","v":68,"y":2023},{"n":"Georgia","v":68,"y":2023},{"n":"Oman","v":69,"y":2023},{"n":"Palestine","v":70,"y":2023},{"n":"Vanuatu","v":70,"y":2023},{"n":"Bosnia & Herzegovina","v":70,"y":2023},{"n":"Gambia","v":72,"y":2023},{"n":"Ethiopia","v":73,"y":2023},{"n":"Yemen","v":74,"y":2023},{"n":"Puerto Rico","v":76,"y":2023},{"n":"Malaysia","v":77,"y":2023},{"n":"Guinea","v":78,"y":2023},{"n":"South Africa","v":79,"y":2023},{"n":"Philippines","v":79,"y":2023},{"n":"France","v":83,"y":2023},{"n":"Czechia","v":84,"y":2023},{"n":"Slovenia","v":85,"y":2023},{"n":"Sweden","v":86,"y":2023},{"n":"Spain","v":86,"y":2023},{"n":"Portugal","v":88,"y":2023},{"n":"Norway","v":88,"y":2023},{"n":"Guatemala","v":89,"y":2023},{"n":"Singapore","v":89,"y":2023},{"n":"United Kingdom","v":89,"y":2023},{"n":"Saudi Arabia","v":91,"y":2023},{"n":"South Korea","v":94,"y":2023},{"n":"Kazakhstan","v":95,"y":2023},{"n":"Antigua & Barbuda","v":100,"y":2023},{"n":"St. Vincent & Grenadines","v":100,"y":2023},{"n":"Malta","v":100,"y":2023},{"n":"Grenada","v":100,"y":2023},{"n":"Tuvalu","v":100,"y":2023},{"n":"Seychelles","v":100,"y":2023},{"n":"Dominica","v":100,"y":2023}];

const W = 720;
const barH = 13;
const gap = 3;
const rowH = barH + gap;
const labelW = 160;
const valW = 32;
const barMaxW = W - labelW - valW - 20;
const paddingTop = 40;
const paddingBottom = 24;
const H = data.length * rowH + paddingTop + paddingBottom;

const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
svg.setAttribute("width", "100%");
svg.style.maxWidth = W + "px";
document.getElementById("chart").appendChild(svg);

function mkEl(tag, attrs, text) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  if (text !== undefined) el.textContent = text;
  return el;
}

function colorForVal(v) {
  if (v >= 95) return "#3D7A5A";
  if (v >= 85) return "#5B9E78";
  if (v >= 75) return "#8BAD72";
  if (v >= 60) return "#C49A45";
  if (v >= 40) return "#C4715A";
  return "#B34B3B";
}

// X-axis tick lines
[0, 25, 50, 75, 100].forEach(v => {
  const x = labelW + (v / 100) * barMaxW;
  svg.appendChild(mkEl("line", { x1: x, y1: paddingTop - 8, x2: x, y2: H - paddingBottom + 4, stroke: "#E2E0D5", "stroke-width": "0.6" }));
  svg.appendChild(mkEl("text", {
    x, y: paddingTop - 12, "text-anchor": "middle",
    "font-family": "JetBrains Mono, monospace", "font-size": "8", fill: "#9A9890"
  }, v + "%"));
});

const tip = document.getElementById("tip");

data.forEach((d, i) => {
  const y = paddingTop + i * rowH;
  const color = colorForVal(d.v);
  const bw = (d.v / 100) * barMaxW;
  const g = mkEl("g", {});

  // Background track
  g.appendChild(mkEl("rect", { x: labelW, y, width: barMaxW, height: barH, fill: "#E2E0D5", rx: "2" }));
  // Value bar
  g.appendChild(mkEl("rect", { x: labelW, y, width: bw, height: barH, fill: color, rx: "2" }));
  // Country label
  g.appendChild(mkEl("text", {
    x: labelW - 5, y: y + barH - 2.5, "text-anchor": "end",
    "font-size": "9", fill: "#2B2A27"
  }, d.n));
  // Value label
  g.appendChild(mkEl("text", {
    x: labelW + bw + 5, y: y + barH - 2.5, "text-anchor": "start",
    "font-family": "JetBrains Mono, monospace", "font-size": "8.5", fill: "#7A786F"
  }, d.v + "%"));

  // Hover hit area
  const hit = mkEl("rect", { x: 0, y, width: W, height: rowH, fill: "transparent", cursor: "pointer" });
  hit.addEventListener("mouseenter", e => {
    document.querySelectorAll("g").forEach(el => el.setAttribute("opacity", "0.15"));
    g.setAttribute("opacity", "1");
    tip.textContent = `${d.n}: ${d.v}% of estimated TB cases treated`;
    tip.style.opacity = "1";
  });
  hit.addEventListener("mousemove", e => {
    tip.style.left = (e.clientX + 12) + "px";
    tip.style.top = (e.clientY - 28) + "px";
  });
  hit.addEventListener("mouseleave", () => {
    document.querySelectorAll("g").forEach(el => el.setAttribute("opacity", "1"));
    tip.style.opacity = "0";
  });
  g.appendChild(hit);
  svg.appendChild(g);
});
</script>
</body></html>
