<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
    body { font-family: "Inter", -apple-system, sans-serif; margin: 0; padding: 24px; background: #fff; color: #0f172a; }
    h1 { font-size: 18px; font-weight: 700; margin: 0 0 4px; }
    .subtitle { font-size: 13px; color: #64748b; margin: 0 0 20px; }
    #chart { width: 100%; max-width: 720px; }
    .source { font-size: 11px; color: #94a3b8; margin-top: 12px; }
    #tip {
      position: fixed; background: #1e293b; color: #f8fafc;
      padding: 6px 10px; border-radius: 4px; font-size: 12px;
      pointer-events: none; opacity: 0; transition: opacity 0.1s;
      white-space: nowrap; z-index: 999;
    }
  </style>
</head>
<body>
  <h1>HIV Treatment Scale-Up: Antiretroviral Therapy Coverage</h1>
  <p class="subtitle">% of people living with HIV receiving ART, 2010 vs. 2024 — a global health success story</p>
  <div id="chart"></div>
  <p class="source">Source: World Bank / WHO — Antiretroviral Therapy Coverage (SH.HIV.ARTC.ZS)</p>
  <div id="tip"></div>
  <script>
    const data = [
      {"n":"Ireland","a":61,"b":98},
      {"n":"Botswana","a":49,"b":95},
      {"n":"Eswatini","a":31,"b":94},
      {"n":"Burundi","a":23,"b":93},
      {"n":"Cambodia","a":50,"b":92},
      {"n":"Ethiopia","a":33,"b":88},
      {"n":"Cameroon","a":15,"b":88},
      {"n":"Kenya","a":31,"b":87},
      {"n":"Benin","a":30,"b":87},
      {"n":"Haiti","a":13,"b":87},
      {"n":"Cote d'Ivoire","a":15,"b":78},
      {"n":"Angola","a":9,"b":48},
      {"n":"Ghana","a":13,"b":47},
      {"n":"Indonesia","a":5,"b":41},
      {"n":"Congo, Rep.","a":15,"b":34},
      {"n":"Djibouti","a":6,"b":25},
      {"n":"Afghanistan","a":1,"b":11}
    ];

    const W = 700, H = 580;
    const pad = { left: 130, right: 145, top: 50, bottom: 30 };
    const minV = 0, maxV = 100;

    function scale(v) {
      return pad.top + (maxV - v) / (maxV - minV) * (H - pad.top - pad.bottom);
    }

    function colorForChange(d) {
      const c = d.b - d.a;
      if (c > 65) return "#3D7A5A";
      if (c > 50) return "#5B9E78";
      if (c > 35) return "#8BAD72";
      if (c > 20) return "#C49A45";
      return "#C4715A";
    }

    function resolveCollisions(items, minGap) {
      const sorted = items.slice().sort((a, b) => a.y - b.y);
      for (let pass = 0; pass < 30; pass++) {
        let moved = false;
        for (let i = 1; i < sorted.length; i++) {
          const gap = sorted[i].y - sorted[i - 1].y;
          if (gap < minGap) {
            const shift = (minGap - gap) / 2;
            sorted[i - 1].y -= shift;
            sorted[i].y += shift;
            moved = true;
          }
        }
        if (!moved) break;
      }
      return sorted;
    }

    const ns = "http://www.w3.org/2000/svg";
    function el(tag, attrs, text) {
      const e = document.createElementNS(ns, tag);
      for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
      if (text !== undefined) e.textContent = text;
      return e;
    }

    const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%", style: "overflow:visible" });
    document.getElementById("chart").appendChild(svg);

    // Column headers
    svg.appendChild(el("text", { x: pad.left, y: pad.top - 18, "text-anchor": "middle", fill: "#7A786F", "font-family": "JetBrains Mono", "font-size": "10", "font-weight": "500" }, "2010"));
    svg.appendChild(el("text", { x: W - pad.right, y: pad.top - 18, "text-anchor": "middle", fill: "#7A786F", "font-family": "JetBrains Mono", "font-size": "10", "font-weight": "500" }, "2024"));

    // Axis lines
    svg.appendChild(el("line", { x1: pad.left, y1: pad.top - 8, x2: pad.left, y2: H - pad.bottom, stroke: "#E2E0D5", "stroke-width": "1" }));
    svg.appendChild(el("line", { x1: W - pad.right, y1: pad.top - 8, x2: W - pad.right, y2: H - pad.bottom, stroke: "#E2E0D5", "stroke-width": "1" }));

    // 80% reference line
    const refY = scale(80);
    svg.appendChild(el("line", { x1: pad.left, y1: refY, x2: W - pad.right, y2: refY, stroke: "#E2E0D5", "stroke-dasharray": "4,3", "stroke-width": "0.8" }));
    svg.appendChild(el("text", { x: pad.left + 4, y: refY - 4, fill: "#B0ADA4", "font-family": "JetBrains Mono", "font-size": "9" }, "80% target"));

    // Build rows
    const rows = data.map(d => {
      const ya = scale(d.a);
      const yb = scale(d.b);
      const color = colorForChange(d);
      const g = el("g", { style: "cursor:default" });

      // Connecting line
      const line = el("line", {
        x1: pad.left, y1: ya, x2: W - pad.right, y2: yb,
        stroke: color, "stroke-width": "1.5", opacity: "1"
      });
      g.appendChild(line);

      // Dots
      g.appendChild(el("circle", { cx: pad.left, cy: ya, r: "4", fill: color }));
      g.appendChild(el("circle", { cx: W - pad.right, cy: yb, r: "4", fill: color }));

      // Hit area
      const hit = el("line", {
        x1: pad.left, y1: ya, x2: W - pad.right, y2: yb,
        stroke: "transparent", "stroke-width": "12"
      });
      g.appendChild(hit);

      return { d, g, ya, yb, line, color };
    });

    rows.forEach(r => svg.appendChild(r.g));

    // Left labels
    const leftLabels = resolveCollisions(rows.map(r => ({ y: r.ya, row: r })), 12);
    leftLabels.forEach(item => {
      const lb = el("text", {
        x: pad.left - 8,
        y: item.y + 4,
        "text-anchor": "end",
        fill: "#2B2A27",
        "font-family": "Inter",
        "font-size": "10",
        "font-weight": "500"
      });
      lb.textContent = `${item.row.d.n}  ${item.row.d.a}%`;
      svg.appendChild(lb);
      // Leader line if moved
      if (Math.abs(item.y - item.row.ya) > 3) {
        svg.appendChild(el("line", { x1: pad.left - 5, y1: item.row.ya, x2: pad.left - 5, y2: item.y, stroke: "#D0CEC6", "stroke-width": "0.5" }));
      }
    });

    // Right labels
    const rightLabels = resolveCollisions(rows.map(r => ({ y: r.yb, row: r })), 12);
    rightLabels.forEach(item => {
      const lb = el("text", {
        x: W - pad.right + 8,
        y: item.y + 4,
        "text-anchor": "start",
        fill: "#2B2A27",
        "font-family": "Inter",
        "font-size": "10",
        "font-weight": "500"
      });
      lb.textContent = `${item.row.d.b}%  ${item.row.d.n}`;
      svg.appendChild(lb);
      if (Math.abs(item.y - item.row.yb) > 3) {
        svg.appendChild(el("line", { x1: W - pad.right + 5, y1: item.row.yb, x2: W - pad.right + 5, y2: item.y, stroke: "#D0CEC6", "stroke-width": "0.5" }));
      }
    });

    // Legend
    const lgnd = [
      ["#3D7A5A", "+65pp or more"],
      ["#5B9E78", "+50–65pp"],
      ["#8BAD72", "+35–50pp"],
      ["#C49A45", "+20–35pp"],
      ["#C4715A", "<20pp gain"]
    ];
    let lx = pad.left;
    lgnd.forEach(([c, label]) => {
      svg.appendChild(el("rect", { x: lx, y: H - pad.bottom + 12, width: 10, height: 10, fill: c, rx: "2" }));
      const lt = el("text", { x: lx + 14, y: H - pad.bottom + 21, fill: "#7A786F", "font-family": "Inter", "font-size": "9" }, label);
      svg.appendChild(lt);
      lx += 110;
    });

    // Hover
    const tip = document.getElementById("tip");
    rows.forEach(r => {
      r.g.addEventListener("mousemove", e => {
        rows.forEach(o => {
          o.line.setAttribute("opacity", o === r ? "1" : "0.1");
        });
        const change = r.d.b - r.d.a;
        tip.textContent = `${r.d.n}: ${r.d.a}% → ${r.d.b}% (+${change}pp)`;
        tip.style.opacity = "1";
        tip.style.left = (e.clientX + 12) + "px";
        tip.style.top = (e.clientY - 20) + "px";
      });
      r.g.addEventListener("mouseleave", () => {
        rows.forEach(o => o.line.setAttribute("opacity", "1"));
        tip.style.opacity = "0";
      });
    });
  </script>
</body>
</html>
