function colorForRate(v) {
  if (v >= 35) return "#3D7A5A";
  if (v >= 28) return "#5B9E78";
  if (v >= 20) return "#C49A45";
  if (v >= 13) return "#C4715A";
  return "#B34B3B";
}

const CELL_W = 118, CELL_H = 58, SPARK_H = 28;
const tip = document.getElementById("tip");
const grid = document.getElementById("grid");

data.forEach(d => {
  const cell = document.createElement("div");
  cell.className = "cell";

  const nameEl = document.createElement("div");
  nameEl.className = "cell-name";
  nameEl.textContent = d.n;
  cell.appendChild(nameEl);

  const canvas = document.createElement("canvas");
  const dpr = window.devicePixelRatio || 1;
  canvas.width = CELL_W * dpr;
  canvas.height = SPARK_H * dpr;
  canvas.style.width = "100%";
  canvas.style.height = SPARK_H + "px";
  canvas.style.display = "block";
  cell.appendChild(canvas);

  const vals = d.s.map((v, i) => ({ i, v })).filter(p => p.v !== null);
  const vMin = Math.min(...vals.map(p => p.v));
  const vMax = Math.max(...vals.map(p => p.v));
  const n = d.s.length;

  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  const cw = CELL_W, ch = SPARK_H;

  const accColor = colorForRate(d.l);
  ctx.strokeStyle = accColor;
  ctx.lineWidth = 1.4;
  ctx.lineJoin = "round";
  ctx.beginPath();
  let started = false;
  d.s.forEach((v, i) => {
    if (v === null) return;
    const x = (i / (n - 1)) * cw;
    const y = ch - ((v - vMin) / (vMax - vMin || 1)) * (ch - 2) - 1;
    if (!started) { ctx.moveTo(x, y); started = true; }
    else ctx.lineTo(x, y);
  });
  ctx.stroke();

  const valRow = document.createElement("div");
  valRow.className = "cell-vals";
  const startEl = document.createElement("span");
  startEl.style.color = colorForRate(d.e || 0);
  startEl.textContent = (d.e !== null ? d.e + "%" : "");
  const endEl = document.createElement("span");
  endEl.style.color = colorForRate(d.l);
  endEl.style.fontWeight = "500";
  endEl.textContent = d.l + "%";
  valRow.appendChild(startEl);
  valRow.appendChild(endEl);
  cell.appendChild(valRow);

  // Hover crosshair
  let crossX = null;
  canvas.addEventListener("mousemove", e => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const ratio = mx / rect.width;
    const idx = Math.round(ratio * (n - 1));
    const year = d.y0 + idx;
    const v = d.s[idx];
    if (v !== null) {
      tip.textContent = `${d.n} (${year}): ${v}%`;
      tip.style.opacity = "1";
      tip.style.left = (e.clientX + 14) + "px";
      tip.style.top = (e.clientY - 28) + "px";
    }
    // Redraw with crosshair
    ctx.clearRect(0, 0, cw, ch);
    ctx.strokeStyle = accColor;
    ctx.lineWidth = 1.4;
    ctx.lineJoin = "round";
    ctx.beginPath();
    let st = false;
    d.s.forEach((pv, pi) => {
      if (pv === null) return;
      const px = (pi / (n - 1)) * cw;
      const py = ch - ((pv - vMin) / (vMax - vMin || 1)) * (ch - 2) - 1;
      if (!st) { ctx.moveTo(px, py); st = true; }
      else ctx.lineTo(px, py);
    });
    ctx.stroke();
    const cx2 = ratio * cw;
    ctx.strokeStyle = "#C2C0B5";
    ctx.lineWidth = 0.5;
    ctx.setLineDash([2, 2]);
    ctx.beginPath();
    ctx.moveTo(cx2, 0);
    ctx.lineTo(cx2, ch);
    ctx.stroke();
    ctx.setLineDash([]);
  });
  canvas.addEventListener("mouseleave", () => {
    tip.style.opacity = "0";
    ctx.clearRect(0, 0, cw, ch);
    ctx.strokeStyle = accColor;
    ctx.lineWidth = 1.4;
    ctx.lineJoin = "round";
    ctx.beginPath();
    let st = false;
    d.s.forEach((pv, pi) => {
      if (pv === null) return;
      const px = (pi / (n - 1)) * cw;
      const py = ch - ((pv - vMin) / (vMax - vMin || 1)) * (ch - 2) - 1;
      if (!st) { ctx.moveTo(px, py); st = true; }
      else ctx.lineTo(px, py);
    });
    ctx.stroke();
  });

  grid.appendChild(cell);
});
