<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
    body { font-family: 'Inter', -apple-system, sans-serif; margin: 0; padding: 24px; background: #fff; color: #0f172a; }
    h1 { font-size: 18px; font-weight: 700; margin: 0 0 4px; }
    .subtitle { font-size: 13px; color: #64748b; margin: 0 0 20px; }
    .source { font-size: 11px; color: #94a3b8; margin-top: 12px; }
    .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 0; max-width: 860px; border-top: 1px solid #E2E0D5; border-left: 1px solid #E2E0D5; }
    .cell { padding: 10px 8px 8px; border-bottom: 1px solid #E2E0D5; border-right: 1px solid #E2E0D5; cursor: crosshair; position: relative; min-height: 74px; }
    .cell-name { font-size: 8.5px; font-weight: 500; color: #2B2A27; line-height: 1.2; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cell-vals { display: flex; justify-content: space-between; font-size: 7.5px; color: #7A786F; font-family: 'JetBrains Mono', monospace; margin-top: 3px; }
    #tip {
      position: fixed; pointer-events: none; opacity: 0; transition: opacity 0.1s;
      background: #1e293b; color: #f8fafc; font-size: 12px; padding: 6px 10px;
      border-radius: 6px; white-space: nowrap; z-index: 10;
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body>
  <h1>BCG Tuberculosis Vaccine Coverage, 1990–2024</h1>
  <p class="subtitle">% of one-year-old children immunized against tuberculosis. Most developing nations have achieved high and stable BCG coverage.</p>
  <div class="grid" id="grid"></div>
  <p class="source">Source: World Bank &nbsp;·&nbsp; Indicator: SH.IMM.IBCG</p>
  <div id="tip"></div>
  <script>
    const data = [{"n":"Afghanistan","s":[30,21,19,17,15,31,47,43,35,38,30,43,46,44,51,57,60,60,66,64,68,73,78,72,74,76,78,80,82,74,72,65,69,68,68],"y0":1990,"e":30,"l":68},{"n":"Angola","s":[48,53,47,53,48,60,65,70,61,52,54,72,77,56,63,51,53,75,74,74,73,72,72,71,72,64,40,69,74,72,62,61,67,80,68],"y0":1990,"e":48,"l":68},{"n":"Bangladesh","s":[86,87,89,93,95,93,90,92,91,92,94,95,95,93,96,97,97,98,99,99,98,99,98,99,99,99,99,99,99,99,99,99,99,99,99],"y0":1990,"e":86,"l":99},{"n":"Bolivia","s":[65,67,81,84,92,87,98,88,85,95,92,90,93,96,86,88,87,87,90,93,98,99,99,91,92,99,96,93,90,80,82,78,76,74,68],"y0":1990,"e":65,"l":68},{"n":"Brazil","s":[79,87,90,95,93,99,99,99,99,99,99,99,99,99,99,99,99,99,99,99,99,99,99,99,99,99,96,94,98,85,73,69,88,79,95],"y0":1990,"e":79,"l":95},{"n":"Burkina Faso","s":[95,88,85,80,75,72,73,75,79,77,81,80,90,83,99,99,99,99,99,99,99,99,97,96,98,98,98,98,98,98,98,98,98,98,98],"y0":1990,"e":95,"l":98},{"n":"Cambodia","s":[52,56,50,57,63,69,68,67,69,78,81,64,63,76,95,87,87,90,98,96,95,98,99,96,98,99,99,99,90,95,94,92,95,91,90],"y0":1990,"e":52,"l":90},{"n":"Cameroon","s":[76,69,62,58,59,62,69,75,80,78,78,79,79,82,83,90,96,89,91,81,83,83,84,84,86,81,80,85,82,78,79,80,69,93,93],"y0":1990,"e":76,"l":93},{"n":"Chad","s":[59,40,34,34,43,43,39,45,45,45,49,52,46,40,41,41,57,45,31,47,58,53,62,60,58,70,59,59,51,75,85,92,92,92,92],"y0":1990,"e":59,"l":92},{"n":"China","s":[99,97,94,92,89,79,84,83,83,84,84,85,85,85,86,86,92,94,97,99,99,99,99,99,99,99,99,99,99,99,99,99,99,99,99],"y0":1990,"e":99,"l":99},{"n":"Colombia","s":[95,95,88,96,99,99,99,97,85,80,91,87,87,97,92,94,96,93,93,90,84,87,89,85,89,90,88,91,89,90,89,87,87,87,85],"y0":1990,"e":95,"l":85},{"n":"Congo, Dem. Rep.","s":[65,21,32,43,46,34,25,25,25,30,36,41,49,59,67,71,72,76,79,83,83,65,83,85,80,79,83,85,86,84,83,67,77,77,77],"y0":1990,"e":65,"l":77},{"n":"Cote d'Ivoire","s":[62,65,70,74,75,69,68,73,71,74,80,80,79,78,71,85,77,94,91,95,79,76,93,85,85,80,95,93,94,92,84,86,85,87,88],"y0":1990,"e":62,"l":88},{"n":"Ecuador","s":[89,82,99,99,99,99,99,99,98,99,99,99,99,99,99,99,99,99,98,99,98,98,94,90,89,88,84,88,90,86,81,75,76,76,76],"y0":1990,"e":89,"l":76},{"n":"Ethiopia","s":[64,29,26,36,65,61,57,54,55,55,57,58,60,61,63,65,66,68,69,71,72,74,70,68,69,70,72,73,71,69,70,73,73,79,84],"y0":1990,"e":64,"l":84},{"n":"Ghana","s":[71,77,83,85,86,87,87,88,90,98,99,94,92,92,92,99,99,99,99,99,99,98,98,98,99,97,94,99,98,96,93,99,96,97,92],"y0":1990,"e":71,"l":92},{"n":"Guatemala","s":[62,43,57,69,78,79,76,88,89,93,95,93,96,97,98,96,96,88,99,93,99,91,94,99,93,92,91,93,88,90,93,85,87,95,83],"y0":1990,"e":62,"l":83},{"n":"Haiti","s":[72,72,73,73,73,74,72,72,72,71,72,73,73,74,75,75,75,76,76,76,77,77,80,82,85,83,70,73,73,73,77,67,68,68,68],"y0":1990,"e":72,"l":68},{"n":"Honduras","s":[70,99,92,95,99,97,99,99,96,93,99,99,94,91,98,98,97,99,99,99,99,99,98,97,96,94,93,92,93,87,83,82,77,72,73],"y0":1990,"e":70,"l":73},{"n":"India","s":[66,62,65,69,71,81,79,72,73,74,74,75,75,77,80,86,86,87,86,88,89,90,90,91,89,87,89,92,92,92,85,84,91,89,91],"y0":1990,"e":66,"l":91},{"n":"Indonesia","s":[74,75,76,78,77,77,87,85,84,83,81,80,82,83,85,86,88,83,80,78,84,89,88,90,90,90,90,93,92,90,87,81,93,88,88],"y0":1990,"e":74,"l":88},{"n":"Iran, Islamic Rep.","s":[95,91,99,99,99,96,96,91,99,99,99,91,97,99,99,99,99,99,99,99,99,99,99,99,99,99,99,99,99,99,98,99,99,99,99],"y0":1990,"e":95,"l":99},{"n":"Iraq","s":[96,96,96,96,97,97,96,95,94,93,93,93,94,94,94,92,89,92,87,92,90,94,99,99,99,94,87,92,95,98,99,94,96,93,95],"y0":1990,"e":96,"l":95},{"n":"Kenya","s":[92,94,96,96,97,97,96,96,94,91,93,95,91,87,87,85,92,92,98,99,99,99,97,92,94,87,97,87,93,96,97,94,94,90,87],"y0":1990,"e":92,"l":87}];

    const grid = document.getElementById("grid");
    const tip = document.getElementById("tip");
    const cellW = 108, cellH = 38;

    // Sort by latest value descending
    const sorted = data.slice().sort((a, b) => b.l - a.l);

    sorted.forEach(d => {
      const cell = document.createElement("div");
      cell.className = "cell";

      const nameEl = document.createElement("div");
      nameEl.className = "cell-name";
      nameEl.textContent = d.n;
      cell.appendChild(nameEl);

      const canvas = document.createElement("canvas");
      canvas.width = cellW;
      canvas.height = cellH;
      canvas.style.width = "100%";
      canvas.style.height = cellH + "px";
      canvas.style.display = "block";
      cell.appendChild(canvas);

      const valsEl = document.createElement("div");
      valsEl.className = "cell-vals";
      const startLbl = document.createElement("span");
      startLbl.textContent = d.e + "%";
      const endLbl = document.createElement("span");
      endLbl.textContent = d.l + "%";
      valsEl.appendChild(startLbl);
      valsEl.appendChild(endLbl);
      cell.appendChild(valsEl);

      grid.appendChild(cell);

      // Draw sparkline
      function drawSparkline(highlightIdx) {
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, cellW, cellH);
        const minV = Math.max(0, Math.min(...d.s) - 5);
        const maxV = Math.min(100, Math.max(...d.s) + 5);
        const norm = v => cellH - ((v - minV) / (maxV - minV || 1)) * cellH;

        if (highlightIdx !== undefined) {
          const x = (highlightIdx / (d.s.length - 1)) * cellW;
          ctx.strokeStyle = "#E2E0D5";
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, cellH); ctx.stroke();
        }

        ctx.strokeStyle = "#EA5E33";
        ctx.lineWidth = 1.4;
        ctx.lineJoin = "round";
        ctx.beginPath();
        d.s.forEach((v, i) => {
          const x = (i / (d.s.length - 1)) * cellW;
          const y = norm(v);
          i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        });
        ctx.stroke();

        if (highlightIdx !== undefined) {
          const hx = (highlightIdx / (d.s.length - 1)) * cellW;
          const hy = norm(d.s[highlightIdx]);
          ctx.fillStyle = "#EA5E33";
          ctx.beginPath(); ctx.arc(hx, hy, 2.5, 0, Math.PI * 2); ctx.fill();
        }
      }

      drawSparkline();

      canvas.addEventListener("mousemove", e => {
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const idx = Math.round(Math.max(0, Math.min(1, mx / rect.width)) * (d.s.length - 1));
        const year = d.y0 + idx;
        drawSparkline(idx);
        tip.textContent = `${d.n}  ${year}: ${d.s[idx]}%`;
        tip.style.opacity = "1";
        tip.style.left = (e.clientX + 12) + "px";
        tip.style.top = (e.clientY - 20) + "px";
      });

      canvas.addEventListener("mouseleave", () => {
        drawSparkline();
        tip.style.opacity = "0";
      });
    });
  </script>
</body>
</html>
