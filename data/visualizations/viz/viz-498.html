<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');
  body { font-family: 'Inter', sans-serif; margin: 0; padding: 32px 40px; background: #F6F5EE; color: #2B2A27; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; margin: 0 0 4px; color: #2B2A27; }
  .subtitle { font-size: 11px; color: #7A786F; margin: 0 0 24px; max-width: 520px; line-height: 1.5; }
  .source { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #7A786F; margin-top: 20px; letter-spacing: 0.3px; text-transform: uppercase; }
  svg text { font-family: 'Inter', sans-serif; }
  .tooltip { position: fixed; pointer-events: none; background: #2B2A27; color: #F6F5EE; font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 6px 10px; border-radius: 2px; white-space: nowrap; opacity: 0; transition: opacity 0.15s; z-index: 10; }
</style></head><body>
<h1>Severe Wasting in Young Children Has Fallen — But Not in India</h1>
<p class="subtitle">Prevalence of severe wasting (weight-for-height below -3 SD, % of children under 5) in the early 2000s versus most recent survey. Most high-burden countries improved; India is the notable outlier.</p>
<div id="chart" style="position:relative;"></div>
<div class="tooltip" id="tip"></div>
<p class="source">Source: World Bank — SH.SVR.WAST.ZS</p>
<script>
// Data exported from notebook -- do not modify
const data = [{"n":"Cambodia","a":7.5,"b":2.4,"y":2000},{"n":"Comoros","a":7.2,"b":1.2,"y":2000},{"n":"India","a":6.8,"b":7.5,"y":2006},{"n":"Congo, Dem. Rep.","a":6.1,"b":1.9,"y":2001},{"n":"Cote d'Ivoire","a":5.7,"b":2.4,"y":2007},{"n":"Guinea-Bissau","a":4.8,"b":1.5,"y":2000},{"n":"Cent. African Rep.","a":4.7,"b":1.6,"y":2000},{"n":"Guyana","a":4.3,"b":1.9,"y":2000},{"n":"Chad","a":4.2,"b":1.5,"y":2000},{"n":"Guinea","a":4.2,"b":1.3,"y":2005},{"n":"Azerbaijan","a":4.1,"b":0.6,"y":2000},{"n":"Ethiopia","a":3.8,"b":1.1,"y":2000},{"n":"Afghanistan","a":3.8,"b":1.2,"y":2004},{"n":"Benin","a":3.1,"b":2.4,"y":2001},{"n":"Kenya","a":2.9,"b":0.6,"y":2000},{"n":"Ghana","a":2.8,"b":1.2,"y":2003},{"n":"Burkina Faso","a":2.7,"b":0.9,"y":2009},{"n":"Bangladesh","a":2.5,"b":1.7,"y":2000},{"n":"Gambia","a":2.5,"b":0.6,"y":2000},{"n":"Iraq","a":2.4,"b":0.9,"y":2000}];

// Fix label names
data[6].n = "Cent. African Rep.";

const W = 700, H = 580;
const pad = { left: 130, right: 140, top: 44, bottom: 20 };

const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
svg.setAttribute("width", "100%");
svg.style.maxWidth = W + "px";
svg.style.cursor = "default";
document.getElementById("chart").appendChild(svg);

function mkEl(tag, attrs) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

const allVals = data.flatMap(d => [d.a, d.b]);
const minV = 0, maxV = Math.ceil(Math.max(...allVals) * 1.1);

function resolveCollisions(items, minGap) {
  const sorted = items.slice().sort((a, b) => a.y - b.y);
  for (let pass = 0; pass < 30; pass++) {
    let moved = false;
    for (let i = 1; i < sorted.length; i++) {
      const gap = sorted[i].y - sorted[i - 1].y;
      if (gap < minGap) {
        const shift = (minGap - gap) / 2;
        sorted[i - 1].y -= shift;
        sorted[i].y += shift;
        moved = true;
      }
    }
    if (!moved) break;
  }
  return sorted;
}

const scale = v => pad.top + (maxV - v) / (maxV - minV) * (H - pad.top - pad.bottom);
const xLeft = pad.left;
const xRight = W - pad.right;

// Column headers
const hdr = mkEl("text", {
  x: xLeft, y: pad.top - 16,
  "text-anchor": "middle",
  "font-family": "'JetBrains Mono', monospace",
  "font-size": "10", fill: "#7A786F"
});
hdr.textContent = "Early 2000s";
svg.appendChild(hdr);

const hdr2 = mkEl("text", {
  x: xRight, y: pad.top - 16,
  "text-anchor": "middle",
  "font-family": "'JetBrains Mono', monospace",
  "font-size": "10", fill: "#7A786F"
});
hdr2.textContent = "Recent";
svg.appendChild(hdr2);

// Axis dots
[xLeft, xRight].forEach(x => {
  for (let v = 0; v <= maxV; v += 2) {
    svg.appendChild(mkEl("line", {
      x1: x - 3, y1: scale(v),
      x2: x + 3, y2: scale(v),
      stroke: "#C2C0B5", "stroke-width": "0.5"
    }));
    if (v % 2 === 0) {
      const lbl = mkEl("text", {
        x: x + (x === xLeft ? -8 : 8),
        y: scale(v) + 3.5,
        "text-anchor": x === xLeft ? "end" : "start",
        "font-family": "'JetBrains Mono', monospace",
        "font-size": "9", fill: "#7A786F"
      });
      lbl.textContent = v + "%";
      svg.appendChild(lbl);
    }
  }
});

// Left endpoint labels (sorted)
const leftLabels = data.map(d => ({ name: d.n, raw: scale(d.a), y: scale(d.a) }));
const leftResolved = resolveCollisions(leftLabels, 13);
const leftYFor = {};
leftResolved.forEach(item => { leftYFor[item.name] = item.y; });

// Right endpoint labels (sorted)
const rightLabels = data.map(d => ({ name: d.n, raw: scale(d.b), y: scale(d.b) }));
const rightResolved = resolveCollisions(rightLabels, 13);
const rightYFor = {};
rightResolved.forEach(item => { rightYFor[item.name] = item.y; });

function colorForChange(d) {
  const change = d.b - d.a;
  if (change > 2) return "#B34B3B";     // increased -- bad
  if (change > -1) return "#C49A45";    // nearly flat
  if (change > -3) return "#8BAD72";    // modest decline
  if (change > -5) return "#5B9E78";    // good decline
  return "#3D7A5A";                     // major decline
}

// Draw rows
const groups = [];
for (const d of data) {
  const color = colorForChange(d);
  const yA = scale(d.a);
  const yB = scale(d.b);
  const g = mkEl("g", {});

  // Connecting line
  const line = mkEl("line", {
    x1: xLeft, y1: yA, x2: xRight, y2: yB,
    stroke: color, "stroke-width": "1.5"
  });
  g.appendChild(line);

  // Dots
  g.appendChild(mkEl("circle", { cx: xLeft, cy: yA, r: "3", fill: color }));
  g.appendChild(mkEl("circle", { cx: xRight, cy: yB, r: "3", fill: color }));

  // Invisible hit area
  const hit = mkEl("line", {
    x1: xLeft, y1: yA, x2: xRight, y2: yB,
    stroke: "transparent", "stroke-width": "12", cursor: "pointer"
  });
  g.appendChild(hit);

  // Left label (country name)
  const leftY = leftYFor[d.n];
  if (Math.abs(leftY - yA) > 2) {
    g.appendChild(mkEl("line", {
      x1: xLeft - 2, y1: yA, x2: xLeft - 8, y2: leftY,
      stroke: color, "stroke-width": "0.5", opacity: "0.4"
    }));
  }
  const lTxt = mkEl("text", {
    x: xLeft - 10, y: leftY + 3.5,
    "text-anchor": "end",
    "font-size": "9.5", fill: "#2B2A27"
  });
  lTxt.textContent = d.n;
  g.appendChild(lTxt);

  // Right label (value only)
  const rightY = rightYFor[d.n];
  if (Math.abs(rightY - yB) > 2) {
    g.appendChild(mkEl("line", {
      x1: xRight + 2, y1: yB, x2: xRight + 8, y2: rightY,
      stroke: color, "stroke-width": "0.5", opacity: "0.4"
    }));
  }
  const rTxt = mkEl("text", {
    x: xRight + 10, y: rightY + 3.5,
    "text-anchor": "start",
    "font-size": "9.5", fill: "#2B2A27"
  });
  rTxt.textContent = d.b.toFixed(1) + "%";
  g.appendChild(rTxt);

  groups.push({ g, d, hit });
  svg.appendChild(g);
}

// Interactivity
const tip = document.getElementById("tip");
groups.forEach(({ g, d, hit }) => {
  hit.addEventListener("mouseenter", () => {
    groups.forEach(other => { other.g.style.opacity = "0.12"; });
    g.style.opacity = "1";
  });
  hit.addEventListener("mousemove", e => {
    const change = (d.b - d.a).toFixed(1);
    const sign = d.b >= d.a ? "+" : "";
    tip.textContent = `${d.n}: ${d.a}% → ${d.b}% (${sign}${change}pp)`;
    tip.style.opacity = "1";
    tip.style.left = (e.clientX + 12) + "px";
    tip.style.top = (e.clientY - 20) + "px";
  });
  hit.addEventListener("mouseleave", () => {
    groups.forEach(other => { other.g.style.opacity = "1"; });
    tip.style.opacity = "0";
  });
});

</script>
</body></html>
